<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>GreenGuard Halo Garden — Birdbath · Airflow</title>
<style>
:root{--gold:#c6a96b;--ink:#eef1ea}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;background:radial-gradient(1300px 900px at 55% -5%,#101712,#0a0f0b 70%),#080c09;overflow:hidden;
 font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;touch-action:none;-webkit-font-smoothing:antialiased;color:var(--ink)}
#bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 11px;
 background:rgba(8,12,9,.94);border-bottom:1px solid rgba(198,169,107,.25);z-index:10}
#brand{font-family:Georgia,'Times New Roman',serif;color:var(--gold);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-right:4px}
.grp{display:flex;gap:5px;flex-wrap:wrap}
.btn{background:rgba(14,18,14,.6);border:1px solid rgba(198,169,107,.28);color:var(--ink);
 padding:6px 10px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.05em;
 text-transform:uppercase;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn.active{background:var(--gold);border-color:var(--gold);color:#15110a}
.btn input{width:20px;height:16px;border:none;background:none;cursor:pointer;padding:0;vertical-align:middle}
#stat{margin-left:auto;font-size:10.5px;color:var(--gold);letter-spacing:.04em;white-space:nowrap}
#c{flex:1;min-height:0;width:100%;display:block}
#wtab{position:absolute;left:12px;bottom:12px;z-index:8;background:rgba(8,12,9,.62);border:1px solid rgba(198,169,107,.2);border-radius:10px;padding:7px 9px;backdrop-filter:blur(12px)}
table{border-collapse:collapse;font-size:10.5px;color:#bcd4c4}td,th{border:1px solid rgba(198,169,107,.18);padding:2px 7px;text-align:right}th{color:var(--gold)}
#hint{position:absolute;right:12px;bottom:11px;font-size:10px;color:rgba(230,238,230,.4);letter-spacing:.1em;z-index:8;pointer-events:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080c09;color:#9aa69c;font-size:12px;letter-spacing:.1em;text-transform:uppercase;z-index:20}
