<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>GreenGuard Prototypes</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1300px 900px at 55% -5%,#101712,#0a0f0b 70%),#080c09;
    color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none}
  #c{position:fixed;inset:0;display:block}
  /* top dropdowns */
  #top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:30;pointer-events:none}
  #top select{pointer-events:auto;font:inherit;font-size:14px;color:#eef2f7;background:rgba(20,28,22,.86);
    border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  /* bottom button bar — wraps, never covers the model center */
  #bar{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;display:flex;flex-wrap:wrap;justify-content:center;
    gap:6px;align-items:flex-end}
  .btn{font:inherit;font-size:13px;color:#eef2f7;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    padding:9px 13px;border-radius:10px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:.15s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.on{background:var(--gold,#d8b25a);color:#1a1306;border-color:var(--gold,#d8b25a);font-weight:600}
  #color-label{display:flex;align-items:center;gap:6px}
  #color-pick{width:24px;height:24px;border:none;background:none;cursor:pointer;padding:0}
  /* cut sheet panel */
  #cut{position:fixed;right:10px;top:58px;width:240px;max-height:70vh;overflow:auto;z-index:35;display:none;
    background:rgba(12,18,14,.92);border:1px solid rgba(216,178,90,.4);border-radius:12px;padding:12px 14px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;line-height:1.5}
  #cut.show{display:block}
  #cut .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  #cut .row:last-child{border-bottom:none}
  #cut .k{color:#9fb0c4}
  #cut .v{color:#eef2f7;text-align:right;font-weight:600}
  #fsx{position:fixed;top:12px;right:12px;z-index:60;display:none;width:42px;height:42px;border-radius:50%;
    font-size:20px;color:#fff;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);cursor:pointer}
  body.fs #top,body.fs #cut{display:none}
  body.fs #fsx{display:block}
  body.fs #bar{bottom:10px}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;color:#9fb0c4;pointer-events:none}
  @media (max-width:760px){
    #top select{font-size:13px;padding:7px 8px;flex:1}
    .btn{font-size:12px;padding:7px 9px}
    #bar{gap:5px;max-height:42vh;overflow:auto}
    #cut{width:200px;font-size:12px}
  }
</style></head><body>
<canvas id="c"></canvas>
<div id="top">
  <select id="lineSel" aria-label="Product line"></select>
  <select id="prodSel" aria-label="Product"></select>
</div>
<div id="bar">
  <button class="btn" id="bFront">Front</button>
  <button class="btn on" id="b3Q">3/4</button>
  <button class="btn" id="bDoor">Door</button>
  <button class="btn" id="shell-toggle">Shell: solid</button>
  <label class="btn" id="color-label">Color<input type="color" id="color-pick" value="#0f0f12"></label>
  <button class="btn on" id="bPlateaus">Plateaus</button>
  <button class="btn on" id="bCO2">CO2 Ring</button>
  <button class="btn on" id="bAnimate">Animate</button>
  <button class="btn" id="bCut">Cut Sheet</button>
  <button class="btn" id="bFs">⛶ Full</button>
</div>
<div id="cut"></div>
<button id="fsx" aria-label="Exit fullscreen">✕</button>
<div id="load">Loading…</div>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATA = {"P": {"monolith": {"line": "Monolith", "name": "Monolith", "plateau": "0x0f0f12", "cam": {"baseHalf": 12, "topHalf": 7, "height": 54, "targetZ": 28, "dist": 215, "maxDist": 800}, "stl": {"shell": "shell_monolith.stl", "internals": "internals_monolith.stl", "fan": "fan_monolith.stl", "door": "door_monolith.stl", "plateaus": "plateaus_monolith.stl", "co2": "co2_monolith.stl"}, "specs": [["Footprint", "24\u00d724 in"], ["Height", "54 in"], ["Catch tube", "10 in"], ["Fan", "Fantech FG10"], ["Slat", "8 mm \u00b7 ~3.4 mph"], ["Lure", "CO\u2082 + heat"], ["Wind", "70 mph (staked)"]]}, "mini": {"line": "Monolith", "name": "Monolith Mini", "plateau": "0x0f0f12", "cam": {"baseHalf": 9.5, "topHalf": 7, "height": 46, "targetZ": 24, "dist": 180, "maxDist": 700}, "stl": {"shell": "shell_mini.stl", "internals": "internals_mini.stl", "fan": "fan_mini.stl", "door": "door_mini.stl", "plateaus": "plateaus_mini.stl", "co2": "co2_mini.stl"}, "specs": [["Footprint", "19\u00d719 in"], ["Height", "46 in"], ["Catch tube", "10 in"], ["Fan", "Fantech FG10"], ["Form", "Compact"], ["Lure", "CO\u2082 + heat"], ["Placement", "Patio / small yard"]]}, "blackfly": {"line": "Monolith", "name": "Monolith Black Fly", "plateau": "0x2a5cc0", "cam": {"baseHalf": 12, "topHalf": 7, "height": 54, "targetZ": 28, "dist": 215, "maxDist": 800}, "stl": {"shell": "shell_blackfly.stl", "internals": "internals_blackfly.stl", "fan": "fan_blackfly.stl", "door": "door_blackfly.stl", "plateaus": "plateaus_blackfly.stl", "co2": "co2_blackfly.stl"}, "specs": [["Footprint", "24\u00d724 in"], ["Catch tube", "10 in"], ["Fan", "FG12 + FG10 booster"], ["Airflow", "~900\u20131000 CFM"], ["Slat", "10 mm \u00b7 ~10 mph"], ["Lure", "CO\u2082 + octenol + heat"], ["Target", "Black flies"]]}, "titan": {"line": "Monolith", "name": "GreenGuard Titan", "plateau": "0x0f0f12", "cam": {"baseHalf": 15, "topHalf": 9, "height": 72, "targetZ": 36, "dist": 300, "maxDist": 1000}, "stl": {"shell": "shell_titan.stl", "internals": "internals_titan.stl", "fan": "fan_titan.stl", "door": "door_titan.stl", "plateaus": "plateaus_titan.stl", "co2": "co2_titan.stl"}, "specs": [["Footprint", "30\u00d730 in"], ["Height", "72 in (6 ft)"], ["Catch tube", "14 in"], ["Airflow", "~2700 CFM"], ["Slat", "2.05 in \u00b7 7.5 mph"], ["Intake", "4-sided"], ["Coverage", "~1 acre / unit"], ["CO\u2082", "100 lb cylinder"]]}, "aria-planter": {"line": "Aria", "name": "Aria \u00b7 Planter", "plateau": "0x0f0f12", "cam": {"baseHalf": 8, "topHalf": 8, "height": 22, "targetZ": 11, "dist": 110, "maxDist": 400}, "stl": {"shell": "aria_planter.stl", "internals": "aria_internals.stl"}, "specs": [["Body", "Glazed planter"], ["Engine", "92 mm counterflow"], ["Tank", "Hidden in base"], ["Lure", "CO\u2082 + scent"], ["Catch cup", "150 mm clear"]]}, "aria-lantern": {"line": "Aria", "name": "Aria \u00b7 Lantern", "plateau": "0x0f0f12", "cam": {"baseHalf": 8, "topHalf": 8, "height": 22, "targetZ": 11, "dist": 110, "maxDist": 400}, "stl": {"shell": "aria_lantern.stl", "internals": "aria_internals.stl"}, "specs": [["Body", "Post lantern"], ["Engine", "92 mm counterflow"], ["Tank", "Weighted post base"], ["Lure", "CO\u2082 + scent"], ["Light", "Warm LED cap"]]}, "aria-disc": {"line": "Aria", "name": "Aria \u00b7 Disc", "plateau": "0x0f0f12", "cam": {"baseHalf": 7, "topHalf": 7, "height": 14, "targetZ": 7, "dist": 80, "maxDist": 350}, "stl": {"shell": "aria_disc.stl", "internals": "aria_internals.stl"}, "specs": [["Body", "Fluted ground drum"], ["Engine", "92 mm counterflow"], ["Tank", "Inside drum"], ["Lure", "CO\u2082 + scent"], ["Catch cup", "150 mm clear"]]}, "aria-urn": {"line": "Aria", "name": "Aria \u00b7 Urn", "plateau": "0x0f0f12", "cam": {"baseHalf": 7, "topHalf": 7, "height": 28, "targetZ": 14, "dist": 135, "maxDist": 450}, "stl": {"shell": "aria_urn.stl", "internals": "aria_internals.stl"}, "specs": [["Body", "Tapered urn"], ["Engine", "92 mm counterflow"], ["Tank", "Slim plinth foot"], ["Lure", "CO\u2082 + scent"], ["Catch cup", "150 mm clear"]]}, "aria-pot": {"line": "Aria", "name": "Aria \u00b7 Pot Insert", "plateau": "0x0f0f12", "cam": {"baseHalf": 9, "topHalf": 9, "height": 18, "targetZ": 15, "dist": 110, "maxDist": 400}, "stl": {"shell": "aria_pot.stl", "internals": "aria_internals.stl"}, "specs": [["Body", "Customer's own pot"], ["Engine", "92 mm counterflow"], ["Tank", "Buried in soil"], ["Parts", "Brass rim + 3 spines"], ["Lure", "CO\u2082 + scent"]]}, "halo-lotus": {"line": "Halo", "name": "Halo \u00b7 Lotus Bloom", "plateau": "0x0f0f12", "cam": {"baseHalf": 7, "topHalf": 7, "height": 21, "targetZ": 10, "dist": 105, "maxDist": 400}, "stl": {"shell": "halo_lotus.stl"}, "specs": [["Body", "Lotus Bloom"], ["Engine", "Face-up counterflow"], ["Tank", "20 lb concealed"], ["Lure", "CO\u2082 + heat"]]}, "halo-agave": {"line": "Halo", "name": "Halo \u00b7 Agave Rosette", "plateau": "0x0f0f12", "cam": {"baseHalf": 21, "topHalf": 21, "height": 25, "targetZ": 12, "dist": 150, "maxDist": 500}, "stl": {"shell": "halo_agave.stl"}, "specs": [["Body", "Agave Rosette"], ["Engine", "Face-up counterflow"], ["Tank", "20 lb concealed"], ["Lure", "CO\u2082 + heat"]]}, "halo-spiral": {"line": "Halo", "name": "Halo \u00b7 Spiral", "plateau": "0x0f0f12", "cam": {"baseHalf": 8, "topHalf": 8, "height": 27, "targetZ": 13, "dist": 125, "maxDist": 450}, "stl": {"shell": "halo_spiral.stl"}, "specs": [["Body", "Spiral"], ["Engine", "Face-up counterflow"], ["Tank", "20 lb concealed"], ["Lure", "CO\u2082 + heat"]]}, "halo-cairn": {"line": "Halo", "name": "Halo \u00b7 Stacked Cairn", "plateau": "0x0f0f12", "cam": {"baseHalf": 8, "topHalf": 8, "height": 23, "targetZ": 11, "dist": 115, "maxDist": 420}, "stl": {"shell": "halo_cairn.stl"}, "specs": [["Body", "Stacked Cairn"], ["Engine", "Face-up counterflow"], ["Tank", "20 lb concealed"], ["Lure", "CO\u2082 + heat"]]}, "halo-facet": {"line": "Halo", "name": "Halo \u00b7 Faceted Gem", "plateau": "0x0f0f12", "cam": {"baseHalf": 7, "topHalf": 7, "height": 27, "targetZ": 13, "dist": 125, "maxDist": 450}, "stl": {"shell": "halo_gem.stl"}, "specs": [["Body", "Faceted Gem"], ["Engine", "Face-up counterflow"], ["Tank", "20 lb concealed"], ["Lure", "CO\u2082 + heat"]]}, "halo-birdbath": {"line": "Halo", "name": "Halo \u00b7 Birdbath Bowl", "plateau": "0x0f0f12", "cam": {"baseHalf": 9, "topHalf": 9, "height": 21, "targetZ": 10, "dist": 105, "maxDist": 400}, "stl": {"shell": "halo_birdbath.stl"}, "specs": [["Body", "Birdbath Bowl"], ["Engine", "Face-up counterflow"], ["Tank", "20 lb concealed"], ["Lure", "CO\u2082 + heat"]]}, "halo-pinecone": {"line": "Halo", "name": "Halo \u00b7 Pinecone", "plateau": "0x0f0f12", "cam": {"baseHalf": 8, "topHalf": 8, "height": 24, "targetZ": 12, "dist": 120, "maxDist": 440}, "stl": {"shell": "halo_pinecone.stl"}, "specs": [["Body", "Pinecone"], ["Engine", "Face-up counterflow"], ["Tank", "20 lb concealed"], ["Lure", "CO\u2082 + heat"]]}}, "lines": {"Monolith": ["monolith", "mini", "blackfly", "titan"], "Aria": ["aria-planter", "aria-lantern", "aria-disc", "aria-urn", "aria-pot"], "Halo": ["halo-lotus", "halo-agave", "halo-spiral", "halo-cairn", "halo-facet", "halo-birdbath", "halo-pinecone"]}};
const LINE_ORDER = ["Monolith", "Aria", "Halo"];
const MODELS = "models/";

// ── scene ───────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0f0b);
scene.fog = new THREE.Fog(0x0a0f0b, 260, 900);
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.5, 4000);
camera.up.set(0,0,1); camera.position.set(150,-150,90);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.minDistance = 14;
// sky
const sky = new THREE.Mesh(new THREE.SphereGeometry(1400,32,16),
  new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
    uniforms:{a:{value:new THREE.Color(0x070b08)},b:{value:new THREE.Color(0x1c261d)}},
    vertexShader:'varying vec3 w;void main(){w=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'uniform vec3 a,b;varying vec3 w;void main(){float h=normalize(w).z;gl_FragColor=vec4(mix(b,a,clamp(pow(max(0.,h+0.3),0.7),0.,1.)),1.);}'}));
scene.add(sky);
scene.add(new THREE.HemisphereLight(0xdfeede,0x10160f,0.95));
const sun=new THREE.DirectionalLight(0xfff5e0,3.6); sun.position.set(-80,-100,160); scene.add(sun);
const gnd=new THREE.Mesh(new THREE.CircleGeometry(600,64),new THREE.MeshStandardMaterial({color:0x223018,roughness:.95}));
scene.add(gnd);
// materials
const matShell = new THREE.MeshStandardMaterial({color:0x0f0f12,metalness:.28,roughness:.52,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
const matGhost = new THREE.MeshStandardMaterial({color:0x0f0f12,metalness:.1,roughness:.55,transparent:true,opacity:.22,side:THREE.DoubleSide});
const matInt   = new THREE.MeshStandardMaterial({color:0x8a9aaa,metalness:.6,roughness:.42,side:THREE.DoubleSide});
const matFan   = new THREE.MeshStandardMaterial({color:0xb8c2cc,metalness:.7,roughness:.35,side:THREE.DoubleSide});
const matPlat  = new THREE.MeshStandardMaterial({color:0x0f0f12,metalness:.3,roughness:.5});
const matCO2   = new THREE.MeshStandardMaterial({color:0x3fb56b,metalness:.5,roughness:.35,emissive:0x103d22,emissiveIntensity:.5});
const matDoor  = new THREE.MeshStandardMaterial({color:0x0f0f12,metalness:.28,roughness:.52,side:THREE.DoubleSide});
const clip = new THREE.Plane(new THREE.Vector3(0,1,0),0);
const CLIPPABLE = [matShell,matGhost,matInt,matPlat,matCO2,matDoor,matFan];

// ── state ───────────────────────────────────────────────────────────────────
let MDL={baseHalf:12,topHalf:7,height:54,targetZ:28,dist:215};
let cur={};            // role -> mesh/group
let fanMesh=null, doorPivot=null;
let SHELL_MODES=['solid','ghost','hidden','cutaway'], shellMode=0;
let plateausOn=true, co2On=true, animOn=true, doorOpen=false, doorAngle=0;
const loader=new THREE.STLLoader();
function hwAt(z){return MDL.baseHalf+(MDL.topHalf-MDL.baseHalf)*z/MDL.height;}

function clearProduct(){
  Object.values(cur).forEach(o=>{scene.remove(o); o.traverse&&o.traverse(c=>{if(c.geometry)c.geometry.dispose();});});
  cur={}; fanMesh=null; doorPivot=null;
}
function setClip(on){var pl=on?[clip]:[];CLIPPABLE.forEach(m=>{m.clippingPlanes=pl;m.needsUpdate=true;});}
function matFor(role){return role==='shell'?matShell:role==='internals'?matInt:role==='plateaus'?matPlat:
  role==='co2'?matCO2:role==='door'?matDoor:role==='fan'?matFan:matShell;}

function loadProduct(pid){
  const d=DATA.P[pid]; if(!d)return;
  clearProduct();
  MDL={baseHalf:d.cam.baseHalf,topHalf:d.cam.topHalf,height:d.cam.height,targetZ:d.cam.targetZ,dist:d.cam.dist};
  matPlat.color.set(parseInt(d.plateau));
  controls.maxDistance=d.cam.maxDist; controls.target.set(0,0,d.cam.targetZ);
  view('3q');
  document.getElementById('color-pick').value='#0f0f12'; matShell.color.set(0x0f0f12);
  // cut sheet
  document.getElementById('cut').innerHTML=d.specs.map(s=>`<div class="row"><span class="k">${s[0]}</span><span class="v">${s[1]}</span></div>`).join('');
  // load each role
  const roles=d.stl;
  Object.keys(roles).forEach(role=>{
    loader.load(MODELS+roles[role], geo=>{
      geo.computeVertexNormals();
      if(role==='door'){
        const m=new THREE.Mesh(geo,matDoor);
        const hx=-(MDL.baseHalf*0.92);
        doorPivot=new THREE.Group(); doorPivot.position.x=hx; m.position.x=-hx; doorPivot.add(m);
        scene.add(doorPivot); cur.door=doorPivot;
      } else {
        const m=new THREE.Mesh(geo,matFor(role)); scene.add(m); cur[role]=m;
        if(role==='fan')fanMesh=m;
      }
      applyVis();
    }, undefined, err=>console.warn('stl fail',role,err));
  });
  document.getElementById('load').style.display='none';
}

function applyVis(){
  const m=SHELL_MODES[shellMode];
  if(cur.shell){cur.shell.visible=(m!=='hidden'); cur.shell.material=(m==='ghost')?matGhost:matShell;}
  const showInt=(m!=='solid');
  ['internals','fan'].forEach(r=>{if(cur[r])cur[r].visible=showInt;});
  if(cur.plateaus)cur.plateaus.visible=plateausOn && (m!=='hidden'?true:true);
  if(cur.plateaus)cur.plateaus.material=(m==='ghost')?matGhost:matPlat, cur.plateaus.visible=plateausOn;
  if(cur.co2)cur.co2.visible=co2On;
  if(cur.door)cur.door.visible=(m!=='hidden');
  setClip(m==='cutaway');
}

// ── camera presets ──
function view(which){
  const t=MDL.targetZ, D=MDL.dist;
  controls.target.set(0,0,t);
  if(which==='front')camera.position.set(0,-D,t+D*0.12);
  else camera.position.set(D*0.62,-D*0.62,t+D*0.42);
  camera.lookAt(0,0,t);
}

// ── particles: mosquitoes + CO2 + airflow ──
const N=44; const mp=new Float32Array(N*3), mph=new Float32Array(N);
function mspawn(i){const a=Math.random()*6.28,r=46+Math.random()*70;mp[i*3]=Math.cos(a)*r;mp[i*3+1]=Math.sin(a)*r;mp[i*3+2]=10+Math.random()*(MDL.height-16);mph[i]=Math.random();}
for(let i=0;i<N;i++)mspawn(i);
const mGeo=new THREE.BufferGeometry(); mGeo.setAttribute('position',new THREE.BufferAttribute(mp,3));
const mPts=new THREE.Points(mGeo,new THREE.PointsMaterial({color:0xe8eef0,size:1.6,transparent:true,opacity:.9}));
scene.add(mPts);
const AN=60; const ap=new Float32Array(AN*3);
function aspawn(i){const a=Math.random()*6.28,z=14+Math.random()*(MDL.height-20),r=hwAt(z)*0.9;ap[i*3]=Math.cos(a)*r;ap[i*3+1]=Math.sin(a)*r;ap[i*3+2]=z;}
for(let i=0;i<AN;i++)aspawn(i);
const aGeo=new THREE.BufferGeometry(); aGeo.setAttribute('position',new THREE.BufferAttribute(ap,3));
const aPts=new THREE.Points(aGeo,new THREE.PointsMaterial({color:0x7fd0ff,size:1.1,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending}));
scene.add(aPts);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  // door ease
  const tgt=doorOpen?-Math.PI/2:0; doorAngle+=(tgt-doorAngle)*0.15; if(doorPivot)doorPivot.rotation.z=doorAngle;
  if(animOn){
    if(fanMesh)fanMesh.rotation.z+=0.5;
    // mosquitoes drift in then get sucked down the tube
    for(let i=0;i<N;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y);
      if(hr<hwAt(z)+1.5||z<6){mspawn(i);continue;}
      const pull=0.5+6/Math.max(hr-hwAt(z),2);
      mp[i*3]-=x/hr*pull; mp[i*3+1]-=y/hr*pull; mp[i*3+2]-=0.5;}
    mGeo.attributes.position.needsUpdate=true;
    // airflow: spiral down toward tube
    for(let i=0;i<AN;i++){let x=ap[i*3],y=ap[i*3+1],z=ap[i*3+2];const hr=Math.hypot(x,y)||1;
      ap[i*3]-=x/hr*0.8; ap[i*3+1]-=y/hr*0.8; ap[i*3+2]-=1.2; if(z<4||hr<2)aspawn(i);}
    aGeo.attributes.position.needsUpdate=true;
  }
  renderer.render(scene,camera);
}
animate();

// ── buttons ──
function act(id,on){const e=document.getElementById(id);if(e)e.classList.toggle('on',on);}
document.getElementById('bFront').onclick=function(){view('front');act('bFront',true);act('b3Q',false);};
document.getElementById('b3Q').onclick=function(){view('3q');act('b3Q',true);act('bFront',false);};
document.getElementById('bDoor').onclick=function(){doorOpen=!doorOpen;this.classList.toggle('on',doorOpen);};
document.getElementById('shell-toggle').onclick=function(){shellMode=(shellMode+1)%4;this.textContent='Shell: '+SHELL_MODES[shellMode];applyVis();};
document.getElementById('color-pick').oninput=function(){matShell.color.set(this.value);};
document.getElementById('bPlateaus').onclick=function(){plateausOn=!plateausOn;this.classList.toggle('on',plateausOn);applyVis();};
document.getElementById('bCO2').onclick=function(){co2On=!co2On;this.classList.toggle('on',co2On);applyVis();};
document.getElementById('bAnimate').onclick=function(){animOn=!animOn;this.classList.toggle('on',animOn);};
document.getElementById('bCut').onclick=function(){const c=document.getElementById('cut');c.classList.toggle('show');this.classList.toggle('on',c.classList.contains('show'));};
document.getElementById('bFs').onclick=function(){enterFs();};
document.getElementById('fsx').onclick=function(){exitFs();};
function enterFs(){document.body.classList.add('fs');animOn=true;act('bAnimate',true);
  if(renderer.domElement.requestFullscreen)renderer.domElement.requestFullscreen().catch(()=>{});onResize();}
function exitFs(){document.body.classList.remove('fs');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});onResize();}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('fs');onResize();});

// ── dropdowns ──
const lineSel=document.getElementById('lineSel'),prodSel=document.getElementById('prodSel');
LINE_ORDER.forEach(L=>{const o=document.createElement('option');o.value=L;o.textContent=L;lineSel.appendChild(o);});
function fillProducts(L){prodSel.innerHTML='';(DATA.lines[L]||[]).forEach(pid=>{const o=document.createElement('option');o.value=pid;o.textContent=DATA.P[pid].name;prodSel.appendChild(o);});}
lineSel.onchange=function(){fillProducts(this.value);loadProduct(prodSel.value);};
prodSel.onchange=function(){loadProduct(this.value);};
fillProducts(LINE_ORDER[0]); loadProduct(DATA.lines[LINE_ORDER[0]][0]);

function onResize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',onResize);
</script></body></html>
