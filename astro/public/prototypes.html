<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>GreenGuard Prototypes</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1300px 900px at 55% -5%,#101712,#0a0f0b 70%),#080c09;
    color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none}
  #c{position:fixed;inset:0;display:block}
  /* top dropdowns */
  #top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:30;pointer-events:none}
  #top select{pointer-events:auto;font:inherit;font-size:14px;color:#eef2f7;background:rgba(20,28,22,.86);
    border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  /* bottom button bar — wraps, never covers the model center */
  #bar{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;display:flex;flex-wrap:wrap;justify-content:center;
    gap:6px;align-items:flex-end}
  .btn{font:inherit;font-size:13px;color:#eef2f7;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    padding:9px 13px;border-radius:10px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:.15s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.on{background:var(--gold,#d8b25a);color:#1a1306;border-color:var(--gold,#d8b25a);font-weight:600}
  #color-label{display:flex;align-items:center;gap:6px}
  #color-pick{width:24px;height:24px;border:none;background:none;cursor:pointer;padding:0}
  /* cut sheet panel */
  #cut{position:fixed;right:10px;top:58px;width:240px;max-height:70vh;overflow:auto;z-index:35;display:none;
    background:rgba(12,18,14,.92);border:1px solid rgba(216,178,90,.4);border-radius:12px;padding:12px 14px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;line-height:1.5}
  #cut.show{display:block}
  #cut .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  #cut .row:last-child{border-bottom:none}
  #cut .k{color:#9fb0c4}
  #cut .v{color:#eef2f7;text-align:right;font-weight:600}
  #fsx{position:fixed;top:12px;right:12px;z-index:60;display:none;width:42px;height:42px;border-radius:50%;
    font-size:20px;color:#fff;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);cursor:pointer}
  body.fs #top,body.fs #cut{display:none}
  body.fs #fsx{display:block}
  body.fs #bar{bottom:10px}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;color:#9fb0c4;pointer-events:none}
  @media (max-width:760px){
    #top select{font-size:13px;padding:7px 8px;flex:1}
    .btn{font-size:12px;padding:7px 9px}
    #bar{gap:5px;max-height:42vh;overflow:auto}
    #cut{width:200px;font-size:12px}
  }
</style></head><body>
<canvas id="c"></canvas>
<div id="top">
  <select id="lineSel" aria-label="Product line"></select>
  <select id="prodSel" aria-label="Product"></select>
</div>
<div id="bar">
  <button class="btn" id="bFront">Front</button>
  <button class="btn on" id="b3Q">3/4</button>
  <button class="btn" id="bDoor">Door</button>
  <button class="btn" id="bXray" style="display:none">⊠ X-Ray</button>
  <button class="btn" id="shell-toggle">Shell: solid</button>
  <label class="btn" id="color-label">Color<input type="color" id="color-pick" value="#0f0f12"></label>
  <button class="btn on" id="bPlateaus">Plateaus</button>
  <button class="btn on" id="bCO2">CO2 Ring</button>
  <button class="btn on" id="bAnimate">Animate</button>
  <button class="btn" id="bCut">Cut Sheet</button>
  <button class="btn" id="bFs">⛶ Full</button>
</div>
<div id="cut"></div>
<button id="fsx" aria-label="Exit fullscreen">✕</button>
<div id="load">Loading…</div>

function buildEngine(){
  const H=MDL.height, g=new THREE.Group();
  // depthTest:true + depthWrite:false: renders at correct depth against opaque scene,
  // visible through ghost shell (which has depthWrite:false and writes no depth entries).
  const ov={transparent:true,depthTest:true,depthWrite:false,side:THREE.DoubleSide,renderOrder:10};
  function mat(color,metal,rough,opacity){
    return new THREE.MeshStandardMaterial(Object.assign({color,metalness:metal,roughness:rough,opacity},ov));}
  const steel   =mat(0xc2ccd6,.75,.30,.92);
  const cupMat  =mat(0x5fd87a,0,.90,.45);
  const tankMat =mat(0x2a2e33,.5,.70,.85);
  const grillMat=mat(0x7f8893,.55,.40,.90);
  const barbMat =mat(0x3fa06a,.4,.50,.88);
  const louverMat=mat(0xd8b25a,.5,.35,.95);
  const plenumMat=mat(0x4a6070,.4,.60,.82);
  const throatMat=mat(0x8ab4c8,.3,.55,.75);
  const headZ=engCfg.headZ||H*0.84;

  if(faceUp){
    // ── Halo face-up counterflow ──
    const IORI=5.2, IIRI=4.2, CORE_R=4.55;
    const tankH=Math.min(engCfg.tankH||H*0.85,headZ-0.2);
    const cupDepth=2.6, cupR=IORI;
    const cupTop=headZ-0.25, cupBot=cupTop-cupDepth;

    // CO2 tank sleeve (dark cylinder)
    const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(CORE_R,CORE_R,tankH,24,1,true),tankMat);
    sleeve.rotation.x=Math.PI/2; sleeve.position.set(0,0,tankH/2); g.add(sleeve);
    [0.01,tankH].forEach(z=>{const c=new THREE.Mesh(new THREE.CircleGeometry(CORE_R,24),tankMat);c.rotation.x=Math.PI/2;c.position.set(0,0,z);g.add(c);});

    // Catch cup (green, below fan — bugs land here)
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(cupR,cupR*0.88,cupDepth,28,1,true),cupMat);
    cup.rotation.x=Math.PI/2; cup.position.set(0,0,(cupTop+cupBot)/2); g.add(cup);
    const cupBotM=new THREE.Mesh(new THREE.CircleGeometry(cupR*0.88,28),cupMat);
    cupBotM.rotation.x=Math.PI/2; cupBotM.position.set(0,0,cupBot+0.01); g.add(cupBotM);
    // Solid rim band instead of torus — no floating circle
    const rimBand=new THREE.Mesh(new THREE.CylinderGeometry(cupR+0.08,cupR+0.08,0.22,28,1,true),mat(0x8fe6a8,.4,.40,.95));
    rimBand.rotation.x=Math.PI/2; rimBand.position.set(0,0,cupTop+0.1); g.add(rimBand);

    // Fan (7 blades, below grille)
    const fan=new THREE.Group(); fan.position.set(0,0,headZ-0.18);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(IIRI*0.42,IIRI*0.42,0.55,14),steel);
    hub.rotation.x=Math.PI/2; fan.add(hub);
    for(let b=0;b<7;b++){const a=b/7*Math.PI*2;
      const bl=new THREE.Mesh(new THREE.BoxGeometry(IIRI*1.55,IIRI*0.28,0.13),steel);
      bl.position.set(Math.cos(a)*IIRI*0.52,Math.sin(a)*IIRI*0.52,0);
      bl.rotation.z=a; bl.rotation.x=0.36; fan.add(bl);}
    g.add(fan); g.userData.fan=fan;

    // Grille disk (flat annular face over intake, shows as solid disc not floating ring)
    const bowlR=engCfg.bowlR||IORI;
    const grillDisk=new THREE.Mesh(new THREE.RingGeometry(IIRI*0.6,bowlR,32),grillMat);
    grillDisk.rotation.x=Math.PI/2; grillDisk.position.set(0,0,headZ+0.22); g.add(grillDisk);
    // Outer shroud cylinder (defines the grille edge without floating ring)
    const shroud=new THREE.Mesh(new THREE.CylinderGeometry(bowlR,bowlR,0.35,32,1,true),grillMat);
    shroud.rotation.x=Math.PI/2; shroud.position.set(0,0,headZ+0.05); g.add(shroud);
    // 22 radial bars on top of grille disk
    for(let b=0;b<22;b++){const a=b/22*Math.PI*2;
      const bar=new THREE.Mesh(new THREE.BoxGeometry(bowlR*1.88,0.06,0.07),grillMat);
      bar.rotation.z=a; bar.position.set(0,0,headZ+0.26); g.add(bar);}
    const valveCap=new THREE.Mesh(new THREE.SphereGeometry(IIRI*0.55,12,8),mat(0x9fa8b0,.5,.5,.9));
    valveCap.scale.z=0.45; valveCap.position.set(0,0,headZ+0.30); g.add(valveCap);

    // CO2 barb (side tube — no elbow torus)
    const barbH=headZ-0.2;
    const barb=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,barbH,8),barbMat);
    barb.rotation.x=Math.PI/2; barb.position.set(CORE_R*0.82,0,barbH/2); g.add(barb);

  } else {
    // ── Aria face-down counterflow ──
    const ENG_R=4.06, THROAT_R=1.3, CUP_R=2.95, CUP_H=3.07;
    const ENG_H=Math.min(5.5,headZ*0.28);
    const plenumBot=headZ-ENG_H;

    // Outer plenum cylinder (blue-gray annular casing)
    const plOuter=new THREE.Mesh(new THREE.CylinderGeometry(ENG_R,ENG_R,ENG_H,32,1,true),plenumMat);
    plOuter.rotation.x=Math.PI/2; plOuter.position.set(0,0,plenumBot+ENG_H/2); g.add(plOuter);
    // Plenum top annular face (ring disk — flat, not floating torus)
    const topDisk=new THREE.Mesh(new THREE.RingGeometry(THROAT_R+0.05,ENG_R,32),plenumMat);
    topDisk.rotation.x=Math.PI/2; topDisk.position.set(0,0,headZ+0.01); g.add(topDisk);
    const botDisk=new THREE.Mesh(new THREE.RingGeometry(THROAT_R+0.05,ENG_R,32),plenumMat);
    botDisk.rotation.x=Math.PI/2; botDisk.position.set(0,0,plenumBot+0.01); g.add(botDisk);

    // Inner throat tube (suction path, lighter blue)
    const throat=new THREE.Mesh(new THREE.CylinderGeometry(THROAT_R,THROAT_R,ENG_H,18,1,true),throatMat);
    throat.rotation.x=Math.PI/2; throat.position.set(0,0,plenumBot+ENG_H/2); g.add(throat);

    // Fan (7 blades at fan face)
    const fan=new THREE.Group(); fan.position.set(0,0,headZ-0.15);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(THROAT_R*0.65,THROAT_R*0.65,0.45,14),steel);
    hub.rotation.x=Math.PI/2; fan.add(hub);
    for(let b=0;b<7;b++){const a=b/7*Math.PI*2;
      const bl=new THREE.Mesh(new THREE.BoxGeometry(THROAT_R*2.9,THROAT_R*0.38,0.11),steel);
      bl.position.set(Math.cos(a)*THROAT_R*0.72,Math.sin(a)*THROAT_R*0.72,0);
      bl.rotation.z=a; bl.rotation.x=0.32; fan.add(bl);}
    g.add(fan); g.userData.fan=fan;

    // Catch cup (green semi-transparent, below fan)
    const cupTop=headZ-0.25, cupBot=cupTop-CUP_H;
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(CUP_R,CUP_R*0.88,CUP_H,28,1,true),cupMat);
    cup.rotation.x=Math.PI/2; cup.position.set(0,0,(cupTop+cupBot)/2); g.add(cup);
    const cupBotM=new THREE.Mesh(new THREE.CircleGeometry(CUP_R*0.88,28),cupMat);
    cupBotM.rotation.x=Math.PI/2; cupBotM.position.set(0,0,cupBot+0.01); g.add(cupBotM);
    // Solid rim band (no floating torus)
    const cupRimBand=new THREE.Mesh(new THREE.CylinderGeometry(CUP_R+0.06,CUP_R+0.06,0.2,28,1,true),mat(0x8fe6a8,.4,.40,.9));
    cupRimBand.rotation.x=Math.PI/2; cupRimBand.position.set(0,0,cupTop+0.09); g.add(cupRimBand);

    // Base vent markers (4 fins pointing outward — no floating vent torus)
    const ventZ=(engCfg.baseZ||0)+0.63;
    for(let b=0;b<4;b++){const a=b/4*Math.PI*2;
      const fin=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.12,0.22),mat(0x6a8a9a,.4,.5,.75));
      fin.position.set(Math.cos(a)*(ENG_R+0.6),Math.sin(a)*(ENG_R+0.6),ventZ); fin.rotation.z=a; g.add(fin);}

    // CO2 barb (side tube — no elbow torus)
    const barbZ=headZ-ENG_H*0.35;
    const barbLen=(engCfg.bowlR||ENG_R)*0.55;
    const barb=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,barbLen,8),barbMat);
    barb.rotation.y=Math.PI/2; barb.position.set(ENG_R+barbLen/2,0,barbZ); g.add(barb);
  }

  g.traverse(o=>{if(o.isMesh){o.renderOrder=10; if(!o.material.depthTest)return;}});
  scene.add(g); return g;
}

// ── Bug-bag accumulation — mosquitoes settle into the transparent catch bag ──
const BN=28;
const bp=new Float32Array(BN*3), bv=new Float32Array(BN*3);
let bCount=0, bTick=0;
const bGeo=new THREE.BufferGeometry(); bGeo.setAttribute('position',new THREE.BufferAttribute(bp,3));
const bPts=new THREE.Points(bGeo,new THREE.PointsMaterial({color:0x141414,size:1.8,transparent:true,opacity:.85,depthWrite:false}));
scene.add(bPts);
function resetBugBag(){bCount=0; bTick=0; for(let i=0;i<BN;i++){bp[i*3]=bp[i*3+1]=0;bp[i*3+2]=-999;}bGeo.attributes.position.needsUpdate=true;}
function bspawn(i){
  const a=Math.random()*6.28, r=Math.random()*MDL.bagR*0.35;
  bp[i*3]=Math.cos(a)*r; bp[i*3+1]=Math.sin(a)*r; bp[i*3+2]=MDL.bagZ1+2+Math.random()*3;
  bv[i*3]=(Math.random()-.5)*.08; bv[i*3+1]=(Math.random()-.5)*.08; bv[i*3+2]=-(0.35+Math.random()*.25);
}
function tickBugBag(){
  if(!MDL.bagZ1)return;
  bTick++;
  // add a new bug every ~2 s (120 frames)
  if(bTick%120===0 && bCount<BN){bspawn(bCount); bCount++;}
  // reset when bag full, after a pause
  if(bCount>=BN && bTick%600===599){resetBugBag();}
  for(let i=0;i<bCount;i++){
    const floorZ=MDL.bagZ0+MDL.bagR*(0.05+0.08*(i%5)); // staggered floor levels
    if(bp[i*3+2]>floorZ){
      bp[i*3+2]+=bv[i*3+2]; bp[i*3]+=bv[i*3]; bp[i*3+1]+=bv[i*3+1];
      bv[i*3]*=.96; bv[i*3+1]*=.96;
      if(bp[i*3+2]<=floorZ){bp[i*3+2]=floorZ; bv[i*3+2]=0;}
    } else {
      // settled — tiny fidget
      bp[i*3]+=(Math.random()-.5)*.012; bp[i*3+1]+=(Math.random()-.5)*.012;
    }
  }
  bGeo.attributes.position.needsUpdate=true;
}

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  // door ease
  const tgt=doorOpen?-Math.PI/2:0; doorAngle+=(tgt-doorAngle)*0.15; if(doorPivot)doorPivot.rotation.z=doorAngle;
  mPts.visible=animOn;
  aPts.visible=animOn && animMode!=='monolith';
  cpPts.visible=animOn && animMode!=='generic';
  bPts.visible=animOn && animMode==='monolith' && MDL.bagZ1>0;
  if(animOn && animMode==='monolith') tickBugBag();
  if(cur.proc)cur.proc.visible=procVisible();
  if(animOn){
    if(fanMesh)fanMesh.rotation.z+=0.5;
    if(cur.proc&&cur.proc.userData.fan)cur.proc.userData.fan.rotation.z+=0.5;  // procedural fan
    if(animMode==='proc'){
      const sp=Math.max(1,SZ()*0.06);
      const grillZ=faceUp?(engCfg.headZ||MDL.height*0.88):(engCfg.headZ||MDL.height*0.84);
      const catchR=faceUp?(engCfg.bowlR||5.2)*1.1:2.0;
      for(let i=0;i<N;i++){let x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
        if(faceUp){
          // Halo face-up: insects start ABOVE grille, CO2 plume draws them in, fan sucks them DOWN
          // Caught when they cross grillZ going downward inside the bowl
          const caught=z<grillZ&&hr<catchR;
          if(caught){mspawn(i);continue;}
          const tHW=Math.max(0.5,hwAt(z));
          if(hr>tHW*0.55){const pull=sp*(0.5+4/Math.max(hr-tHW,2));
            mp[i*3]-=x/hr*pull; mp[i*3+1]-=y/hr*pull;
            // pull DOWN toward grillZ; accelerates as they get close (suction effect)
            const dzAbove=z-grillZ; mp[i*3+2]-=sp*(dzAbove<4?1.9:0.5);}
          else{mp[i*3]*=0.86; mp[i*3+1]*=0.86; mp[i*3+2]-=sp*2.4;}
        } else {
          // Aria face-down: insects converge horizontally toward throat at grillZ from all sides
          // Caught when they reach the throat opening
          const caught=Math.abs(z-grillZ)<1.2&&hr<catchR;
          if(caught){mspawn(i);continue;}
          const tHW=Math.max(0.5,hwAt(z));
          if(hr>tHW*0.55){const pull=sp*(0.5+4/Math.max(hr-tHW,2));
            mp[i*3]-=x/hr*pull; mp[i*3+1]-=y/hr*pull;
            // converge vertically toward grillZ
            const dz=grillZ-z; mp[i*3+2]+=Math.sign(dz)*sp*(Math.abs(dz)<3?1.8:0.4);}
          else{mp[i*3]*=0.86; mp[i*3+1]*=0.86; mp[i*3+2]+=Math.sign(grillZ-z)*sp*2.4;}
        }}
      // CO2 lure: face-up = gentle vertical rise above trap; face-down = outward drift from louver ring
      for(let i=0;i<CN;i++){
        if(faceUp){
          cpp[i*3]+=(Math.random()-.5)*0.05; cpp[i*3+1]+=(Math.random()-.5)*0.05; cpp[i*3+2]+=sp*0.65;
          if(cpp[i*3+2]>MDL.height*1.9)cspawn(i);
        } else {
          const rr=Math.hypot(cpp[i*3],cpp[i*3+1])||1;
          cpp[i*3]+=cpp[i*3]/rr*sp*0.9; cpp[i*3+1]+=cpp[i*3+1]/rr*sp*0.9; cpp[i*3+2]+=sp*0.22;
          if(rr>MDL.baseHalf*3.5||cpp[i*3+2]>MDL.height*1.3)cspawn(i);
        }
      }
      cpGeo.attributes.position.needsUpdate=true;
      // Directional airflow for proc modes
      if(faceUp){
        // Halo: air flows DOWN from above into grille, like a "downdraft" intake
        for(let i=0;i<AN;i++){let x=ap[i*3],y=ap[i*3+1],z=ap[i*3+2];const hr=Math.hypot(x,y)||1;
          const gZ=engCfg.headZ||MDL.height*0.88;
          mp[i*3]; // read ref
          ap[i*3]-=x/hr*(hr>2?0.4:0.08); ap[i*3+1]-=y/hr*(hr>2?0.4:0.08); ap[i*3+2]-=1.6;
          if(z<gZ-4||hr<0.8)aspawn(i);}
      } else {
        // Aria: air flows inward from sides toward throat
        for(let i=0;i<AN;i++){let x=ap[i*3],y=ap[i*3+1],z=ap[i*3+2];const hr=Math.hypot(x,y)||1;
          const gZ=engCfg.headZ||MDL.height*0.84;
          ap[i*3]-=x/hr*1.1; ap[i*3+1]-=y/hr*1.1; ap[i*3+2]+=(gZ-z)*0.06;
          if(hr<1.2)aspawn(i);}
      }
      aGeo.attributes.position.needsUpdate=true;
    } else {
      // ── ORIGINAL render.html mosquitoes (Monolith) ──
      for(let i=0;i<N;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.sqrt(x*x+y*y);const shell=hwAt(z);
        if(hr<shell+1.5){mspawn(i);continue;}
        const pull=0.5+6/Math.max(hr-shell,2),nx=-x/hr,ny=-y/hr; mozPhase[i]+=0.3;
        mp[i*3]+=nx*pull+Math.cos(mozPhase[i])*0.25; mp[i*3+1]+=ny*pull+Math.sin(mozPhase[i])*0.25; mp[i*3+2]+=Math.sin(mozPhase[i]*0.7)*0.18;}
      if(animMode==='monolith'){
        // ── ORIGINAL green CO2 curtain: falls straight down from the roof-ring emitter ──
        for(let i=0;i<CN;i++){cpp[i*3]+=cv2[i*3]; cpp[i*3+1]+=cv2[i*3+1]; cpp[i*3+2]+=cv2[i*3+2]; cv2[i*3+2]-=0.004; if(cpp[i*3+2]<2)cspawn(i);}
        cpGeo.attributes.position.needsUpdate=true;
      } else {
        // ── Concepts: mechanism-specific mosquito behavior ──
        if(curHint==='updraft'){
          // Spire: insects enter from base, updraft carries them upward
          for(let i=0;i<N;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
            if(z>MDL.height*0.8){mspawn(i);continue;}  // "captured" inside chimney top
            if(hr<MDL.baseHalf*0.5){mp[i*3+2]+=1.6;} // inside chimney: rise fast
            else{const pull=0.4+3/Math.max(hr-MDL.baseHalf*0.4,1);mp[i*3]-=x/hr*pull;mp[i*3+1]-=y/hr*pull;mp[i*3+2]+=0.2;}}
        } else if(curHint==='in-top'){
          // Cistern/Marker: insects descend from above into top opening
          for(let i=0;i<N;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
            if(z>MDL.height&&hr<MDL.topHalf){mspawn(i);continue;}
            const pull=0.4+3/Math.max(hr-MDL.topHalf*0.5,1);mp[i*3]-=x/hr*pull;mp[i*3+1]-=y/hr*pull;
            mp[i*3+2]-=(z>MDL.height*0.7?0.8:0.1);}
        } else if(curHint==='vortex'){
          // Morel: insects spiral inward tangentially at mid-height
          for(let i=0;i<N;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
            if(hr<MDL.baseHalf*0.4){mspawn(i);continue;}
            // tangential + inward = spiral
            const tx=-y/hr, ty=x/hr;
            const pull=0.3+2/Math.max(hr-MDL.baseHalf*0.3,1);
            mp[i*3]+=tx*0.9-x/hr*pull; mp[i*3+1]+=ty*0.9-y/hr*pull; mp[i*3+2]+=Math.sin(mozPhase[i])*0.1; mozPhase[i]+=0.18;}
        } else if(curHint==='curtain'){
          // Veil: insects approach the curtain face (Y-axis side) and are stopped
          for(let i=0;i<N;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
            if(Math.abs(x)<MDL.baseHalf*0.2){mspawn(i);continue;}  // captured at curtain face
            mp[i*3]-=x/Math.abs(x||1)*0.9+(Math.random()-.5)*0.15; mp[i*3+2]+=(Math.random()-.5)*0.2;}
        } else {
          // contact/generic: insects approach from orbit, land on body surface
          for(let i=0;i<N;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.sqrt(x*x+y*y);const shell=hwAt(z);
            if(hr<shell-0.5){mspawn(i);continue;}
            const pull=0.5+4/Math.max(hr-shell,2),nx=-x/hr,ny=-y/hr; mozPhase[i]+=0.25;
            mp[i*3]+=nx*pull+Math.cos(mozPhase[i])*0.2; mp[i*3+1]+=ny*pull+Math.sin(mozPhase[i])*0.2; mp[i*3+2]+=Math.sin(mozPhase[i]*0.6)*0.15;}
        }
        // Directional airflow for concepts
        for(let i=0;i<AN;i++){let x=ap[i*3],y=ap[i*3+1],z=ap[i*3+2];const hr=Math.hypot(x,y)||1;
          if(curHint==='updraft'){
            ap[i*3]-=x/hr*0.2; ap[i*3+1]-=y/hr*0.2; ap[i*3+2]+=1.4; if(z>MDL.height*0.9||hr<0.5)aspawn(i);
          } else if(curHint==='in-top'){
            ap[i*3]-=x/hr*0.5; ap[i*3+1]-=y/hr*0.5; ap[i*3+2]-=0.9; if(z<MDL.height*0.3||hr<1)aspawn(i);
          } else if(curHint==='vortex'){
            const tx=-y/hr,ty=x/hr; ap[i*3]+=tx*0.6-x/hr*0.7; ap[i*3+1]+=ty*0.6-y/hr*0.7; ap[i*3+2]-=0.2; if(hr<1.2)aspawn(i);
          } else {
            ap[i*3]-=x/hr*0.8; ap[i*3+1]-=y/hr*0.8; ap[i*3+2]-=0.8; if(z<3||hr<2)aspawn(i);
          }}
        aGeo.attributes.position.needsUpdate=true;
      }
    }
    mGeo.attributes.position.needsUpdate=true;
    if(animMode==='monolith'){void 0;}  // monolith airflow not shown
    else if(animMode!=='proc'){  // proc handles its own airflow above
      void 0; // already handled per-hint above
    }
  }
  renderer.render(scene,camera);
}
animate();

  shellMode=1; document.getElementById('shell-toggle').textContent='Shell: '+SHELL_MODES[shellMode];
  animOn=true; act('bAnimate',true); applyVis(); this.classList.add('on');};

document.getElementById('bCO2').onclick=function(){co2On=!co2On;this.classList.toggle('on',co2On);applyVis();};
document.getElementById('bAnimate').onclick=function(){animOn=!animOn;this.classList.toggle('on',animOn);};
document.getElementById('bCut').onclick=function(){const c=document.getElementById('cut');c.classList.toggle('show');this.classList.toggle('on',c.classList.contains('show'));};
document.getElementById('bFs').onclick=function(){enterFs();};
document.getElementById('fsx').onclick=function(){exitFs();};
function enterFs(){document.body.classList.add('fs');animOn=true;act('bAnimate',true);
  if(renderer.domElement.requestFullscreen)renderer.domElement.requestFullscreen().catch(()=>{});onResize();}
function exitFs(){document.body.classList.remove('fs');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});onResize();}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('fs');onResize();});

// ── dropdowns ──
const lineSel=document.getElementById('lineSel'),prodSel=document.getElementById('prodSel');
LINE_ORDER.forEach(L=>{const o=document.createElement('option');o.value=L;o.textContent=L;lineSel.appendChild(o);});
function fillProducts(L){prodSel.innerHTML='';(DATA.lines[L]||[]).forEach(pid=>{const o=document.createElement('option');o.value=pid;o.textContent=DATA.P[pid].name;prodSel.appendChild(o);});}
lineSel.onchange=function(){fillProducts(this.value);loadProduct(prodSel.value);};
prodSel.onchange=function(){loadProduct(this.value);};
fillProducts(LINE_ORDER[0]); loadProduct(DATA.lines[LINE_ORDER[0]][0]);

function onResize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',onResize);
</script></body></html>
