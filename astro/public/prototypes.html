<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>GreenGuard Prototypes</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1300px 900px at 55% -5%,#101712,#0a0f0b 70%),#080c09;
    color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none}
  #c{position:fixed;inset:0;display:block}
  /* top dropdowns */
  #top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:30;pointer-events:none}
  #top select{pointer-events:auto;font:inherit;font-size:14px;color:#eef2f7;background:rgba(20,28,22,.86);
    border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  /* bottom button bar — wraps, never covers the model center */
  #bar{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;display:flex;flex-wrap:wrap;justify-content:center;
    gap:6px;align-items:flex-end}
  .btn{font:inherit;font-size:13px;color:#eef2f7;background:#1a241d;border:1px solid #33433a;
    padding:9px 13px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{background:#26342b}
  .btn.on{background:var(--gold,#d8b25a);color:#1a1306;border-color:var(--gold,#d8b25a);font-weight:600}
  /* fan-speed slider (Monolith line only) */
  #fan-ctl{display:none;align-items:center;gap:6px;background:#1a241d;border:1px solid #33433a;
    padding:6px 10px;border-radius:10px}
  #fan-ctl.show{display:flex}
  #fan-ctl .lab{font-size:12px;color:#9fb0c4;white-space:nowrap}
  #fan-slider{width:72px;accent-color:#6ff0a0;cursor:pointer}
  /* live readout HUD (slat speed + plume radius) */
  #hud{position:fixed;left:10px;top:58px;z-index:35;display:none;background:rgba(12,18,14,.86);
    border:1px solid rgba(111,240,160,.4);border-radius:12px;padding:9px 13px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:12px;line-height:1.55}
  #hud.show{display:block}
  #hud .hk{color:#9fb0c4;margin-right:8px}
  #hud .hv{color:#6ff0a0;font-weight:700;font-variant-numeric:tabular-nums}
  #hud .hfan{color:#eef2f7}
  body.fs #hud{top:10px}
  /* cut sheet panel */
  #cut{position:fixed;right:10px;top:58px;width:240px;max-height:70vh;overflow:auto;z-index:35;display:none;
    background:rgba(12,18,14,.92);border:1px solid rgba(216,178,90,.4);border-radius:12px;padding:12px 14px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;line-height:1.5}
  #cut.show{display:block}
  #cut .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  #cut .row:last-child{border-bottom:none}
  #cut .k{color:#9fb0c4}
  #cut .v{color:#eef2f7;text-align:right;font-weight:600}
  #fsx{position:fixed;top:12px;right:12px;z-index:60;display:none;width:42px;height:42px;border-radius:50%;
    font-size:20px;color:#fff;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);cursor:pointer}
  body.fs #top,body.fs #cut{display:none}
  body.fs #fsx{display:block}
  body.fs #bar{bottom:10px}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;color:#9fb0c4;pointer-events:none}
  #howpanel{position:fixed;left:14px;bottom:78px;width:310px;max-width:48vw;z-index:30;
    background:rgba(14,16,20,.93);border:1px solid rgba(255,255,255,.16);border-radius:12px;
    padding:13px 14px;color:#eef2f7;font-size:13px;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.45);
    opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s,transform .25s}
  #howpanel.show{opacity:1;transform:none;pointer-events:auto}
  #howpanel .hp-hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;
    color:var(--gold,#d8b25a);margin-bottom:6px;font-size:14px}
  #howpanel .hp-x{background:none;border:none;color:#9aa3ad;font-size:15px;cursor:pointer;line-height:1}
  #how-desc{min-height:62px}
  .hp-legend{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0 7px;font-size:11px;color:#aeb6bf}
  .hp-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .hp-nav{display:flex;align-items:center;gap:8px}
  .hp-nav .btn{padding:3px 11px;font-size:15px}
  .hp-dots{display:flex;gap:5px;flex:1;justify-content:center}
  .hp-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
  .hp-dots span.on{background:var(--gold,#d8b25a)}
  @media (max-width:760px){
    #top select{font-size:13px;padding:7px 8px;flex:1}
    .btn{font-size:12px;padding:7px 9px}
    #bar{gap:5px;max-height:42vh;overflow:auto}
    #cut{width:200px;font-size:12px}
    #howpanel{width:260px;max-width:70vw;bottom:64px}
  }
</style></head><body>
<canvas id="c"></canvas>
<div id="top">
  <select id="lineSel" aria-label="Product line"></select>
  <select id="prodSel" aria-label="Product"></select>
</div>
<div id="bar">
  <button class="btn" id="bFront">Front</button>
  <button class="btn" id="bDoor">Door</button>
  <button class="btn" id="bXray" style="display:none">⊠ X-Ray</button>
  <button class="btn" id="shell-toggle">Shell: solid</button>
  <button class="btn on" id="bPlateaus">Plateaus</button>
  <div id="fan-ctl">
    <span class="lab">Fan</span>
    <input type="range" id="fan-slider" min="50" max="200" value="100" step="5">
    <span class="lab" id="fan-pct">100%</span>
  </div>
  <div id="moz-ctl" style="display:flex;align-items:center;gap:6px;background:#1a241d;border:1px solid #33433a;padding:6px 10px;border-radius:10px">
    <span style="font-size:12px;color:#9fb0c4;white-space:nowrap">🦟</span>
    <input type="range" id="moz-slider" min="0" max="400" value="92" step="1" style="width:64px;accent-color:#ff8fa0;cursor:pointer">
    <span style="font-size:12px;color:#ff8fa0;white-space:nowrap" id="moz-pct">92</span>
  </div>
  <button class="btn" id="bHow">⚙ How it works</button>
  <button class="btn" id="bCut">Cut Sheet</button>
</div>
<div id="cut"></div>
<div id="howpanel">
  <div class="hp-hd"><span id="how-title">How it works</span><button id="how-x" class="hp-x">✕</button></div>
  <div id="how-desc"></div>
  <div class="hp-legend">
    <span><i style="background:#8ab4c8"></i>intake</span>
    <span><i style="background:#d8b25a"></i>CO₂ curtain</span>
    <span><i style="background:#5fd87a"></i>catch cup</span>
    <span><i style="background:#9aa0a6"></i>fan · plenum</span>
    <span><i style="background:#cc7a2e"></i>split baffle · ducting</span>
    <span><i style="background:#55707e"></i>base exhaust</span>
  </div>
  <div class="hp-nav"><button id="how-prev" class="btn">‹</button><div id="how-dots" class="hp-dots"></div><button id="how-next" class="btn">›</button></div>
</div>
<div id="hud">
  <div><span class="hk">Fan speed</span><span class="hv hfan" id="hud-fan">100%</span></div>
  <div><span class="hk">Speed at slats</span><span class="hv" id="hud-slat">3.4 mph</span></div>
  <div><span class="hk">CO₂ plume radius</span><span class="hv" id="hud-plume">28 ft</span></div>
</div>
<button id="fsx" aria-label="Exit fullscreen">✕</button>
<div id="load">Loading…</div>

// ── "how it works" flow — three modes, set per product in loadProduct ──

// mosquitoes (dark for monolith, white otherwise) — N_MAX pre-allocated; mozCount active
const N=400; const mp=new Float32Array(N*3), mozPhase=new Float32Array(N);
function mspawn(i){const a=Math.random()*6.28; let r,z;
  if(animMode==='nimbus'){
    // Nimbus: mosquitoes start at disc height in the CO2 plume ring, then pulled inward+down
    const discZ=plumeGrp.position.z; r=10+Math.random()*18; z=discZ-3+Math.random()*6;
  } else if(animMode==='proc'){
    r=MDL.baseHalf*2.0+Math.random()*MDL.baseHalf*3.5;
    const gZ=engCfg.headZ||MDL.height*0.84;
    if(faceUp){
      // Halo face-up: mosquitoes start ABOVE the trap in the CO2 plume, then pulled DOWN through grille
      z=gZ+1.5+Math.random()*MDL.height*0.75;
    } else {
      // Aria face-down: mosquitoes at various heights near the engine face level, pulled into throat
      z=gZ-MDL.height*0.25+Math.random()*MDL.height*0.7;
    }
  } else if(curHint==='updraft'){
    // Spire: insects enter from BASE — spawn low, rise upward inside chimney
    r=MDL.baseHalf*0.3+Math.random()*MDL.baseHalf*1.2; z=Math.random()*MDL.height*0.18;
  } else if(curHint==='in-top'||curHint==='vortex'){
    // Cistern/Marker/Morel: insects approach from above/sides at upper half
    r=MDL.baseHalf*1.5+Math.random()*MDL.baseHalf*3; z=MDL.height*0.4+Math.random()*MDL.height*0.7;
  } else if(curHint==='curtain'){
    // Veil: insects cross a horizontal curtain — spawn along the trellis face height
    r=MDL.baseHalf*0.5+Math.random()*MDL.baseHalf*2; z=MDL.height*0.1+Math.random()*MDL.height*0.85;
  } else {
    // generic (contact, in-side, Monolith): orbit at random heights
    r=48+Math.random()*70; z=MDL.height*0.08+Math.random()*MDL.height*0.82;
  }
  mp[i*3]=Math.cos(a)*r;mp[i*3+1]=Math.sin(a)*r;mp[i*3+2]=z; mozPhase[i]=Math.random()*Math.PI*2;}
for(let i=0;i<N;i++){if(i<mozCount)mspawn(i);else{mp[i*3]=9999;mp[i*3+1]=0;mp[i*3+2]=0;}}
const mGeo=new THREE.BufferGeometry(); mGeo.setAttribute('position',new THREE.BufferAttribute(mp,3));
const mPts=new THREE.Points(mGeo,new THREE.PointsMaterial({color:0x141414,size:1.5,transparent:true,opacity:.92,depthWrite:false}));
scene.add(mPts);
// airflow (blue) — proc/generic only; direction varies by mechanism
const AN=60; const ap=new Float32Array(AN*3);
function aspawn(i){const a=Math.random()*6.28;let r,z;
  const gZ=engCfg.headZ||MDL.height*0.84;
  if(animMode==='proc'&&faceUp){
    // Halo: airflow particles spawn above grille, flow DOWN through intake
    r=Math.random()*(engCfg.bowlR||5.2)*1.1; z=gZ+0.5+Math.random()*MDL.height*0.45;
  } else if(animMode==='proc'){
    // Aria: airflow spawns around the body at headZ level, converges into throat
    r=hwAt(gZ)*1.1+Math.random()*MDL.baseHalf*1.8; z=gZ-3+Math.random()*6;
  } else if(curHint==='updraft'){
    // Spire: airflow rises from base upward (chimney updraft)
    r=Math.random()*MDL.baseHalf*0.5; z=Math.random()*MDL.height*0.3;
  } else if(curHint==='in-top'||curHint==='vortex'){
    r=MDL.baseHalf*0.8+Math.random()*MDL.baseHalf*1.5; z=MDL.height*0.5+Math.random()*MDL.height*0.4;
  } else {
    const zMin=Math.max(2,MDL.height*0.05), zRng=Math.max(4,MDL.height*0.8);
    z=zMin+Math.random()*zRng; r=hwAt(z)*0.9;
  }
  ap[i*3]=Math.cos(a)*r; ap[i*3+1]=Math.sin(a)*r; ap[i*3+2]=z;}
for(let i=0;i<AN;i++)aspawn(i);
const aGeo=new THREE.BufferGeometry(); aGeo.setAttribute('position',new THREE.BufferAttribute(ap,3));
const aPts=new THREE.Points(aGeo,new THREE.PointsMaterial({color:0x7fd0ff,size:1.1,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending}));
scene.add(aPts);
// CO2 lure — 'monolith' green falling perimeter curtain (heavier than air); 'proc' gold rising plume
const CN=220; const cpp=new Float32Array(CN*3), cv2=new Float32Array(CN*3);
function cspawn(i){
  if(animMode==='nimbus'){
    // CO2 exits 24 perimeter ports on disc rim — spawn at disc edge, spread outward
    const a=Math.random()*6.28; const discZ=plumeGrp.position.z;
    const discR=MDL.baseHalf*1.02; // disc perimeter radius
    cpp[i*3]=Math.cos(a)*discR; cpp[i*3+1]=Math.sin(a)*discR; cpp[i*3+2]=discZ+(Math.random()-.5)*1.0;
  } else if(animMode==='proc'){
    const a=Math.random()*6.28;
    // face-up: CO2 at grille level; face-down: from louver ring radius, just above engine face
    const hZ=engCfg.headZ||MDL.height*0.84;
    const co2Z=faceUp?hZ:(hZ+0.4+Math.random()*0.6);
    const co2R=faceUp?(Math.random()*(engCfg.bowlR||5.2)):(3.2+Math.random()*1.0);
    cpp[i*3]=Math.cos(a)*co2R; cpp[i*3+1]=Math.sin(a)*co2R; cpp[i*3+2]=co2Z;
  } else {
    const s=ringHalf(),edge=Math.floor(Math.random()*4),t=(Math.random()*2-1)*s;
    const x=(edge===0)?s:(edge===1)?-s:t, y=(edge===2)?s:(edge===3)?-s:t;
    cpp[i*3]=x; cpp[i*3+1]=y; cpp[i*3+2]=MDL.height-1-Math.random()*2;
    const out=0.06;
    cv2[i*3]=Math.sign(x||1)*out*Math.random(); cv2[i*3+1]=Math.sign(y||1)*out*Math.random(); cv2[i*3+2]=-(0.18+Math.random()*0.22);
  }
}
for(let i=0;i<CN;i++){cspawn(i); cpp[i*3+2]=Math.random()*MDL.height;}
const cpGeo=new THREE.BufferGeometry(); cpGeo.setAttribute('position',new THREE.BufferAttribute(cpp,3));
const cpPts=new THREE.Points(cpGeo,new THREE.PointsMaterial({color:0x6ff0a0,size:1.7,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending}));

// ── Procedural engine (face-up = Halo, face-down = Aria) ──
// Halo: INTAKE_RI=4.2, INTAKE_RO=5.2, CORE_R=4.55, GRILLE_BARS=22.
// Aria: ENG_R=4.06", THROAT_R=1.3", CUP_R=2.95", CUP_H=3.07", VENT_Z=0.63".
// depthTest:true (ghost has depthWrite:false so engine shows through it); depthWrite:false to avoid self-occlusion.
// Slim suction-cap fan for the Lattice (noEngine): just an intake grille ring +
// a spinning axial fan at the top — NO plenum/cup/louver discs. The face-down
// 'proc' flow does the rest (bugs sucked DOWN the grille, CO2 vents OUT the frame).
function buildLatticeFan(){
  const H=MDL.height, g=new THREE.Group();
  const ov={transparent:true,depthTest:true,depthWrite:false,side:THREE.DoubleSide,renderOrder:10};
  function mat(c,m,r,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:m,roughness:r,opacity:o},ov));}
  const steel=mat(0xc2ccd6,.75,.30,.92), grillMat=mat(0x7f8893,.55,.40,.9);
  const headZ=engCfg.headZ||H*0.86, R=engCfg.bowlR||3.0;
  // intake grille ring (the reeded-cap mouth) + radial bars
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(R,R,0.5,32,1,true),grillMat);
  ring.rotation.x=Math.PI/2; ring.position.set(0,0,headZ+0.25); g.add(ring);
  for(let b=0;b<12;b++){const a=b/12*Math.PI*2;
    const bar=new THREE.Mesh(new THREE.BoxGeometry(R*1.9,0.05,0.06),grillMat);
    bar.position.set(0,0,headZ+0.5); bar.rotation.z=a; g.add(bar);}
  // spinning axial fan just below the grille
  const fan=new THREE.Group(); fan.position.set(0,0,headZ-0.4);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(R*0.3,R*0.3,0.5,14),steel); hub.rotation.x=Math.PI/2; fan.add(hub);
  for(let b=0;b<7;b++){const a=b/7*Math.PI*2;
    const bl=new THREE.Mesh(new THREE.BoxGeometry(R*1.5,R*0.26,0.12),steel);
    bl.position.set(Math.cos(a)*R*0.5,Math.sin(a)*R*0.5,0); bl.rotation.z=a; bl.rotation.x=0.36; fan.add(bl);}
  g.add(fan); g.userData.fan=fan;
  return g;
}

function buildEngine(){
  const H=MDL.height, g=new THREE.Group();
  // depthTest:true + depthWrite:false: renders at correct depth against opaque scene,
  // visible through ghost shell (which has depthWrite:false and writes no depth entries).
  const ov={transparent:true,depthTest:true,depthWrite:false,side:THREE.DoubleSide,renderOrder:10};
  function mat(color,metal,rough,opacity){
    return new THREE.MeshStandardMaterial(Object.assign({color,metalness:metal,roughness:rough,opacity},ov));}
  const steel   =mat(0xc2ccd6,.75,.30,.92);
  const cupMat  =mat(0x5fd87a,0,.90,.45);
  const tankMat =mat(0x2a2e33,.5,.70,.85);
  const grillMat=mat(0x7f8893,.55,.40,.90);
  const barbMat =mat(0x3fa06a,.4,.50,.88);
  const louverMat=mat(0xd8b25a,.5,.35,.95);
  const plenumMat=mat(0x4a6070,.4,.60,.82);
  const throatMat=mat(0x8ab4c8,.3,.55,.75);
  const headZ=engCfg.headZ||H*0.84;

  if(faceUp){
    // ── Halo face-up counterflow ──
    const IORI=5.2, IIRI=4.2, CORE_R=4.55;
    const tankH=Math.min(engCfg.tankH||H*0.85,headZ-0.2);
    const cupDepth=2.6, cupR=IORI;
    const cupTop=headZ-0.25, cupBot=cupTop-cupDepth;

    // CO2 tank sleeve (dark cylinder)
    const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(CORE_R,CORE_R,tankH,24,1,true),tankMat);
    sleeve.rotation.x=Math.PI/2; sleeve.position.set(0,0,tankH/2); g.add(sleeve);
    [0.01,tankH].forEach(z=>{const c=new THREE.Mesh(new THREE.CircleGeometry(CORE_R,24),tankMat);c.rotation.x=Math.PI/2;c.position.set(0,0,z);g.add(c);});

    // Catch cup (green, below fan — bugs land here)
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(cupR,cupR*0.88,cupDepth,28,1,true),cupMat);
    cup.rotation.x=Math.PI/2; cup.position.set(0,0,(cupTop+cupBot)/2); g.add(cup);
    const cupBotM=new THREE.Mesh(new THREE.CircleGeometry(cupR*0.88,28),cupMat);
    cupBotM.rotation.x=Math.PI/2; cupBotM.position.set(0,0,cupBot+0.01); g.add(cupBotM);
    // Solid rim band instead of torus — no floating circle
    const rimBand=new THREE.Mesh(new THREE.CylinderGeometry(cupR+0.08,cupR+0.08,0.22,28,1,true),mat(0x8fe6a8,.4,.40,.95));
    rimBand.rotation.x=Math.PI/2; rimBand.position.set(0,0,cupTop+0.1); g.add(rimBand);

    // Fan (7 blades, below grille)
    const fan=new THREE.Group(); fan.position.set(0,0,headZ-0.18);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(IIRI*0.42,IIRI*0.42,0.55,14),steel);
    hub.rotation.x=Math.PI/2; fan.add(hub);
    for(let b=0;b<7;b++){const a=b/7*Math.PI*2;
      const bl=new THREE.Mesh(new THREE.BoxGeometry(IIRI*1.55,IIRI*0.28,0.13),steel);
      bl.position.set(Math.cos(a)*IIRI*0.52,Math.sin(a)*IIRI*0.52,0);
      bl.rotation.z=a; bl.rotation.x=0.36; fan.add(bl);}
    g.add(fan); g.userData.fan=fan;

    // Grille disk (flat annular face over intake, shows as solid disc not floating ring)
    const bowlR=engCfg.bowlR||IORI;
    const grillDisk=new THREE.Mesh(new THREE.RingGeometry(IIRI*0.6,bowlR,32),grillMat);
    grillDisk.rotation.x=Math.PI/2; grillDisk.position.set(0,0,headZ+0.22); g.add(grillDisk);
    // Outer shroud cylinder (defines the grille edge without floating ring)
    const shroud=new THREE.Mesh(new THREE.CylinderGeometry(bowlR,bowlR,0.35,32,1,true),grillMat);
    shroud.rotation.x=Math.PI/2; shroud.position.set(0,0,headZ+0.05); g.add(shroud);
    // 22 radial bars on top of grille disk
    for(let b=0;b<22;b++){const a=b/22*Math.PI*2;
      const bar=new THREE.Mesh(new THREE.BoxGeometry(bowlR*1.88,0.06,0.07),grillMat);
      bar.rotation.z=a; bar.position.set(0,0,headZ+0.26); g.add(bar);}
    const valveCap=new THREE.Mesh(new THREE.SphereGeometry(IIRI*0.55,12,8),mat(0x9fa8b0,.5,.5,.9));
    valveCap.scale.z=0.45; valveCap.position.set(0,0,headZ+0.30); g.add(valveCap);

    // CO2 barb (side tube — no elbow torus)
    const barbH=headZ-0.2;
    const barb=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,barbH,8),barbMat);
    barb.rotation.x=Math.PI/2; barb.position.set(CORE_R*0.82,0,barbH/2); g.add(barb);

  } else {
    // ── Aria face-down counterflow ── (labeled parts collected for the explainer)
    const ENG_R=4.06, THROAT_R=1.3, CUP_R=2.95, CUP_H=3.07;
    const ENG_H=Math.min(5.5,headZ*0.28);
    const plenumBot=headZ-ENG_H;
    const parts={}; g.userData.parts=parts;

    // PLENUM — sealed annular casing; fan exhaust + CO2/scent live here
    const plOuter=new THREE.Mesh(new THREE.CylinderGeometry(ENG_R,ENG_R,ENG_H,32,1,true),plenumMat);
    plOuter.rotation.x=Math.PI/2; plOuter.position.set(0,0,plenumBot+ENG_H/2); g.add(plOuter);
    const topDisk=new THREE.Mesh(new THREE.RingGeometry(THROAT_R+0.05,ENG_R,32),plenumMat);
    topDisk.rotation.x=Math.PI/2; topDisk.position.set(0,0,headZ+0.01); g.add(topDisk);
    const botDisk=new THREE.Mesh(new THREE.RingGeometry(THROAT_R+0.05,ENG_R,32),plenumMat);
    botDisk.rotation.x=Math.PI/2; botDisk.position.set(0,0,plenumBot+0.01); g.add(botDisk);
    parts.plenum=[plOuter,topDisk,botDisk];

    // INTAKE THROAT — the suction path: air + mosquitoes pulled straight DOWN
    const throat=new THREE.Mesh(new THREE.CylinderGeometry(THROAT_R,THROAT_R,ENG_H,18,1,true),throatMat);
    throat.rotation.x=Math.PI/2; throat.position.set(0,0,plenumBot+ENG_H/2); g.add(throat);
    parts.throat=[throat];

    // FAN — single 92 mm axial fan at the working face; the one driver
    const fan=new THREE.Group(); fan.position.set(0,0,headZ-0.15);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(THROAT_R*0.65,THROAT_R*0.65,0.45,14),steel);
    hub.rotation.x=Math.PI/2; fan.add(hub);
    for(let b=0;b<7;b++){const a=b/7*Math.PI*2;
      const bl=new THREE.Mesh(new THREE.BoxGeometry(THROAT_R*2.9,THROAT_R*0.38,0.11),steel);
      bl.position.set(Math.cos(a)*THROAT_R*0.72,Math.sin(a)*THROAT_R*0.72,0);
      bl.rotation.z=a; bl.rotation.x=0.32; fan.add(bl);}
    g.add(fan); g.userData.fan=fan; parts.fan=[fan];

    // CO2 CURTAIN LOUVER RING — gold angled blades around the throat; throw the
    // CO2/scent curtain OUTWARD + slightly down over the approach zone.
    const louverGrp=new THREE.Group();
    const lr=(THROAT_R+ENG_R)/2;
    for(let b=0;b<36;b++){const a=b/36*Math.PI*2;
      const lv=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.46,0.5),louverMat);
      lv.position.set(Math.cos(a)*lr,Math.sin(a)*lr,headZ+0.16);
      lv.rotation.z=a; lv.rotation.y=0.95;   // blade laid outward → curtain aims out + down
      louverGrp.add(lv);}
    g.add(louverGrp); parts.louver=[louverGrp];

    // SPLIT BAFFLE + curtain risers (DUCTING) — meters ~30% of fan exhaust UP to
    // the louver ring; the remaining ~70% drops to the base vents.
    const baffleZ=plenumBot+ENG_H*0.5;
    const baffle=new THREE.Mesh(new THREE.RingGeometry(THROAT_R+0.1,ENG_R-0.1,28),mat(0xcc7a2e,.5,.45,.95));
    baffle.rotation.x=Math.PI/2; baffle.position.set(0,0,baffleZ); g.add(baffle);
    const risers=new THREE.Group();
    for(let b=0;b<4;b++){const a=b/4*Math.PI*2;
      const rt=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,headZ-baffleZ,10,1,true),mat(0xcc7a2e,.4,.5,.9));
      rt.rotation.x=Math.PI/2; rt.position.set(Math.cos(a)*(ENG_R-0.5),Math.sin(a)*(ENG_R-0.5),(headZ+baffleZ)/2); risers.add(rt);}
    g.add(risers); parts.duct=[baffle,risers];

    // CATCH CUP — clear cup directly under the fan; a NET keeps bugs, passes air
    const cupTop=headZ-0.25, cupBot=cupTop-CUP_H;
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(CUP_R,CUP_R*0.88,CUP_H,28,1,true),cupMat);
    cup.rotation.x=Math.PI/2; cup.position.set(0,0,(cupTop+cupBot)/2); g.add(cup);
    const cupBotM=new THREE.Mesh(new THREE.CircleGeometry(CUP_R*0.88,28),cupMat);
    cupBotM.rotation.x=Math.PI/2; cupBotM.position.set(0,0,cupBot+0.01); g.add(cupBotM);
    const cupRimBand=new THREE.Mesh(new THREE.CylinderGeometry(CUP_R+0.06,CUP_R+0.06,0.2,28,1,true),mat(0x8fe6a8,.4,.40,.9));
    cupRimBand.rotation.x=Math.PI/2; cupRimBand.position.set(0,0,cupTop+0.09); g.add(cupRimBand);
    const netMat=mat(0x8fe6a8,.2,.6,.5);  // catch net across the cup mouth
    for(let b=0;b<5;b++){const off=-CUP_R*0.7+b*(CUP_R*1.4/4);
      const bx=new THREE.Mesh(new THREE.BoxGeometry(0.04,CUP_R*1.7,0.04),netMat);
      bx.position.set(off,0,cupTop-0.05); g.add(bx);
      const by=new THREE.Mesh(new THREE.BoxGeometry(CUP_R*1.7,0.04,0.04),netMat);
      by.position.set(0,off,cupTop-0.05); g.add(by);}
    parts.cup=[cup,cupBotM,cupRimBand];

    // BASE EXHAUST VENTS — the bulk (~70%) of fan exhaust travels DOWN the body
    // through downcomer ducts and leaves LOW + hidden through a foot vent band.
    const ventZ=(engCfg.baseZ||0)+0.63;
    const ventGrp=new THREE.Group();
    // downcomer ducts: connect the plenum base to the foot vents (the exhaust path)
    const downTop=plenumBot, downH=Math.max(0.6,downTop-ventZ-0.3);
    for(let b=0;b<4;b++){const a=b/4*Math.PI*2;
      const dc=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,downH,12,1,true),mat(0x55707e,.4,.5,.55));
      dc.rotation.x=Math.PI/2; dc.position.set(Math.cos(a)*(ENG_R-0.5),Math.sin(a)*(ENG_R-0.5),ventZ+0.3+downH/2); ventGrp.add(dc);}
    const ventRing=new THREE.Mesh(new THREE.CylinderGeometry(ENG_R+0.15,ENG_R+0.15,0.9,40,1,true),mat(0x55707e,.4,.5,.7));
    ventRing.rotation.x=Math.PI/2; ventRing.position.set(0,0,ventZ); ventGrp.add(ventRing);
    for(let b=0;b<28;b++){const a=b/28*Math.PI*2;
      const fin=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.1,0.6),mat(0x35454d,.4,.5,.85));
      fin.position.set(Math.cos(a)*(ENG_R+0.3),Math.sin(a)*(ENG_R+0.3),ventZ); fin.rotation.z=a; ventGrp.add(fin);}
    g.add(ventGrp); parts.vent=[ventGrp];

    // CO2 barb — 6 mm line stub from the hidden tank into the plenum
    const barbZ=headZ-ENG_H*0.35;
    const barbLen=(engCfg.bowlR||ENG_R)*0.55;
    const barb=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,barbLen,8),barbMat);
    barb.rotation.y=Math.PI/2; barb.position.set(ENG_R+barbLen/2,0,barbZ); g.add(barb);
    parts.co2=[barb];

    // collect per-role materials so the explainer can highlight a part
    const rm={}; for(const k in parts){const ms=[]; parts[k].forEach(o=>o.traverse(c=>{if(c.material)ms.push(c.material);})); rm[k]=ms;}
    g.userData.roleMats=rm;
  }

  g.traverse(o=>{if(o.isMesh){o.renderOrder=10; if(!o.material.depthTest)return;}});
  scene.add(g); return g;
}

// ── Bug-bag accumulation — mosquitoes settle into the transparent catch bag ──
const BN=28;
const bp=new Float32Array(BN*3), bv=new Float32Array(BN*3);
let bCount=0, bTick=0;
const bGeo=new THREE.BufferGeometry(); bGeo.setAttribute('position',new THREE.BufferAttribute(bp,3));
const bPts=new THREE.Points(bGeo,new THREE.PointsMaterial({color:0x141414,size:1.8,transparent:true,opacity:.85,depthWrite:false}));
scene.add(bPts);
function resetBugBag(){bCount=0; bTick=0; for(let i=0;i<BN;i++){bp[i*3]=bp[i*3+1]=0;bp[i*3+2]=-999;}bGeo.attributes.position.needsUpdate=true;}
function bspawn(i){
  const a=Math.random()*6.28, r=Math.random()*MDL.bagR*0.35;
  bp[i*3]=Math.cos(a)*r; bp[i*3+1]=Math.sin(a)*r; bp[i*3+2]=MDL.bagZ1+2+Math.random()*3;
  bv[i*3]=(Math.random()-.5)*.08; bv[i*3+1]=(Math.random()-.5)*.08; bv[i*3+2]=-(0.35+Math.random()*.25);
}
function tickBugBag(){
  if(!MDL.bagZ1)return;
  bTick++;
  // add a new bug every ~2 s (120 frames)
  if(bTick%120===0 && bCount<BN){bspawn(bCount); bCount++;}
  // reset when bag full, after a pause
  if(bCount>=BN && bTick%600===599){resetBugBag();}
  for(let i=0;i<bCount;i++){
    const floorZ=MDL.bagZ0+MDL.bagR*(0.05+0.08*(i%5)); // staggered floor levels
    if(bp[i*3+2]>floorZ){
      bp[i*3+2]+=bv[i*3+2]; bp[i*3]+=bv[i*3]; bp[i*3+1]+=bv[i*3+1];
      bv[i*3]*=.96; bv[i*3+1]*=.96;
      if(bp[i*3+2]<=floorZ){bp[i*3+2]=floorZ; bv[i*3+2]=0;}
    } else {
      // settled — tiny fidget
      bp[i*3]+=(Math.random()-.5)*.012; bp[i*3+1]+=(Math.random()-.5)*.012;
    }
  }
  bGeo.attributes.position.needsUpdate=true;
}

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  // door ease
  const tgt=doorOpen?-Math.PI/2:0; doorAngle+=(tgt-doorAngle)*0.15; if(doorPivot)doorPivot.rotation.z=doorAngle;
  mPts.visible=animOn;
  aPts.visible=animOn && animMode!=='monolith';
  cpPts.visible=animOn && animMode!=='generic';
  bPts.visible=animOn && animMode==='monolith' && MDL.bagZ1>0;
  if(animOn && animMode==='monolith') tickBugBag();
  if(cur.proc)cur.proc.visible=procVisible();
  if(animOn){
    if(fanMesh)fanMesh.rotation.z+=0.5*fanSpeed;
    if(cur.proc&&cur.proc.userData.fan)cur.proc.userData.fan.rotation.z+=0.5;  // procedural fan
    if(animMode==='proc'){
      const sp=Math.max(1,SZ()*0.06);
      const grillZ=faceUp?(engCfg.headZ||MDL.height*0.88):(engCfg.headZ||MDL.height*0.84);
      const catchR=faceUp?(engCfg.bowlR||5.2)*1.1:2.0;
      for(let i=0;i<mozCount;i++){let x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
        if(faceUp){
          // Halo face-up: insects start ABOVE grille, CO2 plume draws them in, fan sucks them DOWN
          // Caught when they cross grillZ going downward inside the bowl
          const caught=z<grillZ&&hr<catchR;
          if(caught){mspawn(i);continue;}
          const tHW=Math.max(0.5,hwAt(z));
          if(hr>tHW*0.55){const pull=sp*(0.5+4/Math.max(hr-tHW,2));
            mp[i*3]-=x/hr*pull; mp[i*3+1]-=y/hr*pull;
            // pull DOWN toward grillZ; accelerates as they get close (suction effect)
            const dzAbove=z-grillZ; mp[i*3+2]-=sp*(dzAbove<4?1.9:0.5);}
          else{mp[i*3]*=0.86; mp[i*3+1]*=0.86; mp[i*3+2]-=sp*2.4;}
        } else {
          // Aria face-down: insects ride the curtain inward to the throat, then the
          // downdraft pulls them straight DOWN through the fan into the catch cup.
          const cupFloor=grillZ-3.4;
          if(z<cupFloor){mspawn(i);continue;}            // landed in the cup → respawn
          const tHW=Math.max(0.5,hwAt(z));
          if(hr>catchR && z>grillZ-0.6){
            // approaching: pull inward + settle toward the throat plane
            const pull=sp*(0.5+4/Math.max(hr-tHW,2));
            mp[i*3]-=x/hr*pull; mp[i*3+1]-=y/hr*pull;
            const dz=grillZ-z; mp[i*3+2]+=Math.sign(dz)*sp*(Math.abs(dz)<3?1.6:0.4);
          } else {
            // captured: spiral down the throat into the cup
            mp[i*3]*=0.8; mp[i*3+1]*=0.8; mp[i*3+2]-=sp*2.2;
          }
        }}
      // CO2 lure: face-up = gentle vertical rise above trap; face-down = outward drift from louver ring
      for(let i=0;i<CN;i++){
        if(faceUp){
          cpp[i*3]+=(Math.random()-.5)*0.05; cpp[i*3+1]+=(Math.random()-.5)*0.05; cpp[i*3+2]+=sp*0.65;
          if(cpp[i*3+2]>MDL.height*1.9)cspawn(i);
        } else {
          // Aria curtain: CO2/scent projects OUTWARD and slightly DOWN from the
          // louver ring (heavier-than-air lure spreading over the approach zone).
          const rr=Math.hypot(cpp[i*3],cpp[i*3+1])||1;
          cpp[i*3]+=cpp[i*3]/rr*sp*0.95; cpp[i*3+1]+=cpp[i*3+1]/rr*sp*0.95; cpp[i*3+2]-=sp*0.12;
          if(rr>MDL.baseHalf*3.2||cpp[i*3+2]<grillZ-3.5)cspawn(i);
        }
      }
      cpGeo.attributes.position.needsUpdate=true;
      // Directional airflow for proc modes
      if(faceUp){
        // Halo: air flows DOWN from above into grille, like a "downdraft" intake
        for(let i=0;i<AN;i++){let x=ap[i*3],y=ap[i*3+1],z=ap[i*3+2];const hr=Math.hypot(x,y)||1;
          const gZ=engCfg.headZ||MDL.height*0.88;
          mp[i*3]; // read ref
          ap[i*3]-=x/hr*(hr>2?0.4:0.08); ap[i*3+1]-=y/hr*(hr>2?0.4:0.08); ap[i*3+2]-=1.6;
          if(z<gZ-4||hr<0.8)aspawn(i);}
      } else {
        // Aria: INTAKE down the throat at the top + base EXHAUST low — one fan,
        // split flow. Even particles = intake (in+down→cup), odd = base exhaust (out+low).
        const gZ=engCfg.headZ||MDL.height*0.84;
        const vZ=(engCfg.baseZ||0)+0.6;
        for(let i=0;i<AN;i++){let x=ap[i*3],y=ap[i*3+1],z=ap[i*3+2];const hr=Math.hypot(x,y)||1;
          if(i%2===0){
            // intake: converge inward and descend toward the throat → into the cup
            ap[i*3]-=x/hr*1.0; ap[i*3+1]-=y/hr*1.0; ap[i*3+2]-=Math.max(0.5,(z-(gZ-3.5))*0.16);
            if(hr<0.9&&z<gZ-3.0){const a=Math.random()*6.28,r=2+Math.random()*2; ap[i*3]=Math.cos(a)*r;ap[i*3+1]=Math.sin(a)*r;ap[i*3+2]=gZ+0.5+Math.random()*2;}
          } else {
            // base exhaust: push outward + slight rise at the foot vent ring
            ap[i*3]+=x/hr*0.9; ap[i*3+1]+=y/hr*0.9; ap[i*3+2]+=(vZ-z)*0.06+0.05;
            if(hr>MDL.baseHalf*2.0){const a=Math.random()*6.28,r=4.2; ap[i*3]=Math.cos(a)*r;ap[i*3+1]=Math.sin(a)*r;ap[i*3+2]=vZ+(Math.random()-.5)*0.6;}
          }}
      }
      aGeo.attributes.position.needsUpdate=true;
    } else if(animMode==='nimbus'){
      // ── Nimbus: CO2 spreads from disc perimeter; mosquitoes approach at disc height then dive in ──
      const discZ=plumeGrp.position.z;
      // CO2 particles: expand outward from disc rim at disc height
      for(let i=0;i<CN;i++){const r=Math.hypot(cpp[i*3],cpp[i*3+1])||0.01;
        if(r>26||(r>1&&Math.abs(cpp[i*3+2]-discZ)>5)){cspawn(i);continue;}
        const a=Math.atan2(cpp[i*3+1],cpp[i*3]);
        cpp[i*3]+=Math.cos(a)*0.13; cpp[i*3+1]+=Math.sin(a)*0.13; cpp[i*3+2]+=(Math.random()-.5)*0.06;}
      cpGeo.attributes.position.needsUpdate=true;
      // Mosquitoes: drift at disc height toward center, then get pulled DOWN through inlet
      for(let i=0;i<mozCount;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2]; const hr=Math.hypot(x,y)||1;
        if(hr<1.5&&Math.abs(z-discZ)<3){mspawn(i);continue;} // captured
        const pull=0.35+7/Math.max(hr-1.2,0.5);
        const dz=(discZ-z)*0.09; // converge toward disc height first
        mozPhase[i]+=0.22;
        mp[i*3]-=x/hr*pull+Math.cos(mozPhase[i])*0.12; mp[i*3+1]-=y/hr*pull+Math.sin(mozPhase[i])*0.12;
        mp[i*3+2]+=dz;}
      mGeo.attributes.position.needsUpdate=true;
    } else {
      // ── ORIGINAL render.html mosquitoes (Monolith) ──
      for(let i=0;i<mozCount;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.sqrt(x*x+y*y);const shell=hwAt(z);
        if(hr<shell+1.5){mspawn(i);continue;}
        const pull=(0.5+6/Math.max(hr-shell,2))*fanSpeed,nx=-x/hr,ny=-y/hr; mozPhase[i]+=0.3*fanSpeed;
        mp[i*3]+=nx*pull+Math.cos(mozPhase[i])*0.25; mp[i*3+1]+=ny*pull+Math.sin(mozPhase[i])*0.25; mp[i*3+2]+=Math.sin(mozPhase[i]*0.7)*0.18;}
      if(animMode==='monolith'){
        // ── ORIGINAL green CO2 curtain: falls straight down from the roof-ring emitter ──
        for(let i=0;i<CN;i++){cpp[i*3]+=cv2[i*3]*fanSpeed; cpp[i*3+1]+=cv2[i*3+1]*fanSpeed; cpp[i*3+2]+=cv2[i*3+2]*fanSpeed; cv2[i*3+2]-=0.004; if(cpp[i*3+2]<2)cspawn(i);}
        cpGeo.attributes.position.needsUpdate=true;
      } else {
        // ── Concepts: mechanism-specific mosquito behavior ──
        if(curHint==='updraft'){
          // Spire: insects enter from base, updraft carries them upward
          for(let i=0;i<mozCount;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
            if(z>MDL.height*0.8){mspawn(i);continue;}  // "captured" inside chimney top
            if(hr<MDL.baseHalf*0.5){mp[i*3+2]+=1.6;} // inside chimney: rise fast
            else{const pull=0.4+3/Math.max(hr-MDL.baseHalf*0.4,1);mp[i*3]-=x/hr*pull;mp[i*3+1]-=y/hr*pull;mp[i*3+2]+=0.2;}}
        } else if(curHint==='in-top'){
          // Cistern/Marker: insects descend from above into top opening
          for(let i=0;i<mozCount;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
            if(z>MDL.height&&hr<MDL.topHalf){mspawn(i);continue;}
            const pull=0.4+3/Math.max(hr-MDL.topHalf*0.5,1);mp[i*3]-=x/hr*pull;mp[i*3+1]-=y/hr*pull;
            mp[i*3+2]-=(z>MDL.height*0.7?0.8:0.1);}
        } else if(curHint==='vortex'){
          // Morel: insects spiral inward tangentially at mid-height
          for(let i=0;i<mozCount;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
            if(hr<MDL.baseHalf*0.4){mspawn(i);continue;}
            // tangential + inward = spiral
            const tx=-y/hr, ty=x/hr;
            const pull=0.3+2/Math.max(hr-MDL.baseHalf*0.3,1);
            mp[i*3]+=tx*0.9-x/hr*pull; mp[i*3+1]+=ty*0.9-y/hr*pull; mp[i*3+2]+=Math.sin(mozPhase[i])*0.1; mozPhase[i]+=0.18;}
        } else if(curHint==='curtain'){
          // Veil: insects approach the curtain face (Y-axis side) and are stopped
          for(let i=0;i<mozCount;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.hypot(x,y)||1;
            if(Math.abs(x)<MDL.baseHalf*0.2){mspawn(i);continue;}  // captured at curtain face
            mp[i*3]-=x/Math.abs(x||1)*0.9+(Math.random()-.5)*0.15; mp[i*3+2]+=(Math.random()-.5)*0.2;}
        } else {
          // contact/generic: insects approach from orbit, land on body surface
          for(let i=0;i<mozCount;i++){const x=mp[i*3],y=mp[i*3+1],z=mp[i*3+2];const hr=Math.sqrt(x*x+y*y);const shell=hwAt(z);
            if(hr<shell-0.5){mspawn(i);continue;}
            const pull=0.5+4/Math.max(hr-shell,2),nx=-x/hr,ny=-y/hr; mozPhase[i]+=0.25;
            mp[i*3]+=nx*pull+Math.cos(mozPhase[i])*0.2; mp[i*3+1]+=ny*pull+Math.sin(mozPhase[i])*0.2; mp[i*3+2]+=Math.sin(mozPhase[i]*0.6)*0.15;}
        }
        // Directional airflow for concepts
        for(let i=0;i<AN;i++){let x=ap[i*3],y=ap[i*3+1],z=ap[i*3+2];const hr=Math.hypot(x,y)||1;
          if(curHint==='updraft'){
            ap[i*3]-=x/hr*0.2; ap[i*3+1]-=y/hr*0.2; ap[i*3+2]+=1.4; if(z>MDL.height*0.9||hr<0.5)aspawn(i);
          } else if(curHint==='in-top'){
            ap[i*3]-=x/hr*0.5; ap[i*3+1]-=y/hr*0.5; ap[i*3+2]-=0.9; if(z<MDL.height*0.3||hr<1)aspawn(i);
          } else if(curHint==='vortex'){
            const tx=-y/hr,ty=x/hr; ap[i*3]+=tx*0.6-x/hr*0.7; ap[i*3+1]+=ty*0.6-y/hr*0.7; ap[i*3+2]-=0.2; if(hr<1.2)aspawn(i);
          } else {
            ap[i*3]-=x/hr*0.8; ap[i*3+1]-=y/hr*0.8; ap[i*3+2]-=0.8; if(z<3||hr<2)aspawn(i);
          }}
        aGeo.attributes.position.needsUpdate=true;
      }
    }
    mGeo.attributes.position.needsUpdate=true;
    if(animMode==='monolith'){void 0;}  // monolith airflow not shown
    else if(animMode!=='proc'){  // proc handles its own airflow above
      void 0; // already handled per-hint above
    }
  }
  renderer.render(scene,camera);
}
animate();

// ── buttons ──
function act(id,on){const e=document.getElementById(id);if(e)e.classList.toggle('on',on);}
document.getElementById('bFront').onclick=function(){view('front');act('bFront',true);};
document.getElementById('bDoor').onclick=function(){doorOpen=!doorOpen;this.classList.toggle('on',doorOpen);};
document.getElementById('bXray').onclick=function(){
  shellMode=1; document.getElementById('shell-toggle').textContent='Shell: '+SHELL_MODES[shellMode];
  animOn=true; act('bAnimate',true); applyVis(); this.classList.add('on');};
document.getElementById('shell-toggle').onclick=function(){shellMode=(shellMode+1)%4;this.textContent='Shell: '+SHELL_MODES[shellMode];
  document.getElementById('bXray').classList.remove('on'); applyVis();};
document.getElementById('bPlateaus').onclick=function(){plateausOn=!plateausOn;this.classList.toggle('on',plateausOn);applyVis();};
document.getElementById('fan-slider').oninput=function(){fanSpeed=(+this.value)/100;updateFlowHUD();};
document.getElementById('moz-slider').oninput=function(){
  mozCount=+this.value; document.getElementById('moz-pct').textContent=mozCount;
  // hide newly-inactive particles; respawn newly-active ones
  for(let i=0;i<N;i++){if(i<mozCount)mspawn(i);else{mp[i*3]=9999;mp[i*3+1]=0;mp[i*3+2]=0;}}
  mGeo.attributes.position.needsUpdate=true;};
document.getElementById('bCut').onclick=function(){const c=document.getElementById('cut');c.classList.toggle('show');this.classList.toggle('on',c.classList.contains('show'));};
// ── "How it works" engine explainer: cutaway + labeled 6-step counterflow walk-through ──
const HOWSTEPS=[
  {t:"1 · One fan, always on",d:"A single 92 mm axial fan runs continuously. It draws suction at the center intake throat and pressurizes the sealed annular plenum around it.",role:"fan"},
  {t:"2 · CO₂ + scent injected",d:"A 6 mm line from the hidden CO₂ tank feeds the plenum, where the scent lure is added to the fan exhaust stream.",role:"co2"},
  {t:"3 · Split baffle + ducting",d:"A baffle splits the exhaust: ~30% is ducted UP to the curtain louvers, ~70% drops to the base vents — so the top of the trap stays pure suction.",role:"duct"},
  {t:"4 · CO₂ curtain projects out",d:"The gold louver ring throws the CO₂ / scent curtain OUTWARD and slightly down, spreading a heavier-than-air lure cloud across the approach zone.",role:"louver"},
  {t:"5 · Mosquito tracks the gradient",d:"A host-seeking mosquito follows the rising CO₂ gradient inward, toward the low-pressure center of the trap.",role:"throat"},
  {t:"6 · Downdraft → catch cup",d:"At the center the intake downdraft overpowers the insect and pulls it DOWN through the fan into the netted catch cup. Air passes the net; the mosquito is kept.",role:"cup"},
  {t:"7 · Bulk air exhausts low",d:"The 70% exhaust share leaves quietly through hidden vents at the foot — keeping the lure curtain and the suction throat from cancelling each other.",role:"vent"},
];
let howOn=false,howStep=0,howTimer=null;
function howMats(){return (cur.proc&&cur.proc.userData&&cur.proc.userData.roleMats)||null;}
function howClear(){const pr=howMats();if(pr)for(const k in pr)pr[k].forEach(m=>{if(m.emissive){m.emissive.setHex(0x000000);m.emissiveIntensity=0;}});}
function howHighlight(role){const pr=howMats();if(!pr)return;
  for(const k in pr)pr[k].forEach(m=>{if(!m.emissive)return; if(k===role){m.emissive.setHex(0xffd479);m.emissiveIntensity=0.95;}else{m.emissive.setHex(0x000000);m.emissiveIntensity=0;}});}
function howShow(n){const L=HOWSTEPS.length; howStep=((n%L)+L)%L; const s=HOWSTEPS[howStep];
  document.getElementById('how-title').textContent=s.t;
  document.getElementById('how-desc').textContent=s.d;
  document.getElementById('how-dots').innerHTML=HOWSTEPS.map((_,i)=>'<span class="'+(i===howStep?'on':'')+'"></span>').join('');
  howHighlight(s.role);}
function howStart(){howOn=true;document.getElementById('bHow').classList.add('on');
  shellMode=3;document.getElementById('shell-toggle').textContent='Shell: '+SHELL_MODES[shellMode];
  document.getElementById('bXray').classList.remove('on');
  animOn=true;act('bAnimate',true);applyVis();
  const t=(engCfg&&engCfg.headZ)?engCfg.headZ:MDL.targetZ, D=MDL.dist*0.72;
  controls.target.set(0,0,t);camera.position.set(D*0.55,-D*0.62,t+D*0.16);camera.lookAt(0,0,t);
  document.getElementById('howpanel').classList.add('show');howShow(0);
  clearInterval(howTimer);howTimer=setInterval(()=>howShow(howStep+1),3400);}
function howStop(){howOn=false;document.getElementById('bHow').classList.remove('on');
  clearInterval(howTimer);howTimer=null;howClear();document.getElementById('howpanel').classList.remove('show');}
document.getElementById('bHow').onclick=function(){howOn?howStop():howStart();};
document.getElementById('how-prev').onclick=function(){clearInterval(howTimer);howTimer=null;howShow(howStep-1);};
document.getElementById('how-next').onclick=function(){clearInterval(howTimer);howTimer=null;howShow(howStep+1);};
document.getElementById('how-x').onclick=howStop;
document.getElementById('fsx').onclick=function(){exitFs();};
function enterFs(){document.body.classList.add('fs');animOn=true;act('bAnimate',true);
  if(renderer.domElement.requestFullscreen)renderer.domElement.requestFullscreen().catch(()=>{});onResize();}
function exitFs(){document.body.classList.remove('fs');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});onResize();}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('fs');onResize();});

// ── dropdowns ──
const lineSel=document.getElementById('lineSel'),prodSel=document.getElementById('prodSel');
LINE_ORDER.forEach(L=>{const o=document.createElement('option');o.value=L;o.textContent=L;lineSel.appendChild(o);});
function fillProducts(L){prodSel.innerHTML='';(DATA.lines[L]||[]).forEach(pid=>{const o=document.createElement('option');o.value=pid;o.textContent=DATA.P[pid].name;prodSel.appendChild(o);});}
lineSel.onchange=function(){fillProducts(this.value);loadProduct(prodSel.value);};
prodSel.onchange=function(){loadProduct(this.value);};
fillProducts(LINE_ORDER[0]); loadProduct(DATA.lines[LINE_ORDER[0]][0]);

function onResize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',onResize);
