*{margin:0;padding:0;box-sizing:border-box}

label{font-size:11px;color:#888;display:flex;align-items:center;gap:5px}
#stat{font-size:11px;color:#aaa;margin-top:4px}
#corner{position:fixed;bottom:12px;right:14px;font-size:10px;color:#444;letter-spacing:.04em}

const GAP_B64   = "AgICAgICAgICAgICAgICAgICBAQEBAQEBAQEBAQEBAQEBAQEBgYGBgYGBgYGBgYGBgYGBgYGCAgICAgICAgICAgICAgICAgIDAwMDAwMDAwMDAwMDAwMDAwMEBAQEBAQEBAQEBAQEBAQEBAQFBQUFBQUFBQUFBQUFBQUFBQUAgICAgICAgICAgICAgICAgICBAQEBAQEBAQEBAQEBAQEBAQEBgYGBgYGBgYGBgYGBgYGBgYGCAgICAgICAgICAgICAgICAgIDAwMDAwMDAwMDAwMDAwMDAwMEBAQEBAQEBAQEBAQEBAQEBAQFBQUFBQUFBQUFBQUFBQUFBQUAgICAgICAgICAgICAgICAgICBAQEBAQEBAQEBAQEBAQEBAQEBgYGBgYGBgYGBgYGBgYGBgYGCAgICAgICAgICAgICAgICAgIDAwMDAwMDAwMDAwMDAwMDAwMEBAQEBAQEBAQEBAQEBAQEBAQFBQUFBQUFBQUFBQUFBQUFBQUAgICAgICAgICAgICAgICAgICBAQEBAQEBAQEBAQEBAQEBAQEBgYGBgYGBgYGBgYGBgYGBgYGCAgICAgICAgICAgICAgICAgIDAwMDAwMDAwMDAwMDAwMDAwMEBAQEBAQEBAQEBAQEBAQEBAQFBQUFBQUFBQUFBQUFBQUFBQUAgICAgICAgICAgICAgICAgICBAQEBAQEBAQEBAQEBAQEBAQEBgYGBgYGBgYGBgYGBgYGBgYGCAgICAgICAgICAgICAgICAgIDAwMDAwMDAwMDAwMDAwMDAwMEBAQEBAQEBAQEBAQEBAQEBAQFBQUFBQUFBQUFBQUFBQUFBQU";
const P = {"N": 630, "FRAMES": 81, "CX": 0.7407407760620117, "CY": 0.7407407760620117, "TRAP_W": 24.0, "TRAP_H": 54.0, "SHROUD_H": 8.0, "SLAT_Z0": 10.0, "SLAT_Z1": 48.0, "TUBE_OD": 10.0, "TUBE_Z0": 40.0, "TUBE_Z1": 42.0, "DT": 0.05, "RELEASE_T": 4.0, "MAX_GAP": 20};

// decode (may take ~100ms for large arrays)
const pathsFlat = b64f32(PATHS_B64);
const cap       = b64u8(CAP_B64);
const capStep   = b64u16(CAPST_B64);
const gapArr    = b64u8(GAP_B64);
const FRAMES = P.FRAMES, N = P.N;

document.getElementById("loading").style.display = "none";

// ── renderer ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

// ── scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080f);
scene.fog = new THREE.FogExp2(0x08080f, 0.0035);

const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 2000);
cam.position.set(P.CX + 85, P.CY - 70, 55);
cam.up.set(0, 0, 1);

const ctrl = new OrbitControls(cam, renderer.domElement);
ctrl.target.set(P.CX, P.CY, P.TRAP_H/2);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.08;
ctrl.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const dl = new THREE.DirectionalLight(0xffffff, 0.7);
dl.position.set(60, -40, 80); scene.add(dl);

// ── trap body ────────────────────────────────────────────────────────────────
const HW = P.TRAP_W/2;
const bodyGeo = new THREE.BoxGeometry(P.TRAP_W, P.TRAP_W, P.TRAP_H);

const bodyMesh = new THREE.Mesh(bodyGeo,
  new THREE.MeshPhongMaterial({color:0x1a2535, transparent:true, opacity:0.15,
                                 side:THREE.FrontSide, depthWrite:false}));
bodyMesh.position.set(P.CX, P.CY, P.TRAP_H/2);
scene.add(bodyMesh);

const bodyEdge = new THREE.LineSegments(new THREE.EdgesGeometry(bodyGeo),
  new THREE.LineBasicMaterial({color:0x2a3f55}));
bodyEdge.position.copy(bodyMesh.position);
scene.add(bodyEdge);

// slat rings
const slatMat = new THREE.LineBasicMaterial({color:0x2255bb, transparent:true, opacity:0.55});
const slatGroup = new THREE.Group();
slatGroup.position.set(P.CX, P.CY, 0);
for (let zz = P.SLAT_Z0; zz <= P.SLAT_Z1; zz += 2.75) {
  const pts = [
    new THREE.Vector3(-HW,-HW,zz), new THREE.Vector3( HW,-HW,zz),
    new THREE.Vector3( HW,-HW,zz), new THREE.Vector3( HW, HW,zz),
    new THREE.Vector3( HW, HW,zz), new THREE.Vector3(-HW, HW,zz),
    new THREE.Vector3(-HW, HW,zz), new THREE.Vector3(-HW,-HW,zz),
  ];
  slatGroup.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts), slatMat));
}
scene.add(slatGroup);

// catch-tube ring
const tubeRing = new THREE.Mesh(
  new THREE.TorusGeometry(P.TUBE_OD/2, 0.3, 8, 48),
  new THREE.MeshPhongMaterial({color:0x778899, transparent:true, opacity:0.7}));
tubeRing.position.set(P.CX, P.CY, P.TUBE_Z0);
tubeRing.rotation.x = Math.PI/2;
scene.add(tubeRing);

// ground
scene.add(Object.assign(
  new THREE.Mesh(new THREE.PlaneGeometry(300,300),
    new THREE.MeshPhongMaterial({color:0x0a150a, transparent:true, opacity:0.9})),
  {position: new THREE.Vector3(P.CX, P.CY, 0)}));

// ── particle trail lines ──────────────────────────────────────────────────────
const MAX_TRAIL = 40;
const lines = [];
for (let i = 0; i < N; i++) {
  const geo = new THREE.BufferGeometry();
  const posArr = new Float32Array(MAX_TRAIL * 3);
  geo.setAttribute("position", new THREE.BufferAttribute(posArr, 3));
  geo.setDrawRange(0, 0);
  const isCap = !!cap[i];
  const gapFrac = gapArr[i] / P.MAX_GAP;
  const opacity = (isCap ? 0.90 : 0.50) * (0.55 + 0.45*(1 - gapFrac*0.5));
  const mat = new THREE.LineBasicMaterial({
    color: isCap ? 0x39ff14 : 0xff3838,
    transparent: true, opacity
  });
  const line = new THREE.Line(geo, mat);
  line.frustumCulled = false;
  scene.add(line);
  lines.push({posArr, geo, isCap, capFrame: capStep[i]});
}

// ── animation ────────────────────────────────────────────────────────────────
let frame = 0, playing = true, speed = 1.5, trailLen = 18, lastT = 0, accumT = 0;

document.getElementById("btn").onclick = () => {
  playing = !playing;
  document.getElementById("btn").innerHTML = playing ? "&#9646;&#9646;" : "&#9654;";
};
document.getElementById("spd").oninput = e => speed = parseFloat(e.target.value);
document.getElementById("trl").oninput = e => trailLen = parseInt(e.target.value);
window.addEventListener("resize", () => {
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min((t - lastT)/1000, 0.05);
  lastT = t;

  if (playing) {
    accumT += dt * speed;
    const adv = Math.floor(accumT / P.DT);
    accumT -= adv * P.DT;
    frame = (frame + adv) % FRAMES;
  }

  const tl = Math.max(2, Math.min(trailLen, MAX_TRAIL));
  let captured = 0;
  for (let i = 0; i < N; i++) {
    const {posArr, geo, isCap, capFrame} = lines[i];
    if (isCap && frame >= capFrame) { geo.setDrawRange(0,0); captured++; continue; }
    const endF = Math.min(frame, isCap ? capFrame : FRAMES-1);
    const startF = Math.max(0, endF - tl + 1);
    const count = endF - startF + 1;
    for (let fi = startF; fi <= endF; fi++) {
      const base = (fi*N + i)*3, out = (fi-startF)*3;
      posArr[out]   = pathsFlat[base];
      posArr[out+1] = pathsFlat[base+1];
      posArr[out+2] = pathsFlat[base+2];
    }
    geo.attributes.position.needsUpdate = true;
    geo.setDrawRange(0, count);
  }

  document.getElementById("stat").textContent =
    `t=${(frame*P.DT).toFixed(1)}s  ·  ${captured}/${N} captured (${Math.round(100*captured/N)}%)`;
  ctrl.update();
  renderer.render(scene, cam);
}
animate(0);
</script>
