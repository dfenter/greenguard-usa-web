<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GreenGuard Mini</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#87ceeb; overflow:hidden; font-family:-apple-system,'SF Pro Display',system-ui,sans-serif; touch-action:none; }
canvas { display:block; }
#ui {
  position:fixed; top:4px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:4px; z-index:10;
}
.btn-row { display:flex; gap:6px; }
.btn {
  background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.35);
  color:#fff; padding:10px 18px; border-radius:6px; cursor:pointer;
  font-size:22px; letter-spacing:0.07em; text-transform:uppercase;
  -webkit-tap-highlight-color:transparent;
  text-shadow:0 1px 3px rgba(0,0,0,0.4);
}
.btn.active { background:rgba(55,195,80,0.55); border-color:#37c350; }
#info {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:5px;
  pointer-events:none;
}
#brand {
  color:rgba(255,255,255,0.85); font-size:15px; letter-spacing:0.08em;
  text-transform:uppercase; text-shadow:0 1px 4px rgba(0,0,0,0.3); text-align:center; white-space:nowrap;
}
#spec {
  color:rgba(255,255,255,0.7); font-size:20px; letter-spacing:0.11em;
  text-transform:uppercase; text-shadow:0 1px 4px rgba(0,0,0,0.3); text-align:center;
}
#loading {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,0.9); font-size:13px; letter-spacing:0.1em;
  text-transform:uppercase; z-index:20; pointer-events:none; background:#87ceeb;
}
</style>
</head>
<body>
<div id="loading">Rendering&hellip;</div>
<div id="ui">
  <div class="btn-row">
    <button class="btn" id="bFront">Front</button>
    <button class="btn" id="bSide">Side</button>
    <button class="btn" id="bBack">Back</button>
    <button class="btn active" id="b3Q">3/4</button>
  </div>
  <div class="btn-row">
    <button class="btn" id="bTop">Top</button>
    <button class="btn" id="bDoor">Door</button>
    <button class="btn" id="shell-toggle">Shell: solid</button>
    <label class="btn" id="color-label" style="cursor:pointer;display:flex;align-items:center;gap:6px;">
      Color <input type="color" id="color-pick" value="#0f0f12" style="width:28px;height:28px;border:none;background:none;cursor:pointer;padding:0;">
    </label>
  </div>
</div>
<div id="info">
  <div id="brand">GreenGuard Mini</div>
  <div id="brand">Drag to orbit &nbsp;&middot;&nbsp; Pinch to zoom</div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function() {
  var OC = function(camera, domElement) {
    this.camera = camera; this.domElement = domElement;
    this.target = new THREE.Vector3();
    this.enableDamping = true; this.dampingFactor = 0.055;
    this.minDistance = 14; this.maxDistance = 600;
    var scope = this;
    var spherical = new THREE.Spherical();
    var sphericalDelta = new THREE.Spherical();
    var scale = 1;
    var rotateStart = new THREE.Vector2(), rotateEnd = new THREE.Vector2(), rotateDelta = new THREE.Vector2();
    var panStart = new THREE.Vector2(), panEnd = new THREE.Vector2(), panDelta = new THREE.Vector2();
    var panOffset = new THREE.Vector3();
    var STATE = { NONE:-1, ROTATE:0, DOLLY:1, PAN:2 };
    var state = STATE.NONE;
    var EPS = 0.000001;
    function getZoomScale() { return Math.pow(0.95, 1); }
    function rotateLeft(a) { sphericalDelta.theta -= a; }
    function rotateUp(a)   { sphericalDelta.phi   -= a; }
    function dollyIn()  { scale /= 0.95; }
    function dollyOut() { scale *= 0.95; }
    function pan(dx, dy) {
      var el = scope.domElement;
      var offset = new THREE.Vector3();
      offset.copy(scope.camera.position).sub(scope.target);
      var targetDist = offset.length() * Math.tan(scope.camera.fov/2 * Math.PI/180);
      var x = 2 * dx * targetDist / el.clientHeight;
      var y = 2 * dy * targetDist / el.clientHeight;
      var right = new THREE.Vector3(); right.setFromMatrixColumn(scope.camera.matrix, 0);
      var up = scope.camera.up.clone();
      panOffset.addScaledVector(right, -x);
      panOffset.addScaledVector(up, y);
    }
    this.update = function() {
      var offset = new THREE.Vector3();
      var quat = new THREE.Quaternion().setFromUnitVectors(scope.camera.up, new THREE.Vector3(0,1,0));
      var quatInv = quat.clone().invert();
      offset.copy(scope.camera.position).sub(scope.target);
      offset.applyQuaternion(quat);
      spherical.setFromVector3(offset);
      if (scope.enableDamping) {
        spherical.theta += sphericalDelta.theta * scope.dampingFactor;
        spherical.phi   += sphericalDelta.phi   * scope.dampingFactor;
      } else {
        spherical.theta += sphericalDelta.theta;
        spherical.phi   += sphericalDelta.phi;
      }
      spherical.phi = Math.max(EPS, Math.min(Math.PI - EPS, spherical.phi));
      spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius * scale));
      scope.target.add(panOffset);
      offset.setFromSpherical(spherical).applyQuaternion(quatInv);
      scope.camera.position.copy(scope.target).add(offset);
      scope.camera.lookAt(scope.target);
      if (scope.enableDamping) {
        sphericalDelta.theta *= (1 - scope.dampingFactor);
        sphericalDelta.phi   *= (1 - scope.dampingFactor);
        panOffset.multiplyScalar(1 - scope.dampingFactor);
      } else { sphericalDelta.set(0,0,0); panOffset.set(0,0,0); }
      scale = 1;
    };
    // Mouse events
    function onMouseDown(e) {
      if (e.button === 0) { state = STATE.ROTATE; rotateStart.set(e.clientX, e.clientY); }
      else if (e.button === 2) { state = STATE.PAN; panStart.set(e.clientX, e.clientY); }
    }
    function onMouseMove(e) {
      if (state === STATE.ROTATE) {
        rotateEnd.set(e.clientX, e.clientY);
        rotateDelta.subVectors(rotateEnd, rotateStart).multiplyScalar(0.005);
        rotateLeft(rotateDelta.x); rotateUp(rotateDelta.y);
        rotateStart.copy(rotateEnd);
      } else if (state === STATE.PAN) {
        panEnd.set(e.clientX, e.clientY);
        panDelta.subVectors(panEnd, panStart);
        pan(panDelta.x, panDelta.y);
        panStart.copy(panEnd);
      }
    }
    function onMouseUp() { state = STATE.NONE; }
    function onWheel(e) { e.preventDefault(); if (e.deltaY < 0) dollyIn(); else dollyOut(); }
    // Touch events
    var touches = [new THREE.Vector2(), new THREE.Vector2()];
    var prevTouches = [new THREE.Vector2(), new THREE.Vector2()];
    var prevDist = 0;
    function onTouchStart(e) {
      e.preventDefault();
      if (e.touches.length === 1) { state = STATE.ROTATE; rotateStart.set(e.touches[0].clientX, e.touches[0].clientY); }
      else if (e.touches.length === 2) {
        state = STATE.DOLLY;
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        prevDist = Math.sqrt(dx*dx + dy*dy);
        panStart.set((e.touches[0].clientX+e.touches[1].clientX)/2, (e.touches[0].clientY+e.touches[1].clientY)/2);
      }
    }
    function onTouchMove(e) {
      e.preventDefault();
      if (e.touches.length === 1 && state === STATE.ROTATE) {
        rotateEnd.set(e.touches[0].clientX, e.touches[0].clientY);
        rotateDelta.subVectors(rotateEnd, rotateStart).multiplyScalar(0.005);
        rotateLeft(rotateDelta.x); rotateUp(rotateDelta.y);
        rotateStart.copy(rotateEnd);
      } else if (e.touches.length === 2 && state === STATE.DOLLY) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > prevDist) dollyIn(); else dollyOut();
        prevDist = dist;
        panEnd.set((e.touches[0].clientX+e.touches[1].clientX)/2, (e.touches[0].clientY+e.touches[1].clientY)/2);
        panDelta.subVectors(panEnd, panStart).multiplyScalar(0.5);
        pan(panDelta.x, panDelta.y);
        panStart.copy(panEnd);
      }
    }
    function onTouchEnd() { state = STATE.NONE; }
    domElement.addEventListener('mousedown', onMouseDown);
    domElement.addEventListener('mousemove', onMouseMove);
    domElement.addEventListener('mouseup',   onMouseUp);
    domElement.addEventListener('wheel',     onWheel, { passive: false });
    domElement.addEventListener('touchstart', onTouchStart, { passive: false });
    domElement.addEventListener('touchmove',  onTouchMove,  { passive: false });
    domElement.addEventListener('touchend',   onTouchEnd);
    domElement.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  };
  THREE.OrbitControls = OC;
})();
</script>
<script>

function parseSTL(b64) {
  var bin = atob(b64), buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  var view = new DataView(buf.buffer);
  var nTri = view.getUint32(80, true);
  var pos  = new Float32Array(nTri * 9);
  for (var t = 0; t < nTri; t++) {
    var off = 84 + t * 50 + 12;
    for (var v = 0; v < 3; v++) {
      var b = off + v * 12;
      pos[t*9+v*3]   = view.getFloat32(b,   true);
      pos[t*9+v*3+1] = view.getFloat32(b+4, true);
      pos[t*9+v*3+2] = view.getFloat32(b+8, true);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return geo;
}

// Renderer — iOS-safe flags
var renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
  failIfMajorPerformanceCaveat: false
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;   // shadows disabled — not supported reliably on iOS
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 180, 500);

// Sky gradient sphere
var skyGeo = new THREE.SphereGeometry(500, 32, 16);
skyGeo.scale(-1, 1, 1);
var skyMat = new THREE.ShaderMaterial({
  uniforms: {
    topColor:    { value: new THREE.Color(0x1a6fbb) },
    bottomColor: { value: new THREE.Color(0x87ceeb) },
    horizon: { value: 0.3 }, exponent: { value: 0.7 }
  },
  vertexShader: 'varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 topColor,bottomColor; uniform float horizon,exponent; varying vec3 vW; void main(){ float h=normalize(vW).z; float t=pow(max(0.0,h+horizon),exponent); gl_FragColor=vec4(mix(bottomColor,topColor,clamp(t,0.0,1.0)),1.0); }',
  side: THREE.BackSide, depthWrite: false
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// Camera
var camera = new THREE.PerspectiveCamera(22, innerWidth/innerHeight, 0.5, 1000);
camera.up.set(0, 0, 1);
camera.position.set(140, -140, 85);
camera.lookAt(0, 0, 24);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 24);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 14;
controls.maxDistance = 600;

// Lighting — no shadow maps needed
var sun = new THREE.DirectionalLight(0xfff5e0, 3.8);
sun.position.set(-80, -100, 160);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xb0d8ff, 0x6a9968, 1.1));
var bounce = new THREE.DirectionalLight(0xa8c880, 0.30);
bounce.position.set(0, 0, -1);
scene.add(bounce);

// Ground
var gnd = new THREE.Mesh(
  new THREE.CircleGeometry(300, 64),
  new THREE.MeshStandardMaterial({ color:0x4a7c3f, roughness:0.95, metalness:0.0 })
);
scene.add(gnd);

// Materials — MeshStandardMaterial only (iOS safe, no clearcoat)
var shellSolidMat = new THREE.MeshStandardMaterial({
  color: 0x0f0f12, metalness: 0.28, roughness: 0.52,
  polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
});
var shellGhostMat = new THREE.MeshStandardMaterial({
  color: 0x0f0f12, metalness: 0.10, roughness: 0.55,
  transparent: true, opacity: 0.22, side: THREE.DoubleSide
});
var internalsMat = new THREE.MeshStandardMaterial({
  color: 0x8a9aaa, metalness: 0.60, roughness: 0.42
});

// Parse and add meshes
var shellGeo = parseSTL(SHELL_B64);
var intGeo   = parseSTL(INTERNALS_B64);

var intMesh = new THREE.Mesh(intGeo, internalsMat);
intMesh.visible = false;
scene.add(intMesh);

var shellMesh = new THREE.Mesh(shellGeo, shellSolidMat);
shellMesh.renderOrder = 1;
scene.add(shellMesh);

// Door — real STL panel on a hinge pivot
// Hinge at left edge, mid-door height: x = -(hw(16.5)-0.25) = -10.22", y = -hd(16.5) = -10.47"
(function() {
  var doorGeo = parseSTL(DOOR_B64);
  var doorMat = new THREE.MeshStandardMaterial({
    color: 0x0f0f12, metalness: 0.28, roughness: 0.52, side: THREE.DoubleSide
  });
  var doorMesh = new THREE.Mesh(doorGeo, doorMat);

  var pivX = -8.4348;  // door hinge X (left edge, mid-door)
  var pivY = -8.6848;  // door hinge Y (front face, mid-door)
  window._doorGroup = new THREE.Group();
  window._doorGroup.position.set(pivX, pivY, 0);
  doorMesh.position.set(-pivX, -pivY, 0);
  window._doorGroup.add(doorMesh);
  scene.add(window._doorGroup);

  window._doorOpen = false;
  window._doorAngle = 0;
  window._doorTarget = 0;
})();

document.getElementById('loading').style.display = 'none';

// Shell toggle
var SHELL_MODES = ['solid','ghost','hidden'];
var shellMode = 0;
var toggleBtn = document.getElementById('shell-toggle');
toggleBtn.addEventListener('click', function() {
  shellMode = (shellMode + 1) % 3;
  var m = SHELL_MODES[shellMode];
  toggleBtn.textContent = 'Shell: ' + m;
  if (m === 'solid')  { shellMesh.material = shellSolidMat; shellMesh.visible = true;  intMesh.visible = false; }
  if (m === 'ghost')  { shellMesh.material = shellGhostMat; shellMesh.visible = true;  intMesh.visible = true;  }
  if (m === 'hidden') { shellMesh.visible = false;                                      intMesh.visible = true;  }
});

// Camera presets
var PRESETS = {
  front: { pos:[0,-148,44],   tgt:[0,0,24] },
  side:  { pos:[148,0,44],    tgt:[0,0,24] },
  back:  { pos:[0,148,44],    tgt:[0,0,24] },
  '3q':  { pos:[140,-140,85], tgt:[0,0,24] },
  top:   { pos:[0,-8,220],    tgt:[0,0,24] },
};
function flyTo(k) {
  var p = PRESETS[k];
  var p0 = camera.position.clone(), t0 = controls.target.clone();
  var p1 = new THREE.Vector3().fromArray(p.pos);
  var t1 = new THREE.Vector3().fromArray(p.tgt);
  var dur = 820, s = performance.now();
  (function tick() {
    var r = Math.min((performance.now()-s)/dur, 1), e = r<.5?2*r*r:-1+(4-2*r)*r;
    camera.position.lerpVectors(p0, p1, e);
    controls.target.lerpVectors(t0, t1, e);
    if (r < 1) requestAnimationFrame(tick);
  })();
}
var BM = { bFront:'front', bSide:'side', bBack:'back', b3Q:'3q', bTop:'top' };
Object.keys(BM).forEach(function(id) {
  document.getElementById(id).addEventListener('click', function() {
    document.querySelectorAll('.btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    flyTo(BM[id]);
  });
});

// Door toggle
document.getElementById('bDoor').addEventListener('click', function() {
  window._doorOpen = !window._doorOpen;
  window._doorTarget = window._doorOpen ? -Math.PI / 2 : 0;
  this.classList.toggle('active', window._doorOpen);
});

// Color picker
document.getElementById('color-pick').addEventListener('input', function() {
  var c = new THREE.Color(this.value);
  shellSolidMat.color.set(c);
  shellGhostMat.color.set(c);
  if (window._doorGroup) window._doorGroup.children[0].material.color.set(c);
});

// Render loop
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (window._doorGroup) {
    window._doorAngle += (window._doorTarget - window._doorAngle) * 0.08;
    window._doorGroup.rotation.z = window._doorAngle;
  }
  renderer.render(scene, camera);
})();
window.addEventListener('resize', function() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
