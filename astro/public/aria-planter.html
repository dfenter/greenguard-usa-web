var IN=new THREE.Group();IN.visible=false;scene.add(IN);
var steel=new THREE.MeshStandardMaterial({color:0x9aa0a6,metalness:0.55,roughness:0.4,side:THREE.DoubleSide});
var funH=Math.min(150,TOP*0.34);
var fun=new THREE.Mesh(new THREE.CylinderGeometry(92,33,funH,30,1,true),steel);fun.rotation.x=Math.PI/2;fun.position.set(0,0,TOP-funH/2-6);IN.add(fun);

var tube=new THREE.Mesh(new THREE.CylinderGeometry(33,33,tubeH,22,1,true),steel);tube.rotation.x=Math.PI/2;tube.position.set(0,0,tubeBot+tubeH/2);IN.add(tube);

FAN.add(new THREE.Mesh(new THREE.CylinderGeometry(7,7,8,12),new THREE.MeshStandardMaterial({color:0x2a2f33})));FAN.children[0].rotation.x=Math.PI/2;

// procedural mosquito swarm drawn into the top intake
var SW=110,sgeo=new THREE.SphereGeometry(SZ*0.018,6,6),sw=[];var T=new THREE.Vector3(0,0,TOP);
function spawn(p){var a=Math.random()*6.283,r=SZ*(0.30+Math.random()*0.24),h=SZ*(0.06+Math.random()*0.5);p.set(T.x+r*Math.cos(a),T.y+r*Math.sin(a),T.z+h);}

document.getElementById('banim').onclick=function(){swOn=!swOn;this.classList.toggle('active',swOn);for(var i=0;i<SW;i++)sw[i].visible=swOn;};
