<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Monolith Micro</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:radial-gradient(1300px 900px at 55% -5%,#101712,#0a0f0b 70%),#080c09; overflow:hidden; font-family:-apple-system,'SF Pro Text',system-ui,sans-serif; touch-action:none; -webkit-font-smoothing:antialiased; height:100vh; display:flex; flex-direction:column; }
body > canvas { order:1; flex:1; min-height:0; width:100%; display:block; }
#ui {
  order:0; flex:none; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px;
  padding:7px 11px; background:rgba(8,12,9,.94); border-bottom:1px solid rgba(198,169,107,.25); z-index:10;
}
.btn-row { display:flex; gap:6px; flex-wrap:wrap; }
.btn {
  background:linear-gradient(180deg,rgba(14,18,14,.62),rgba(9,13,10,.74)); border:1px solid rgba(198,169,107,.28);
  color:#eef1ea; padding:6px 10px; border-radius:7px; cursor:pointer;
  font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  -webkit-tap-highlight-color:transparent; backdrop-filter:blur(12px); white-space:nowrap;
}
.btn.active { background:#c6a96b; border-color:#c6a96b; color:#15110a; }
#info {
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:4px;
  pointer-events:none;
}
#brand {
  color:#c6a96b; font-family:Georgia,'Times New Roman',serif; font-size:15px; letter-spacing:0.16em;
  text-transform:uppercase; text-align:center; white-space:nowrap;
}
#brand + #brand {
  color:rgba(230,238,230,0.5); font-family:-apple-system,system-ui,sans-serif; font-size:11px; letter-spacing:0.12em;
}
#spec {
  color:rgba(230,238,230,0.55); font-size:12px; letter-spacing:0.13em;
  text-transform:uppercase; text-align:center;
}
#loading {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  color:#9aa69c; font-size:12px; letter-spacing:0.1em;
  text-transform:uppercase; z-index:20; pointer-events:none; background:#080c09;
}
</style>
</head>
<body>
<div id="loading">Rendering&hellip;</div>
<div id="ui">
  <div class="btn-row">
    <button class="btn" id="bFront">Front</button>
    <button class="btn active" id="b3Q">3/4</button>
  </div>
  <div class="btn-row">
    <button class="btn" id="bDoor">Door</button>
    <button class="btn" id="shell-toggle">Shell: solid</button>
    <label class="btn" id="color-label" style="cursor:pointer;display:flex;align-items:center;gap:6px;">
      Color <input type="color" id="color-pick" value="#0f0f12" style="width:28px;height:28px;border:none;background:none;cursor:pointer;padding:0;">
    </label>
  </div>
  <div class="btn-row">
    <button class="btn active" id="bPlateaus">Plateaus</button>
    <button class="btn active" id="bCO2">CO2 Ring</button>
    <button class="btn active" id="bAnimate">Animate</button>
  </div>
</div>
<div id="info">
  <div id="brand">Monolith Micro</div>
  <div id="brand">Drag to orbit &nbsp;&middot;&nbsp; Pinch to zoom</div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function() {
  var OC = function(camera, domElement) {
    this.camera = camera; this.domElement = domElement;
    this.target = new THREE.Vector3();
    this.enableDamping = true; this.dampingFactor = 0.055;
    this.minDistance = 14; this.maxDistance = 600;
    var scope = this;
    var spherical = new THREE.Spherical();
    var sphericalDelta = new THREE.Spherical();
    var scale = 1;
    var rotateStart = new THREE.Vector2(), rotateEnd = new THREE.Vector2(), rotateDelta = new THREE.Vector2();
    var panStart = new THREE.Vector2(), panEnd = new THREE.Vector2(), panDelta = new THREE.Vector2();
    var panOffset = new THREE.Vector3();
    var STATE = { NONE:-1, ROTATE:0, DOLLY:1, PAN:2 };
    var state = STATE.NONE;
    var EPS = 0.000001;
    function getZoomScale() { return Math.pow(0.95, 1); }
    function rotateLeft(a) { sphericalDelta.theta -= a; }
    function rotateUp(a)   { sphericalDelta.phi   -= a; }
    function dollyIn()  { scale /= 0.95; }
    function dollyOut() { scale *= 0.95; }
    function pan(dx, dy) {
      var el = scope.domElement;
      var offset = new THREE.Vector3();
      offset.copy(scope.camera.position).sub(scope.target);
      var targetDist = offset.length() * Math.tan(scope.camera.fov/2 * Math.PI/180);
      var x = 2 * dx * targetDist / el.clientHeight;
      var y = 2 * dy * targetDist / el.clientHeight;
      var right = new THREE.Vector3(); right.setFromMatrixColumn(scope.camera.matrix, 0);
      var up = scope.camera.up.clone();
      panOffset.addScaledVector(right, -x);
      panOffset.addScaledVector(up, y);
    }
    this.update = function() {
      var offset = new THREE.Vector3();
      var quat = new THREE.Quaternion().setFromUnitVectors(scope.camera.up, new THREE.Vector3(0,1,0));
      var quatInv = quat.clone().invert();
      offset.copy(scope.camera.position).sub(scope.target);
      offset.applyQuaternion(quat);
      spherical.setFromVector3(offset);
      if (scope.enableDamping) {
        spherical.theta += sphericalDelta.theta * scope.dampingFactor;
        spherical.phi   += sphericalDelta.phi   * scope.dampingFactor;
      } else {
        spherical.theta += sphericalDelta.theta;
        spherical.phi   += sphericalDelta.phi;
      }
      spherical.phi = Math.max(EPS, Math.min(Math.PI - EPS, spherical.phi));
      spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius * scale));
      scope.target.add(panOffset);
      offset.setFromSpherical(spherical).applyQuaternion(quatInv);
      scope.camera.position.copy(scope.target).add(offset);
      scope.camera.lookAt(scope.target);
      if (scope.enableDamping) {
        sphericalDelta.theta *= (1 - scope.dampingFactor);
        sphericalDelta.phi   *= (1 - scope.dampingFactor);
        panOffset.multiplyScalar(1 - scope.dampingFactor);
      } else { sphericalDelta.set(0,0,0); panOffset.set(0,0,0); }
      scale = 1;
    };
    // Mouse events
    function onMouseDown(e) {
      if (e.button === 0) { state = STATE.ROTATE; rotateStart.set(e.clientX, e.clientY); }
      else if (e.button === 2) { state = STATE.PAN; panStart.set(e.clientX, e.clientY); }
    }
    function onMouseMove(e) {
      if (state === STATE.ROTATE) {
        rotateEnd.set(e.clientX, e.clientY);
        rotateDelta.subVectors(rotateEnd, rotateStart).multiplyScalar(0.005);
        rotateLeft(rotateDelta.x); rotateUp(rotateDelta.y);
        rotateStart.copy(rotateEnd);
      } else if (state === STATE.PAN) {
        panEnd.set(e.clientX, e.clientY);
        panDelta.subVectors(panEnd, panStart);
        pan(panDelta.x, panDelta.y);
        panStart.copy(panEnd);
      }
    }
    function onMouseUp() { state = STATE.NONE; }
    function onWheel(e) { e.preventDefault(); if (e.deltaY < 0) dollyIn(); else dollyOut(); }
    // Touch events
    var touches = [new THREE.Vector2(), new THREE.Vector2()];
    var prevTouches = [new THREE.Vector2(), new THREE.Vector2()];
    var prevDist = 0;
    function onTouchStart(e) {
      e.preventDefault();
      if (e.touches.length === 1) { state = STATE.ROTATE; rotateStart.set(e.touches[0].clientX, e.touches[0].clientY); }
      else if (e.touches.length === 2) {
        state = STATE.DOLLY;
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        prevDist = Math.sqrt(dx*dx + dy*dy);
        panStart.set((e.touches[0].clientX+e.touches[1].clientX)/2, (e.touches[0].clientY+e.touches[1].clientY)/2);
      }
    }
    function onTouchMove(e) {
      e.preventDefault();
      if (e.touches.length === 1 && state === STATE.ROTATE) {
        rotateEnd.set(e.touches[0].clientX, e.touches[0].clientY);
        rotateDelta.subVectors(rotateEnd, rotateStart).multiplyScalar(0.005);
        rotateLeft(rotateDelta.x); rotateUp(rotateDelta.y);
        rotateStart.copy(rotateEnd);
      } else if (e.touches.length === 2 && state === STATE.DOLLY) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > prevDist) dollyIn(); else dollyOut();
        prevDist = dist;
        panEnd.set((e.touches[0].clientX+e.touches[1].clientX)/2, (e.touches[0].clientY+e.touches[1].clientY)/2);
        panDelta.subVectors(panEnd, panStart).multiplyScalar(0.5);
        pan(panDelta.x, panDelta.y);
        panStart.copy(panEnd);
      }
    }
    function onTouchEnd() { state = STATE.NONE; }
    domElement.addEventListener('mousedown', onMouseDown);
    domElement.addEventListener('mousemove', onMouseMove);
    domElement.addEventListener('mouseup',   onMouseUp);
    domElement.addEventListener('wheel',     onWheel, { passive: false });
    domElement.addEventListener('touchstart', onTouchStart, { passive: false });
    domElement.addEventListener('touchmove',  onTouchMove,  { passive: false });
    domElement.addEventListener('touchend',   onTouchEnd);
    domElement.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  };
  THREE.OrbitControls = OC;
})();
</script>
<script>

function parseSTL(b64) {
  if (!b64) return null;
  var bin = atob(b64), buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  var view = new DataView(buf.buffer);
  var nTri = view.getUint32(80, true);
  var pos  = new Float32Array(nTri * 9);
  for (var t = 0; t < nTri; t++) {
    var off = 84 + t * 50 + 12;
    for (var v = 0; v < 3; v++) {
      var b = off + v * 12;
      pos[t*9+v*3]   = view.getFloat32(b,   true);
      pos[t*9+v*3+1] = view.getFloat32(b+4, true);
      pos[t*9+v*3+2] = view.getFloat32(b+8, true);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return geo;
}

// ── PARTICLE ANIMATIONS ───────────────────────────────────────────
// CO2 plume: green particles fall from the ring nozzles down the outside faces
// (CO2 is heavier than air → falling lure curtain). Mosquitoes: dark specks drift
// in from the surrounding air toward the slat band and accelerate as they're sucked in.
var animateOn = true;

// CO2 plume — spawn on the ring perimeter at the hat underside, fall + drift outward.
var CO2_N = 220;
var co2Pos = new Float32Array(CO2_N * 3);
var co2V   = new Float32Array(CO2_N * 3);
function co2Spawn(i) {
  var s = MDL.ringHalf;
  var edge = Math.floor(Math.random() * 4), t = (Math.random() * 2 - 1) * s;
  var x = (edge === 0) ? s : (edge === 1) ? -s : t;
  var y = (edge === 2) ? s : (edge === 3) ? -s : t;
  if (edge === 0 || edge === 1) y = t;
  if (edge === 2 || edge === 3) x = t;
  co2Pos[i*3] = x; co2Pos[i*3+1] = y; co2Pos[i*3+2] = MDL.H - 1 - Math.random() * 2;
  var out = 0.06;                       // gentle outward drift so the curtain hugs the faces
  co2V[i*3]   = Math.sign(x || 1) * out * Math.random();
  co2V[i*3+1] = Math.sign(y || 1) * out * Math.random();
  co2V[i*3+2] = -(0.18 + Math.random() * 0.22);   // downward fall
}
for (var i = 0; i < CO2_N; i++) { co2Spawn(i); co2Pos[i*3+2] = Math.random() * MDL.H; }
var co2Geo = new THREE.BufferGeometry();
co2Geo.setAttribute('position', new THREE.BufferAttribute(co2Pos, 3));
var co2Sprite = new THREE.Points(co2Geo, new THREE.PointsMaterial({
  color: 0x6ff0a0, size: 1.7, transparent: true, opacity: 0.55,
  depthWrite: false, blending: THREE.AdditiveBlending
}));
scene.add(co2Sprite);

// Mosquitoes — drift in toward the slat band (mid-height) and get sucked in.
var MOZ_N = 46;
var mozPos = new Float32Array(MOZ_N * 3);
var mozPhase = new Float32Array(MOZ_N);
function mozSpawn(i) {
  var ang = Math.random() * Math.PI * 2, r = 48 + Math.random() * 70;
  mozPos[i*3]   = Math.cos(ang) * r;
  mozPos[i*3+1] = Math.sin(ang) * r;
  mozPos[i*3+2] = 12 + Math.random() * (MDL.H - 18);
  mozPhase[i]   = Math.random() * Math.PI * 2;
}
for (var i = 0; i < MOZ_N; i++) mozSpawn(i);
var mozGeo = new THREE.BufferGeometry();
mozGeo.setAttribute('position', new THREE.BufferAttribute(mozPos, 3));
var mozSprite = new THREE.Points(mozGeo, new THREE.PointsMaterial({
  color: 0x141414, size: 1.5, transparent: true, opacity: 0.92, depthWrite: false
}));
scene.add(mozSprite);

function stepParticles() {
  // CO2 fall
  for (var i = 0; i < CO2_N; i++) {
    co2Pos[i*3]   += co2V[i*3];
    co2Pos[i*3+1] += co2V[i*3+1];
    co2Pos[i*3+2] += co2V[i*3+2];
    co2V[i*3+2]   -= 0.004;            // slight gravity accel
    if (co2Pos[i*3+2] < 2) co2Spawn(i);
  }
  co2Geo.attributes.position.needsUpdate = true;
  // Mosquito inward suction
  for (var i = 0; i < MOZ_N; i++) {
    var x = mozPos[i*3], y = mozPos[i*3+1], z = mozPos[i*3+2];
    var hr = Math.sqrt(x*x + y*y);
    var shell = hwAt(z);
    if (hr < shell + 1.5) { mozSpawn(i); continue; }   // sucked into the slats → respawn
    var pull = 0.5 + 6.0 / Math.max(hr - shell, 2);    // accelerate as it nears the intake
    var nx = -x / hr, ny = -y / hr;
    mozPhase[i] += 0.3;
    mozPos[i*3]   += nx * pull + Math.cos(mozPhase[i]) * 0.25;   // erratic mosquito drift
    mozPos[i*3+1] += ny * pull + Math.sin(mozPhase[i]) * 0.25;
    mozPos[i*3+2] += Math.sin(mozPhase[i] * 0.7) * 0.18;
  }
  mozGeo.attributes.position.needsUpdate = true;
}

  window._doorGroup.position.set(pivX, pivY, 0);
  doorMesh.position.set(-pivX, -pivY, 0);

  window._doorOpen = false;

})();

  var planes = on ? [clipPlane] : [];
  [shellSolidMat, shellGhostMat, shellFaintMat, internalsMat, plateauMat,
   co2RingMat, window._doorMat].forEach(function(mt){
    if (mt) { mt.clippingPlanes = planes; mt.needsUpdate = true; }
  });
}
function refreshPlateaus() {
  if (!plateausMesh) return;
  var m = SHELL_MODES[shellMode];
  plateausMesh.visible  = plateausOn;
  plateausMesh.material = (m === 'ghost' || m === 'hidden') ? shellGhostMat : shellSolidMat;
}
toggleBtn.addEventListener('click', function() {
  shellMode = (shellMode + 1) % SHELL_MODES.length;
  var m = SHELL_MODES[shellMode];
  toggleBtn.textContent = 'Shell: ' + m;
  setClip(m === 'cutaway');
  if (m === 'solid')   { shellMesh.material = shellSolidMat; shellMesh.visible = true;  intMesh.visible = false; }
  if (m === 'ghost')   { shellMesh.material = shellGhostMat; shellMesh.visible = true;  intMesh.visible = true;  }
  if (m === 'hidden')  { shellMesh.visible = false;                                     intMesh.visible = true;  }
  if (m === 'cutaway') { shellMesh.material = shellSolidMat; shellMesh.visible = true;  intMesh.visible = true;  }
  refreshPlateaus();
});

// Plateaus toggle
document.getElementById('bPlateaus').addEventListener('click', function() {
  plateausOn = !plateausOn;
  this.classList.toggle('active', plateausOn);
  refreshPlateaus();
});

// CO2 ring toggle (geometry)
document.getElementById('bCO2').addEventListener('click', function() {
  co2On = !co2On;
  this.classList.toggle('active', co2On);
  if (co2Mesh) co2Mesh.visible = co2On;
});

// Animate toggle (CO2 plume + mosquitoes)
document.getElementById('bAnimate').addEventListener('click', function() {
  animateOn = !animateOn;
  this.classList.toggle('active', animateOn);
  co2Sprite.visible = animateOn;
  mozSprite.visible = animateOn;
});

// Camera presets
var PRESETS = {
  front: { pos:[0,-148,44],   tgt:[0,0,18] },
  side:  { pos:[148,0,44],    tgt:[0,0,18] },
  back:  { pos:[0,148,44],    tgt:[0,0,18] },
  '3q':  { pos:[140,-140,85], tgt:[0,0,18] },
  top:   { pos:[0,-8,220],    tgt:[0,0,18] },
};
function flyTo(k) {
  var p = PRESETS[k];
  var p0 = camera.position.clone(), t0 = controls.target.clone();
  var p1 = new THREE.Vector3().fromArray(p.pos);
  var t1 = new THREE.Vector3().fromArray(p.tgt);
  var dur = 820, s = performance.now();
  (function tick() {
    var r = Math.min((performance.now()-s)/dur, 1), e = r<.5?2*r*r:-1+(4-2*r)*r;
    camera.position.lerpVectors(p0, p1, e);
    controls.target.lerpVectors(t0, t1, e);
    if (r < 1) requestAnimationFrame(tick);
  })();
}
var BM = { bFront:'front', b3Q:'3q' };
Object.keys(BM).forEach(function(id) {
  document.getElementById(id).addEventListener('click', function() {
    document.querySelectorAll('.btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    flyTo(BM[id]);
  });
});

// Door toggle
document.getElementById('bDoor').addEventListener('click', function() {
  window._doorOpen = !window._doorOpen;
  window._doorTarget = window._doorOpen ? -Math.PI / 2 : 0;
  this.classList.toggle('active', window._doorOpen);
});

// Color picker
document.getElementById('color-pick').addEventListener('input', function() {
  var c = new THREE.Color(this.value);
  shellSolidMat.color.set(c);
  shellGhostMat.color.set(c);
  if (window._doorGroup) window._doorGroup.children[0].material.color.set(c);
});

// Render loop
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (window._doorGroup) {
    window._doorAngle += (window._doorTarget - window._doorAngle) * 0.08;
    window._doorGroup.rotation.z = window._doorAngle;
  }
  if (animateOn) stepParticles();
  renderer.render(scene, camera);
})();
function fitCanvas() {
  var cv = renderer.domElement;
  var w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', fitCanvas);
fitCanvas();
</script>
