# render.yaml — GreenGuard USA Render service definitions
#
# This file captures Render services in version control.
# Before committing changes, verify against live state:
#   render services list
#
# Environment variables use sync: false so secrets stay out of git.
# Manage env vars with: ./scripts/env-sync.sh --render-only
#
# To find your service ID: render services list
# Add RENDER_SERVICE_ID=<id> to app/.env (local only, never synced).

services:
  # greenguard-agent — FastAPI billing server deployed from its own repo:
  #   github.com/greenguard-usa/greenguard-agent
  # Live URL:  https://greenguard-agent-tmw2.onrender.com
  # Health:    GET /health → {"status":"ok"}
  # Render ID: srv-d86foj28qa3s73ffpb00
  # Note: env vars are managed in the agent repo's render.yaml, not here.
  #       This entry is for reference only — do not redeploy from this repo.
  - type: web_service
    name: greenguard-agent
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webhook_server:app --host 0.0.0.0 --port $PORT
    autoDeploy: false
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CALCOM_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CALENDAR_TIMEZONE
        value: America/Chicago
