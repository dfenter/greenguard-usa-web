<!doctype html>
<html lang="en">
<head><base href="/play/kart-circuit-zero/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Kart Circuit Zero</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10231f}
    body{touch-action:none;user-select:none}
    #game{display:block;width:100vw;height:100vh;touch-action:none}
    #hud{position:fixed;inset:0;pointer-events:none;color:#f6f1d4;text-shadow:0 2px 3px #07110f}
    .row{position:absolute;top:clamp(12px,3vw,26px);display:flex;align-items:center;gap:10px}
    #left{left:clamp(14px,3vw,32px)}
    #right{right:clamp(14px,3vw,32px);text-align:right}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a9c2ad;font-weight:800}
    .big{font-size:clamp(22px,4vw,37px);line-height:1;font-weight:900;letter-spacing:.02em}
    #time{font-variant-numeric:tabular-nums}
    #hint{position:absolute;left:50%;top:clamp(70px,14vh,110px);transform:translateX(-50%);padding:8px 13px;border:1px solid #ffffff28;border-radius:20px;background:#06131088;color:#dce4be;font-size:12px;letter-spacing:.03em;white-space:nowrap;transition:opacity .35s}
    #hint.fade{opacity:.18}
    button{font:inherit;color:inherit;border:0;cursor:pointer}
    #trackButton{pointer-events:auto;background:#f1d35e;color:#17281f;font-size:12px;font-weight:900;padding:9px 12px;border-radius:9px;box-shadow:0 3px 0 #a88d31;min-height:48px}
    #drift{pointer-events:auto;position:absolute;right:clamp(18px,5vw,70px);bottom:clamp(18px,5vw,48px);width:clamp(92px,15vw,142px);height:clamp(64px,13vw,106px);border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff5a8,#f4cf42 48%,#b48a26);color:#1c2a1a;font-weight:1000;font-size:clamp(14px,2.5vw,21px);letter-spacing:.08em;box-shadow:0 7px 0 #765d22,0 0 0 5px #f4d86132;transition:transform .08s,filter .08s}
    #drift.held{transform:translateY(5px) scale(.96);filter:saturate(1.35) brightness(1.1);box-shadow:0 2px 0 #765d22,0 0 24px #fff18d}
    #rotate{display:none;position:fixed;z-index:8;inset:0;align-items:center;justify-content:center;text-align:center;background:#0c1c18eF;color:#f6f1d4;padding:28px}
    #rotate .card{max-width:310px;padding:26px;border:1px solid #ffffff25;border-radius:20px;background:#162e27;box-shadow:0 18px 50px #0008}
    #rotate .icon{font-size:48px;display:block;margin-bottom:12px}
    #rotate p{margin:0;color:#b9cab3;font-size:14px}
    #finish{display:none;position:fixed;z-index:7;inset:0;align-items:center;justify-content:center;background:#0713109a;color:#f8f2d6;text-align:center;padding:18px}
    #finish.show{display:flex}
    #finish .card{width:min(390px,90vw);padding:25px 24px 22px;border:1px solid #ffffff2b;border-radius:22px;background:linear-gradient(145deg,#244d3d,#122b24);box-shadow:0 20px 60px #0009}
    #resultTitle{margin:0 0 6px;font-size:clamp(28px,7vw,44px);letter-spacing:.02em}
    #resultTime{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:#f4d55e}
    #medal{height:30px;margin:8px 0 16px;font-weight:800;color:#c7d5ad}
    #restart{background:#f1d35e;color:#17281f;font-weight:900;border-radius:10px;padding:13px 18px;min-height:48px;min-width:150px;box-shadow:0 4px 0 #a88d31}
    @media (orientation:portrait){#rotate{display:flex}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="Kart Circuit Zero game"></canvas>
  <div id="hud">
    <div id="left" class="row"><div><div class="eyebrow" id="trackName">CIRCUIT 01</div><div class="big" id="lap">LAP 1 / 3</div></div></div>
    <div id="right" class="row"><div><div class="eyebrow">TIME <span id="bestText"></span></div><div class="big" id="time">00:00.00</div></div><button id="trackButton" aria-label="Next circuit">NEXT</button></div>
    <div id="hint">Drag left/right to steer · hold DRIFT, release to boost</div>
    <button id="drift" aria-label="Hold to drift">DRIFT</button>
  </div>
  <div id="finish"><div class="card"><h1 id="resultTitle">RUN COMPLETE</h1><div id="resultTime">00:00.00</div><div id="medal"></div><button id="restart">RACE AGAIN</button></div></div>
  <div id="rotate"><div class="card"><span class="icon">↻</span><strong>ROTATE TO RACE</strong><p>This circuit needs a little more road. Turn your phone sideways.</p></div></div>
  <script src="game.js"></script>
</body>
</html>
