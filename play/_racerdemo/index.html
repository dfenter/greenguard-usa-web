<!doctype html>
<html lang="en">
<head>
  <base href="/play/_racerdemo/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090e1a">
  <title>GGRacer — Acceptance Run</title>
  <style>
    :root { color-scheme: dark; --ink: #f4ead6; --muted: #a4b3c5; --line: rgba(255,255,255,.18); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090e1a; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
    #shell { position: fixed; inset: 0; overflow: hidden; background: #090e1a; }
    #scene { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
    #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,.45) 120%); }
    #hud { position: absolute; inset: 0; pointer-events: none; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .row { display: flex; align-items: center; gap: 10px; }
    .topline { justify-content: space-between; }
    .chip { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(8, 15, 27, .68); backdrop-filter: blur(10px); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    #brand { font-weight: 800; letter-spacing: .14em; }
    #speed { position: absolute; left: 18px; bottom: 18px; font-size: clamp(28px, 7vw, 54px); line-height: .9; font-weight: 800; letter-spacing: -.06em; text-shadow: 0 3px 18px #000; }
    #speed small { display: block; margin-top: 7px; font-size: 10px; letter-spacing: .16em; color: var(--muted); }
    #minimap { position: absolute; right: 18px; bottom: 18px; width: 124px; height: 92px; border: 1px solid var(--line); border-radius: 12px; background: rgba(8, 15, 27, .68); }
    #hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(8,15,27,.54); color: var(--muted); font-size: 10px; letter-spacing: .08em; white-space: nowrap; }
    #actions { position: absolute; top: 60px; right: 16px; display: flex; gap: 8px; pointer-events: auto; }
    button { border: 1px solid var(--line); border-radius: 999px; padding: 8px 11px; color: var(--ink); background: rgba(8,15,27,.72); font: inherit; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    button:active { transform: translateY(1px); }
    #loadError { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: #090e1a; color: #ffb8a8; text-align: center; }
    @media (max-width: 520px) { #hint { bottom: 118px; } #actions { top: 56px; } }
  </style>
</head>
<body>
  <main id="shell">
    <canvas id="scene" aria-label="GGRacer acceptance demo chase camera"></canvas>
    <div id="vignette"></div>
    <section id="hud" aria-live="polite">
      <div class="row topline">
        <div class="row"><span id="brand" class="chip">GGRACER / ACCEPTANCE</span><span id="theme" class="chip">DESERT</span></div>
        <span id="sector" class="chip">SECTOR 1 / SHOWCASE</span>
      </div>
      <div id="actions"><button id="themeButton" type="button">Night city</button><button id="settingsButton" type="button">Settings</button><button id="restartButton" type="button">Restart</button></div>
      <div id="speed">000<small>KM/H · AUTO SHOWCASE</small></div>
      <canvas id="minimap" width="248" height="184" aria-label="Track minimap"></canvas>
      <div id="hint">ARROWS / A-D steer · SPACE boost · touch left/right</div>
    </section>
  </main>
  <script type="importmap">{"imports":{"three":"/play/_shared/three/three.module.min.js"}}</script>
  <script src="/play/_shared/ggkit.js"></script>
  <script type="module" src="./demo.js"></script>
</body>
</html>
