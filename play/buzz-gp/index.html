<!doctype html>
<html lang="en">
<head>
  <base href="/play/buzz-gp/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#102d32">
  <meta name="description" content="Buzz Grand Prix, an original backyard insect mascot kart racer.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Buzz Grand Prix</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      color-scheme: dark;
      --ink: #102d32;
      --cream: #fff5d6;
      --honey: #ffca3a;
      --mint: #9be28f;
      --coral: #f46e5f;
      --violet: #8a72e8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
    body { font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #shell { position: fixed; inset: 0; overflow: hidden; background: #102d32; }
    #scene, #hud, #fallback { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #scene { touch-action: none; }
    #hud, #fallback { pointer-events: none; }
    #fallback { background: linear-gradient(#77d8d5 0%, #d6f29a 56%, #6bb85c 57%, #376f49 100%); }
    #menu, #pause-card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(24px + var(--safe-top)) calc(24px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(24px + var(--safe-left)); }
    #menu { pointer-events: auto; }
    #pause-card { display: none; pointer-events: auto; background: rgba(8, 27, 30, .52); }
    .panel { width: min(720px, 92vw); max-height: 92vh; overflow: auto; padding: 22px; border: 2px solid rgba(255,245,214,.34); border-radius: 24px; background: linear-gradient(145deg, rgba(16,45,50,.94), rgba(27,63,54,.95)); box-shadow: 0 16px 50px rgba(5,17,20,.35); color: var(--cream); }
    .eyebrow { margin: 0 0 6px; color: var(--honey); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--cream); font-size: clamp(32px, 8vw, 66px); line-height: .9; letter-spacing: -.06em; }
    h2 { margin: 0; font-size: 22px; }
    .tagline { max-width: 440px; margin: 12px 0 18px; color: #d4f6d0; font-size: 15px; line-height: 1.35; }
    .menu-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button, select { min-height: 46px; border: 1px solid rgba(255,245,214,.28); border-radius: 14px; padding: 10px 14px; color: var(--cream); background: rgba(255,255,255,.1); font: inherit; font-weight: 800; cursor: pointer; }
    button.primary { color: #153133; background: var(--honey); border-color: #ffe9a4; }
    button.secondary { background: rgba(155,226,143,.16); border-color: rgba(155,226,143,.45); }
    button:disabled { opacity: .45; cursor: default; }
    .selectors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .selectors label { display: grid; gap: 6px; color: #a9d8c2; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    select { width: 100%; background: #183c3e; }
    .small { color: #a9d8c2; font-size: 13px; line-height: 1.4; }
    .roster { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; margin-top: 14px; }
    .racer-chip { min-height: 66px; padding: 8px; border-radius: 12px; background: rgba(0,0,0,.14); border: 1px solid rgba(255,245,214,.1); }
    .racer-chip strong { display: block; font-size: 12px; }
    .racer-chip span { display: block; margin-top: 4px; color: #9ed0b9; font-size: 10px; }
    .swatch { width: 18px; height: 18px; margin-bottom: 4px; border-radius: 50%; box-shadow: inset -4px -3px 0 rgba(0,0,0,.18); }
    #pause-card .panel { max-width: 360px; text-align: center; }
    #coach { position: absolute; z-index: 6; top: calc(10px + var(--safe-top)); left: 50%; width: min(94vw, 560px); transform: translateX(-50%); padding: 8px 12px; border-radius: 9px; color: #173437; background: rgba(255,245,214,.88); font-size: 14px; font-weight: 800; text-align: center; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
    #coach.visible { opacity: .92; }
    .touch { position: absolute; z-index: 5; bottom: calc(18px + var(--safe-bottom)); width: 64px; height: 64px; border: 2px solid rgba(255,245,214,.58); border-radius: 22px; color: var(--cream); background: rgba(16,45,50,.46); font-size: 27px; font-weight: 900; pointer-events: auto; opacity: .7; }
    #touch-left { left: calc(18px + var(--safe-left)); }
    #touch-right { left: calc(92px + var(--safe-left)); }
    #touch-hop { right: calc(92px + var(--safe-right)); color: #173437; background: rgba(255,202,58,.76); }
    #touch-item { right: calc(18px + var(--safe-right)); color: #173437; background: rgba(155,226,143,.78); }
    @media (min-width: 700px) { .touch { opacity: .32; } .touch:active { opacity: .9; } }
    @media (max-width: 520px) { .selectors { grid-template-columns: 1fr; } .roster { grid-template-columns: repeat(2, minmax(0, 1fr)); } .panel { padding: 18px; } }
  </style>
</head>
<body>
  <main id="shell" aria-label="Buzz Grand Prix">
    <canvas id="fallback" aria-hidden="true"></canvas>
    <canvas id="scene" aria-label="Buzz Grand Prix 3D race view"></canvas>
    <canvas id="hud" aria-hidden="true"></canvas>
    <div id="coach" role="status"></div>
    <button class="touch" id="touch-left" aria-label="Steer left">◀</button>
    <button class="touch" id="touch-right" aria-label="Steer right">▶</button>
    <button class="touch" id="touch-hop" aria-label="Hop and drift">↟</button>
    <button class="touch" id="touch-item" aria-label="Use item">✦</button>
    <section id="menu" aria-label="Main menu">
      <div class="panel">
        <p class="eyebrow">GreenGuard backyard circuit</p>
        <h1>BUZZ<br>GRAND PRIX</h1>
        <p class="tagline">Garden insect mascots. Leaf-and-tin karts. Big backyard worlds. Hop into a drift, bank two spark tiers, and make the shortcut count.</p>
        <div class="selectors">
          <label>Mode<select id="mode-select"><option value="grand-prix">Grand Prix</option><option value="time-trial">Time Trial</option><option value="battle">Balloon Battle</option></select></label>
          <label>Cup<select id="cup-select"><option value="0">Sprout Cup</option><option value="1">Backyard Cup</option><option value="2">Moonlit Cup</option></select></label>
          <label>Class<select id="cc-select"><option value="50">50cc</option><option value="100">100cc</option><option value="150">150cc</option></select></label>
        </div>
        <div class="menu-row">
          <button class="primary" id="start-button">Start race</button>
          <button class="secondary" id="garage-button">Racers and skins</button>
          <button class="secondary" id="settings-button">Settings</button>
        </div>
        <div id="garage" hidden></div>
        <p class="small" id="save-summary"></p>
        <div class="roster" id="roster"></div>
      </div>
    </section>
    <section id="pause-card" aria-label="Pause menu">
      <div class="panel">
        <p class="eyebrow">Race paused</p>
        <h2>Catch your breath</h2>
        <p class="small">The garden waits. Your position is safe.</p>
        <div class="menu-row"><button class="primary" id="resume-button">Resume</button><button class="secondary" id="quit-button">Quit to menu</button></div>
      </div>
    </section>
  </main>
  <script type="importmap">
  {"imports":{"three":"/play/_shared/three/three.module.min.js"}}
  </script>
  <script src="/play/_shared/ggkit.js"></script>
  <script type="module" src="./game.js"></script>
</body>
</html>
