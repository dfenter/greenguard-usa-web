<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#04070f">
<meta name="description" content="Serpentine - a portrait light-cycle arena survival run. Five authored arenas, timed gates, speed pads and a closing storm.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="/play/serpentine/">
<title>Serpentine</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" sizes="48x48" type="image/png">
<link rel="icon" href="icon.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #04070f; color: #eafaff;
    font-family: "Trebuchet MS", Verdana, system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }
  /* The canvas fills the viewport edge to edge. Safe-area insets are read
     back in JS (readSafeArea) and applied to the HUD in game space, so the
     board is never hidden under a notch and pointer coordinates stay in the
     same space GGKit reports them in. */
</style>
</head>
<body>
<script src="/play/_shared/phaser.min.js"></script>
<script src="/play/_shared/ggkit.js"></script>
<script src="sp_data.js"></script>
<script src="game.js"></script>
</body>
</html>
