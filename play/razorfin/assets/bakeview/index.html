<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#3f8fa8}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/play/_shared/three/three.module.min.js" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '/play/_shared/three/GLTFLoader.js';
const name = new URLSearchParams(location.search).get('m');
const r = new THREE.WebGLRenderer({antialias:true}); r.setPixelRatio(1); r.setSize(844,390); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3f8fa8);
const cam = new THREE.PerspectiveCamera(35, 844/390, 0.01, 100);
scene.add(new THREE.HemisphereLight(0xbfe8ff, 0x1a3a4a, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 4, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fe0ff, 0.8); rim.position.set(-3, 1, -2); scene.add(rim);
new GLTFLoader().load('/play/razorfin/assets/bakeview/' + name + '.glb', (g) => {
  const root = g.scene; scene.add(root);
  const box = new THREE.Box3().setFromObject(root); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
  root.position.sub(c);
  // Export contract: nose at +Y, dorsal +Z, length 1.0 (glTF Y-up puts that
  // at nose -Z, dorsal +Y). Show it broadside: nose to screen -X.
  root.rotation.y = -Math.PI / 2;
  const L = Math.max(size.x, size.y, size.z);
  cam.position.set(0, L * 0.18, L * 1.55); cam.lookAt(0, 0, 0);
  let tris = 0; root.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  window.__info = { tris, size: size.toArray() };
  r.render(scene, cam); window.__done = true;
}, undefined, (e) => { window.__err = String(e); window.__done = true; });
</script></body></html>
