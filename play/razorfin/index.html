<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/play/razorfin/">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02101c">
<meta name="description" content="Razorfin is a landscape ocean action game. Swim, eat, grow, and unlock a roster of 61 sharks from reef pup to kaiju legend. Free, no ads, no purchases.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<title>Razorfin</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #e8f5f4;
    --dim: #8fb4c4;
    --deep: #02101c;
    --panel: rgba(10, 34, 51, .82);
    --panel-hi: rgba(18, 52, 73, .92);
    --line: rgba(88, 176, 214, .28);
    --line-hi: rgba(120, 226, 255, .58);
    --gold: #ffd67a;
    --good: #7fe3b0;
    --bad: #ff8b7a;
    /* 6.9 synthwave accents. amber (--gold) stays reserved for frenzy/reward,
       red (--bad) stays reserved for damage; cyan/magenta/acid are the
       neutral neon accent trio for chrome (borders, glows, scanlines). */
    --neon-cyan: #27e0ff;
    --neon-magenta: #ff2bd6;
    --neon-acid: #9dff2b;
    --font: Avenir Next, Trebuchet MS, system-ui, sans-serif;
    --pad-t: env(safe-area-inset-top);
    --pad-r: env(safe-area-inset-right);
    --pad-b: env(safe-area-inset-bottom);
    --pad-l: env(safe-area-inset-left);
  }
  /* Thin repeating-gradient scanline texture reused on HUD/menu panels. Kept
     as a single background layer (no extra draws, CSS only). */
  .rf-scanlines {
    background-image: repeating-linear-gradient(0deg, rgba(157, 255, 43, .035) 0px,
      rgba(157, 255, 43, .035) 1px, transparent 1px, transparent 3px);
  }
  .rf-neon-border {
    border-image: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta)) 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--deep); }
  body {
    position: fixed; inset: 0; color: var(--ink); font-family: var(--font);
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* Game canvas fills the viewport; ui3d overlays sit above it. */
  #game-root { position: absolute; inset: 0; display: block; touch-action: none; }
  #game-root canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* --------------------------------------------------------- overlays */
  .rf-screen { position: absolute; inset: 0; display: none; z-index: 20; }
  .rf-screen.rf-on { display: flex; }

  /* Out-of-run screens get a readable scrim over the live water, with a
     faint acid scanline texture (6.9 synthwave restyle, CSS only). */
  #rfMenu, #rfShop, #rfResults {
    flex-direction: column;
    padding: calc(var(--pad-t) + 12px) calc(var(--pad-r) + 14px)
             calc(var(--pad-b) + 12px) calc(var(--pad-l) + 14px);
    background: linear-gradient(180deg, rgba(2, 14, 26, .82), rgba(1, 8, 16, .94)),
      repeating-linear-gradient(0deg, rgba(157, 255, 43, .03) 0px, rgba(157, 255, 43, .03) 1px,
        transparent 1px, transparent 3px);
    overflow: hidden;
  }

  .rf-bar-top {
    display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
    padding-bottom: 10px; border-bottom: 1px solid var(--line);
    border-image: linear-gradient(90deg, rgba(39, 224, 255, .5), rgba(255, 43, 214, .38)) 1;
  }
  .rf-title {
    margin: 0; font-size: clamp(22px, 4.4vw, 40px); font-weight: 900;
    letter-spacing: .18em; color: #dffcff;
    text-shadow: 0 0 18px rgba(39, 224, 255, .55), 0 0 34px rgba(255, 43, 214, .28);
  }
  .rf-spacer { flex: 1 1 auto; }
  .rf-stat { display: flex; align-items: baseline; gap: 6px; font-size: 15px; }
  .rf-stat b { color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
  .rf-stat span { color: var(--dim); font-size: 14px; letter-spacing: .08em; }

  .rf-scroll {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 2px 8px;
  }
  .rf-bar-bottom {
    display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
    padding-top: 10px; border-top: 1px solid var(--line);
  }

  .rf-btn {
    min-height: 48px; min-width: 120px; padding: 12px 22px;
    border: 1px solid var(--line-hi); border-radius: 10px;
    background: rgba(17, 86, 99, .7); color: var(--ink);
    font-size: 15px; font-weight: 800; letter-spacing: .12em;
  }
  .rf-btn:active { background: rgba(34, 132, 152, .86); }
  .rf-btn:disabled { opacity: .38; }
  .rf-btn-ghost { background: rgba(10, 34, 51, .7); border-color: var(--line); }
  .rf-btn-go {
    background: linear-gradient(160deg, rgba(31, 143, 160, .9), rgba(12, 76, 95, .92));
    border-image: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta)) 1;
    box-shadow: 0 0 16px rgba(39, 224, 255, .22);
  }

  /* ------------------------------------------------------------ menu */
  #rfMenuXp { display: flex; flex-direction: column; gap: 4px; min-width: 132px; }
  .rf-meter { height: 8px; border: 1px solid var(--line); border-radius: 4px; background: rgba(207, 245, 255, .08); overflow: hidden; }
  .rf-meter > i { display: block; width: 0; height: 100%; background: linear-gradient(90deg, #73e6ff, #3f9fc4); transition: width .18s ease; }
  #rfMenuXpText, #rfResXpText { color: var(--dim); font-size: 14px; letter-spacing: .06em; }

  .rf-tier { margin-bottom: 18px; }
  .rf-tier-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .rf-tier-n { font-size: 16px; font-weight: 800; letter-spacing: .12em; color: #cdeef8; }
  .rf-tier-act { font-size: 14px; color: var(--dim); letter-spacing: .1em; }
  .rf-tier-lock { margin-left: auto; font-size: 14px; color: var(--gold); letter-spacing: .06em; }
  .rf-tier.rf-locked .rf-grid { opacity: .44; }

  .rf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .rf-card {
    display: flex; flex-direction: column; gap: 8px; align-items: stretch;
    min-height: 148px; padding: 10px; text-align: left;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  }
  .rf-card:active { background: var(--panel-hi); }
  .rf-card-sel {
    border-color: var(--line-hi);
    background: linear-gradient(160deg, rgba(23, 103, 119, .78), rgba(6, 40, 53, .84));
    box-shadow: 0 0 22px rgba(67, 218, 225, .18) inset;
    border-image: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta)) 1;
  }
  .rf-card-locked { opacity: .5; }
  .rf-card-unowned .rf-card-name { color: var(--dim); }

  .rf-thumb {
    display: flex; align-items: center; justify-content: center;
    height: 74px; border-radius: 8px; border: 1px solid var(--line);
    /* contain, not cover: the baked 3D thumb must never crop the shark;
       background color matches the bake scene backdrop so letterboxing
       is invisible. */
    background-size: contain; background-repeat: no-repeat; background-position: center;
    background-color: #082036;
  }
  .rf-mono-text { font-size: 26px; font-weight: 900; letter-spacing: .06em; text-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .rf-card-name { font-size: 14px; font-weight: 800; line-height: 1.2; color: var(--ink); }
  .rf-card-foot { margin-top: auto; font-size: 14px; }
  .rf-card-cost { color: var(--gold); }
  .rf-card-own { color: var(--good); }
  .rf-card-lock { color: var(--dim); }

  #rfMenuSel { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
  #rfMenuSelName { font-size: 16px; font-weight: 800; letter-spacing: .06em; }
  #rfMenuSelBlurb { font-size: 14px; color: var(--dim); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ------------------------------------------------------------ shop */
  .rf-shop-act { margin-bottom: 20px; }
  .rf-shop-act-h { margin: 0 0 10px; font-size: 16px; font-weight: 800; letter-spacing: .16em; color: #cdeef8; }
  .rf-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 7px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-height: 60px;
  }
  .rf-row-locked { opacity: .52; }
  .rf-row-active { border-color: var(--line-hi); background: var(--panel-hi); }
  .rf-badge {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 8px; font-size: 14px; font-weight: 900;
  }
  .rf-row-mid { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .rf-row-name { font-size: 15px; font-weight: 800; letter-spacing: .04em; }
  /* Stat bars sit in one row so a shop entry stays compact on a 390px screen. */
  .rf-bars { display: flex; flex-direction: row; gap: 10px; flex-wrap: wrap; }
  .rf-bar { display: flex; align-items: center; gap: 5px; flex: 1 1 96px; min-width: 88px; }
  .rf-bar-l { flex: 0 0 auto; font-size: 14px; color: var(--dim); letter-spacing: .04em; }
  .rf-bar-t { flex: 1 1 auto; height: 6px; border-radius: 3px; background: rgba(207, 245, 255, .1); overflow: hidden; }
  .rf-bar-f { display: block; width: 0; height: 100%; }
  .rf-row-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .rf-chip-active, .rf-chip-passive {
    padding: 2px 7px; border-radius: 5px; font-size: 14px; letter-spacing: .03em;
  }
  .rf-chip-active { background: rgba(255, 214, 122, .16); color: var(--gold); }
  .rf-chip-passive { background: rgba(143, 180, 196, .14); color: var(--dim); }

  .rf-buy {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-width: 96px; min-height: 48px; padding: 8px 12px;
    border: 1px solid var(--line-hi); border-radius: 9px; background: rgba(17, 86, 99, .74);
    font-size: 14px; font-weight: 800; letter-spacing: .1em;
  }
  .rf-buy:active { background: rgba(34, 132, 152, .88); }
  .rf-buy:disabled { opacity: .5; }
  .rf-buy-locked { border-color: var(--line); background: rgba(10, 34, 51, .7); color: var(--dim); }
  .rf-buy-inuse { border-color: rgba(127, 227, 176, .6); background: rgba(20, 74, 62, .7); color: var(--good); }
  .rf-price { font-size: 14px; font-weight: 700; color: var(--gold); letter-spacing: .02em; }

  #rfShopFoot { display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-width: 0; }
  #rfShopUpName { font-size: 14px; color: var(--dim); letter-spacing: .1em; }
  #rfShopUp { display: flex; gap: 8px; align-items: stretch; }
  .rf-up {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    min-height: 56px; padding: 6px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--panel);
  }
  .rf-up:active { background: var(--panel-hi); }
  .rf-up-max { opacity: .6; }
  .rf-up-l { font-size: 14px; font-weight: 800; letter-spacing: .06em; }
  .rf-pips { display: flex; gap: 4px; }
  .rf-pip { width: 10px; height: 10px; border-radius: 2px; background: rgba(88, 176, 214, .28); }
  .rf-pip-on { background: var(--gold); }
  .rf-up-c { font-size: 14px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .rf-up-empty { flex: 1 1 auto; padding: 12px; font-size: 14px; color: var(--dim); }

  #rfShopToast {
    position: absolute; left: 50%; bottom: calc(var(--pad-b) + 132px); transform: translateX(-50%);
    max-width: 76vw; padding: 8px 14px; border-radius: 8px;
    border: 1px solid rgba(255, 139, 122, .5); background: rgba(38, 16, 14, .92);
    color: #ffcfc6; font-size: 14px; letter-spacing: .04em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    opacity: 0; pointer-events: none; transition: opacity .16s ease; z-index: 30;
  }
  #rfShopToast.rf-on { opacity: 1; }

  /* --------------------------------------------------------- results */
  #rfResults { align-items: center; justify-content: center; }
  /* Column layout: the detail block scrolls, the action row stays pinned, so
     AGAIN is reachable without scrolling even with three unlock callouts. */
  #rfResPanel {
    display: flex; flex-direction: column; min-height: 0;
    width: min(560px, 94vw); max-height: 100%; overflow: hidden; padding: 14px 20px;
    border: 1px solid var(--line-hi); border-radius: 14px;
    background: linear-gradient(150deg, rgba(3, 22, 37, .96), rgba(2, 10, 20, .96));
    box-shadow: 0 0 60px rgba(24, 155, 193, .16);
  }
  #rfResHead { flex: 0 0 auto; }
  #rfResScroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .rf-eyebrow { font-size: 14px; letter-spacing: .24em; color: #71e9ed; }
  #rfResScore { margin: 2px 0 2px; font-size: clamp(26px, 4.6vw, 40px); font-weight: 900; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  #rfResBest { font-size: 15px; color: var(--dim); letter-spacing: .1em; }
  #rfResBest.rf-newbest { color: var(--gold); font-weight: 900; }
  #rfResRows { margin: 10px 0; display: flex; flex-direction: column; gap: 3px; }
  .rf-res-row { display: flex; align-items: baseline; gap: 10px; padding-bottom: 4px; border-bottom: 1px solid rgba(88, 176, 214, .16); }
  .rf-res-l { flex: 1 1 auto; font-size: 15px; color: var(--dim); }
  .rf-res-v { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .rf-res-bonus .rf-res-v, .rf-res-bonus .rf-res-l { color: var(--gold); }
  #rfResLevel { font-size: 15px; font-weight: 800; letter-spacing: .08em; margin-bottom: 4px; }
  #rfResLevel.rf-levelup { color: var(--gold); text-shadow: 0 0 16px rgba(255, 214, 122, .5); }
  #rfResUnlocks { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .rf-unlock { padding: 5px 10px; border-left: 2px solid var(--gold); background: rgba(255, 214, 122, .1); color: #ffe6b3; font-size: 14px; line-height: 1.3; }
  #rfResActions { flex: 0 0 auto; display: flex; gap: 9px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(88, 176, 214, .2); }
  #rfResActions .rf-btn { flex: 1 1 0; min-width: 0; padding: 12px 8px; }

  /* -------------------------------------------------------------- HUD */
  /* SCREEN BALANCE LAW (6.9, amended 6.11 + code review MAJOR 5): in-run HUD
     is hp/HUNGER, score+combo, boost meter, power button, minimap ONLY.
     name/coins/DEV are OUT of the in-run cluster (menu/results only for
     name+coins; DEV becomes a corner tag, see #rfDevTag below). Everything
     else (chips, streak text, popups) routes through the ONE queued #rfChip
     toast slot. One top-left cluster (UI_LAW rule 4). Non-interactive except
     the power button, so taps fall through to the game surface everywhere
     else. */
  #rfHud { pointer-events: none; }
  #rfHudCluster {
    position: absolute;
    top: calc(var(--pad-t) + 10px); left: calc(var(--pad-l) + 12px);
    display: flex; flex-direction: column; gap: 5px;
    min-width: 168px; max-width: 46vw; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 10px;
    background: linear-gradient(135deg, rgba(3, 17, 29, .76), rgba(3, 10, 20, .44));
    backdrop-filter: blur(5px);
    /* 6.9 synthwave restyle: thin neon gradient border + faint scanline
       texture. Structure/ids unchanged (UI selftest is DOM-structural). */
    border-image: linear-gradient(135deg, rgba(39, 224, 255, .5), rgba(255, 43, 214, .32)) 1;
    background-image: linear-gradient(135deg, rgba(3, 17, 29, .76), rgba(3, 10, 20, .44)),
      repeating-linear-gradient(0deg, rgba(157, 255, 43, .04) 0px, rgba(157, 255, 43, .04) 1px,
        transparent 1px, transparent 3px);
  }
  /* Score + combo: persistent (not a transient chip), compact, tabular
     numerals so the digits do not jitter width every frame. */
  #rfHudTop { display: flex; align-items: baseline; gap: 8px; }
  #rfHudScoreWrap { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
  #rfHudScore {
    font-size: 16px; font-weight: 900; letter-spacing: .04em; color: #dffcff;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 10px rgba(39, 224, 255, .35);
  }
  #rfHudCombo {
    font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--neon-magenta);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #rfHudCombo:empty { display: none; }
  #rfHudHungerLabel {
    font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--dim);
    text-transform: uppercase;
  }
  .rf-hud-meter { height: 7px; border-radius: 4px; background: rgba(207, 245, 255, .1); overflow: hidden; }
  .rf-hud-meter > i { display: block; width: 0; height: 100%; transition: width .1s linear; }
  /* Retint so the bar reads as HUNGER draining (full = fed, empty = starving)
     rather than a generic green health bar: acid-green fed state fading
     through amber toward the same red-when-low damage language as before
     (RED stays reserved for the player being hurt, per the visual grammar
     law -- rf-low is still the only red state). */
  #rfHudHp { background: linear-gradient(90deg, var(--neon-acid), #7fe3b0); }
  #rfHudHp.rf-low { background: linear-gradient(90deg, #ff8b7a, #d8483a); }
  #rfHudBoost { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta)); }

  /* Fix-round 3 HUD ONLY-LAW: DEV is no longer in-run chrome at all. It is a
     small menu-bar chip (rf-bar-top, alongside coins/level) shown only while
     RF.DevMode is active; the in-run run-start toast is the only other place
     dev state surfaces. */
  #rfDevChip {
    display: none; padding: 2px 7px; border-radius: 6px;
    border: 1px solid rgba(255, 139, 122, .55); background: rgba(46, 18, 16, .82);
    color: #ffb3a6; font-size: 12px; font-weight: 800; letter-spacing: .12em;
    flex: 0 0 auto;
  }
  #rfDevChip.rf-on { display: inline-block; }

  /* Power button: bottom-right, clear of the left thumb, >= 44px. art
     MAJOR 6: a faint scanline texture ties it to the same synthwave chrome
     language as the HUD cluster/menu panels (restrained -- a single low-
     alpha background layer, no extra draws). */
  #rfPower {
    position: absolute; pointer-events: auto;
    right: calc(var(--pad-r) + 16px); bottom: calc(var(--pad-b) + 18px);
    width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--line); background: rgba(5, 28, 43, .8);
    background-image: repeating-linear-gradient(0deg, rgba(157, 255, 43, .05) 0px,
      rgba(157, 255, 43, .05) 1px, transparent 1px, transparent 3px);
    overflow: visible; touch-action: none;
  }
  #rfPower.rf-hide { display: none; }
  /* art MAJOR 6 (synthwave UI pass): the ready state was a static glow.
     Animate it as a slow cyan/magenta breathing pulse so a ready power
     reads as alive chrome, not just a color change -- still restrained
     (long period, modest amplitude) so it never competes with gameplay. */
  #rfPower.rf-ready { border-color: var(--neon-cyan); animation: rf-power-ready 1.8s ease-in-out infinite; }
  @keyframes rf-power-ready {
    0%, 100% { box-shadow: 0 0 18px rgba(39, 224, 255, .38); }
    50% { box-shadow: 0 0 30px rgba(255, 43, 214, .42); }
  }
  /* 6.7: disabled state at 0 charges reads visually inert, distinct from the
     merely-not-ready look. */
  #rfPower.rf-power-empty { opacity: .42; box-shadow: none; animation: none; }
  /* Active-buff ticks live INSIDE the power cluster (6.12 HUD only-law:
     buff feedback = power button chrome + toast). One 4px bar per active
     buff, width = remaining fraction. */
  #rfPowerBuffs {
    position: absolute; left: 10%; right: 10%; bottom: -12px;
    display: flex; flex-direction: column; gap: 2px; pointer-events: none;
  }
  #rfPowerBuffs i {
    display: block; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
    box-shadow: 0 0 6px rgba(39, 224, 255, .5);
    transform-origin: left center;
  }
  #rfPowerFill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: rgba(39, 224, 255, .24); transition: height .12s linear;
    border-radius: inherit; overflow: hidden;
  }
  #rfPowerLabel {
    position: relative; padding: 0 8px; text-align: center; line-height: 1.15;
    font-size: 14px; font-weight: 800; letter-spacing: .04em;
  }
  #rfPower:active { background: rgba(27, 117, 141, .84); }

  /* 6.7 power charge pips: a small ring of up to 8 dots around the button. */
  #rfPowerPips {
    position: absolute; inset: -9px; display: none;
    pointer-events: none; list-style: none; padding: 0; margin: 0;
  }
  #rfPowerPips.rf-on { display: block; }
  .rf-power-pip {
    position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; border-radius: 50%;
    background: rgba(157, 255, 43, .22);
    /* 8 pips spaced evenly around the ring; each pip's own rotation is set
       inline via nth-child so no JS-computed inline transform is needed. */
    transform-origin: 2.5px 2.5px;
  }
  .rf-power-pip-on { background: var(--neon-acid); box-shadow: 0 0 5px rgba(157, 255, 43, .8); }
  #rfPowerPips .rf-power-pip:nth-child(1) { transform: rotate(0deg) translate(46px) rotate(0deg); }
  #rfPowerPips .rf-power-pip:nth-child(2) { transform: rotate(45deg) translate(46px) rotate(-45deg); }
  #rfPowerPips .rf-power-pip:nth-child(3) { transform: rotate(90deg) translate(46px) rotate(-90deg); }
  #rfPowerPips .rf-power-pip:nth-child(4) { transform: rotate(135deg) translate(46px) rotate(-135deg); }
  #rfPowerPips .rf-power-pip:nth-child(5) { transform: rotate(180deg) translate(46px) rotate(-180deg); }
  #rfPowerPips .rf-power-pip:nth-child(6) { transform: rotate(225deg) translate(46px) rotate(-225deg); }
  #rfPowerPips .rf-power-pip:nth-child(7) { transform: rotate(270deg) translate(46px) rotate(-270deg); }
  #rfPowerPips .rf-power-pip:nth-child(8) { transform: rotate(315deg) translate(46px) rotate(-315deg); }

  /* ONE queued toast slot (6.9 SCREEN BALANCE LAW): combo chips, frenzy
     announcements, TOO BIG, pickup/tier-up callouts. Single element, corner-
     anchored with safe-area margins, never stacked. Positioned clear of the
     HUD cluster and the power button/minimap. */
  #rfChip {
    position: absolute; left: calc(var(--pad-l) + 12px);
    top: calc(var(--pad-t) + 78px);
    max-width: min(60vw, 320px);
    height: 24px; padding: 0 10px; display: flex; align-items: center;
    border-radius: 12px; background: rgba(255, 214, 122, .18);
    color: var(--gold); font-size: 14px; font-weight: 900; letter-spacing: .06em;
    opacity: 0; transform: translateY(-4px);
    transition: opacity .12s ease, transform .12s ease;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #rfChip.rf-on { opacity: 1; transform: translateY(0); }
  /* Auto-fade the toast during a live frenzy cue so it never competes with
     the frenzy vignette (readability law: FX never obscures gameplay). */
  #rfChip.rf-chip-blood.rf-on, #rfChip.rf-chip-school.rf-on, #rfChip.rf-chip-golden.rf-on { opacity: .82; }

  /* 6.9 hologram materialize flicker, art MAJOR 4: applied to #rfChip by the
     caller (via RF.UI.queueToast(text, cue, {holo:true})) alongside a
     pickup/tier-up announcement, paired with fx3d's additive sparkle burst
     (RF.Fx.hologramFlash). CSS-only scanline + flicker + vertical reveal, no
     new draws:
       - a repeating-gradient scanline texture layered UNDER the toast's own
         background (::before, so the toast's text/background are untouched)
       - a clip-path vertical wipe from 0 to 100% height so the toast reads
         as materializing top-down rather than just fading in
       - the existing brightness/opacity flicker steps, unchanged timing so
         it still pairs with the fx3d sparkle burst's ~360ms life. */
  .rf-holo-flicker { position: relative; animation: rf-holo-flicker 420ms steps(6, end) 1; }
  .rf-holo-flicker::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; z-index: 1; mix-blend-mode: screen;
    background-image: repeating-linear-gradient(0deg, rgba(157, 255, 43, .4) 0px,
      rgba(157, 255, 43, .4) 1px, transparent 1px, transparent 3px);
    animation: rf-holo-scan 420ms steps(6, end) 1;
  }
  @keyframes rf-holo-flicker {
    0% { opacity: 0; filter: none; clip-path: inset(100% 0 0 0); }
    15% { opacity: 1; filter: brightness(1.6) saturate(1.3); clip-path: inset(55% 0 0 0); }
    30% { opacity: .4; clip-path: inset(30% 0 0 0); }
    45% { opacity: 1; filter: brightness(1.3); clip-path: inset(10% 0 0 0); }
    60% { opacity: .7; clip-path: inset(0 0 0 0); }
    100% { opacity: 1; filter: none; clip-path: inset(0 0 0 0); }
  }
  @keyframes rf-holo-scan {
    0% { opacity: 0; }
    15% { opacity: .9; }
    30% { opacity: .3; }
    45% { opacity: .8; }
    60% { opacity: .2; }
    100% { opacity: 0; }
  }

  /* Fix-round 3 HUD ONLY-LAW: the persistent buff-bar row is retired. Buff
     feedback is power-button pips (#rfPowerPips) + a toast on pickup/expiry
     only; #rfBuffTimers/.rf-buff-bar CSS is intentionally removed. */

  /* 6.4 minimap: bottom-left corner, clear of the power button (bottom-
     right) and the HUD cluster (top-left). Drawn once at init from World
     data; hidden entirely if RF.World does not expose enough to sample. */
  #rfMinimapWrap {
    position: absolute;
    left: calc(var(--pad-l) + 12px); bottom: calc(var(--pad-b) + 14px);
    width: 200px; height: 88px; display: none;
    border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(39, 224, 255, .4);
    box-shadow: 0 0 14px rgba(39, 224, 255, .14);
    background: rgba(2, 10, 18, .55);
  }
  #rfMinimapWrap.rf-on { display: block; }
  #rfMinimap { display: block; width: 100%; height: 100%; }
  #rfMinimapDot {
    position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    border-radius: 50%; background: var(--neon-magenta);
    box-shadow: 0 0 6px 2px rgba(255, 43, 214, .7);
    display: none;
  }
  #rfMinimapDot.rf-on { display: block; }

  /* Tutorial: art MAJOR 2 fix -- the old single-line strip (nowrap +
     ellipsis + a fixed 30px height) visibly clipped the coach line at
     844x390. Wrap up to two lines instead: a wider safe-area panel, no
     nowrap, height sized for two lines of 14px copy plus padding, and the
     text itself center-aligned so a short line does not look lopsided. */
  #rfTutorial {
    position: absolute; left: 50%; top: calc(var(--pad-t) + 10px); transform: translateX(-50%);
    width: min(74vw, 460px); max-width: calc(100vw - var(--pad-l) - var(--pad-r) - 24px);
    min-height: 30px; padding: 6px 16px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    border-radius: 7px; background: rgba(2, 13, 24, .58);
    color: #b7dbe7; font-size: 14px; line-height: 1.3; letter-spacing: .02em;
    white-space: normal; overflow: visible; word-break: normal; overflow-wrap: break-word;
    opacity: 0; transition: opacity .2s ease;
  }
  #rfTutorial.rf-on { animation: rf-tut 3.2s ease forwards; }
  @keyframes rf-tut { 0%, 20% { opacity: .9; } 74% { opacity: .28; } 100% { opacity: 0; } }

  @media (max-width: 560px) {
    .rf-grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
    .rf-card { min-height: 136px; }
    .rf-thumb { height: 64px; }
    #rfPower { width: 74px; height: 74px; }
    #rfHudCluster { min-width: 150px; }
  }
  /* Landscape phones: height is the scarce axis (the 560px rule keys on
     width and never fires at 844x390). Keep 44px touch targets; goal is
     two full card rows visible in the roster scroll at 390px height. */
  @media (orientation: landscape) and (max-height: 480px) {
    #rfMenu, #rfShop, #rfResults {
      padding: calc(var(--pad-t) + 6px) calc(var(--pad-r) + 10px)
               calc(var(--pad-b) + 6px) calc(var(--pad-l) + 10px);
    }
    .rf-bar-top { padding-bottom: 5px; gap: 8px; }
    .rf-title { font-size: 17px; letter-spacing: .12em; }
    #rfMenuXp { min-width: 110px; }
    #rfMenuXpText { display: none; }
    .rf-scroll { padding: 8px 2px 6px; }
    .rf-bar-bottom { padding-top: 5px; gap: 8px; }
    .rf-btn { min-height: 44px; min-width: 96px; padding: 8px 14px; }
    #rfMenuSelBlurb { display: none; }
    .rf-tier { margin-bottom: 8px; }
    .rf-tier-head { margin-bottom: 4px; }
    .rf-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
    .rf-card { min-height: 104px; padding: 7px; gap: 5px; }
    .rf-thumb { height: 44px; }
    .rf-card-name { font-size: 13px; }
    .rf-shop-act { margin-bottom: 10px; }
    .rf-row { min-height: 52px; padding: 6px 8px; }

    /* HUD chrome at the shortest heights: keep the 44px power button touch
       target and shrink the minimap so nothing crowds the bottom safe area. */
    #rfHudCluster { padding: 6px 8px; gap: 3px; }
    #rfPower { width: 60px; height: 60px; right: calc(var(--pad-r) + 10px); bottom: calc(var(--pad-b) + 10px); }
    #rfPowerLabel { font-size: 12px; }
    #rfMinimapWrap { width: 132px; height: 58px; left: calc(var(--pad-l) + 8px); bottom: calc(var(--pad-b) + 8px); }
    #rfChip { top: calc(var(--pad-t) + 62px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    #rfTutorial.rf-on { animation: none; opacity: .8; }
  }
</style>
</head>
<body>
<div id="game-root"></div>

<!-- ui3d.js owns everything below. Ids are the contract with ui3d.js. -->

<!-- MENU -->
<section id="rfMenu" class="rf-screen">
  <div class="rf-bar-top">
    <h1 class="rf-title">RAZORFIN</h1>
    <!-- HUD ONLY-LAW (fix-round 3): DEV is a menu chip only, never in-run
         chrome. ui3d.js toggles rf-on from RF.DevMode.state. -->
    <div id="rfDevChip">DEV</div>
    <div class="rf-spacer"></div>
    <div id="rfMenuXp">
      <div class="rf-stat"><b id="rfMenuLevel">Level 1</b></div>
      <div class="rf-meter"><i id="rfMenuXpFill"></i></div>
      <div id="rfMenuXpText">0 / 100 XP</div>
    </div>
    <div class="rf-stat"><b id="rfMenuCoins">0</b><span>COINS</span></div>
  </div>
  <div id="rfMenuRoster" class="rf-scroll"></div>
  <div class="rf-bar-bottom">
    <div id="rfMenuSel">
      <div id="rfMenuSelName">Reef Shark</div>
      <div id="rfMenuSelBlurb"></div>
    </div>
    <button id="rfMenuShop" class="rf-btn rf-btn-ghost" type="button">SHOP</button>
    <button id="rfDive" class="rf-btn rf-btn-go" type="button">DIVE</button>
  </div>
</section>

<!-- SHOP -->
<section id="rfShop" class="rf-screen">
  <div class="rf-bar-top">
    <h1 class="rf-title">SHOP</h1>
    <div class="rf-spacer"></div>
    <div class="rf-stat"><b id="rfShopCoins">0</b><span>COINS</span></div>
  </div>
  <div id="rfShopList" class="rf-scroll"></div>
  <div class="rf-bar-bottom">
    <div id="rfShopFoot">
      <div id="rfShopUpName">Upgrades</div>
      <div id="rfShopUp"></div>
    </div>
    <button id="rfShopBack" class="rf-btn rf-btn-ghost" type="button">BACK</button>
  </div>
  <div id="rfShopToast" role="status" aria-live="polite"></div>
</section>

<!-- RESULTS -->
<section id="rfResults" class="rf-screen">
  <div id="rfResPanel">
    <div id="rfResHead">
      <div class="rf-eyebrow">RUN COMPLETE</div>
      <div id="rfResScore">0</div>
      <div id="rfResBest">Best 0</div>
    </div>
    <div id="rfResScroll">
      <div id="rfResRows"></div>
      <div id="rfResLevel">Level 1</div>
      <div class="rf-meter"><i id="rfResXpFill"></i></div>
      <div id="rfResXpText">0 / 100 XP</div>
      <div id="rfResUnlocks"></div>
    </div>
    <div id="rfResActions">
      <button id="rfResMenu" class="rf-btn rf-btn-ghost" type="button">MENU</button>
      <button id="rfResShop" class="rf-btn rf-btn-ghost" type="button">SHOP</button>
      <button id="rfResAgain" class="rf-btn rf-btn-go" type="button">AGAIN</button>
    </div>
  </div>
</section>

<!-- HUD -->
<section id="rfHud" class="rf-screen">
  <div id="rfHudCluster">
    <!-- 6.11 + code review MAJOR 5: score+combo replace name/coins as the
         persistent top row (name/coins moved to menu/results only). -->
    <div id="rfHudTop">
      <div id="rfHudScoreWrap">
        <span id="rfHudScore">0</span>
        <span id="rfHudCombo"></span>
      </div>
    </div>
    <div id="rfHudHungerLabel">HUNGER</div>
    <div class="rf-hud-meter"><i id="rfHudHp"></i></div>
    <div class="rf-hud-meter"><i id="rfHudBoost"></i></div>
  </div>
  <!-- HUD ONLY-LAW (fix-round 3): DEV no longer renders in-run at all (moved
       to the menu chip above); the persistent buff-bar row is retired --
       buff feedback is the power-button pips below plus a toast on
       pickup/expiry. -->
  <button id="rfPower" class="rf-hide" type="button">
    <i id="rfPowerFill"></i>
    <span id="rfPowerLabel">POWER</span>
    <ul id="rfPowerPips" aria-hidden="true">
      <li class="rf-power-pip"></li><li class="rf-power-pip"></li>
      <li class="rf-power-pip"></li><li class="rf-power-pip"></li>
      <li class="rf-power-pip"></li><li class="rf-power-pip"></li>
      <li class="rf-power-pip"></li><li class="rf-power-pip"></li>
    </ul>
    <span id="rfPowerBuffs" aria-hidden="true"></span>
  </button>
  <div id="rfChip" role="status" aria-live="polite"></div>
  <!-- 6.4 minimap: hidden by default, shown by ui3d.js only when RF.World
       exposes enough data to draw it. -->
  <div id="rfMinimapWrap" aria-hidden="true">
    <canvas id="rfMinimap" width="200" height="88"></canvas>
    <div id="rfMinimapDot"></div>
  </div>
  <div id="rfTutorial"></div>
</section>

<script src="/play/_shared/ggkit.js"></script>
<script src="data.js"></script>
<script src="meta.js"></script>
<script src="abilities.js"></script>
<script src="sharkart.js"></script> <!-- 2D bake factory: canvases for 3D billboards (integration) -->
<script src="ui3d.js"></script>
<script type="importmap">
  { "imports": { "three": "/play/_shared/three/three.module.min.js" } }
</script>
<script type="module" src="fx3d.js"></script>
<script type="module" src="shark3d.js"></script>
<script type="module" src="fish3d.js"></script>
<script type="module" src="world3d.js"></script>
<script type="module" src="engine3d.js"></script>
</body>
</html>
