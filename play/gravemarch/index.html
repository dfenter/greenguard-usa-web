<!doctype html>
<html lang="en">
<head>
  <base href="/play/gravemarch/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <meta name="description" content="Gravemarch, an idle action RPG descent through thirty authored floors.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon512.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Gravemarch</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b14; }
    body { display: grid; place-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game { width: 100%; height: 100%; min-width: 0; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="game" aria-label="Gravemarch idle action RPG"></div>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
