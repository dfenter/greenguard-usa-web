<!doctype html>
<html lang="en">
<head>
  <base href="/play/starweft/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071421">
  <meta name="description" content="Starweft, an original top-down celestial thread exploration game.">
  <title>Starweft - Sky-Rail Tactics</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game-shell" aria-label="Starweft top-down celestial thread exploration game"></main>
  <section id="accessible-controls" aria-label="Starweft controls" data-scene="home">
    <h1>Starweft controls</h1>
    <p>Use the keyboard, a gamepad, or touch. The live status below describes the current route.</p>
    <button type="button" tabindex="0" aria-label="Move with arrow keys or WASD">Movement: arrows or WASD</button>
    <button type="button" tabindex="0" aria-label="Trace constellations with Enter or Space">Constellations: Enter or Space</button>
    <button type="button" tabindex="0" aria-label="Open the route atlas with M">Route atlas: M</button>
  </section>
  <div id="screen-reader" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="./game.js" defer></script>
</body>
</html>
