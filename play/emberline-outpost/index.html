<!DOCTYPE html>
<html lang="en">
<head><base href="/play/emberline-outpost/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1014">
<title>Emberline Outpost</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1014;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #wrap{position:fixed;inset:0;overflow:hidden;}
  canvas{position:absolute;left:0;top:0;display:block;touch-action:none;}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0d1014;color:#e8e2d4;text-align:center;padding:24px;z-index:10;}
  .ov h1{font-size:30px;letter-spacing:3px;margin-bottom:6px;color:#ffb454;font-weight:800;}
  .ov h2{font-size:13px;letter-spacing:2px;margin-bottom:26px;color:#7f8b96;font-weight:600;}
  .ov p{font-size:13px;line-height:1.7;color:#9aa6b2;max-width:320px;margin-bottom:26px;}
  .btn{min-width:200px;min-height:56px;padding:16px 28px;border:2px solid #ffb454;border-radius:10px;
    background:#1b222b;color:#ffb454;font-size:17px;font-weight:700;letter-spacing:2px;cursor:pointer;}
  .btn:active{background:#ffb454;color:#12161c;}
  #rot{display:none;z-index:20;}
  #rot .g{font-size:52px;margin-bottom:18px;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div class="ov" id="start">
  <h1>EMBERLINE OUTPOST</h1>
  <h2>GRID DEFENSE &middot; FACING MATTERS</h2>
  <p>Drag defenders onto tiles. The direction you flick sets their facing &mdash; and their firing footprint. Hold the line for eight maps.</p>
  <div class="btn" id="startBtn">BEGIN</div>
</div>

<div class="ov" id="rot">
  <div class="g">&#8635;</div>
  <h2>ROTATE TO PORTRAIT</h2>
  <p>Emberline Outpost is played upright. The outpost is paused.</p>
</div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
