<!DOCTYPE html>
<html lang="en">
<head><base href="/play/parlor-pop/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#171320">
<title>Parlor Pop</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#171320;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      flex-direction:column;background:#171320;color:#f2e9dc;text-align:center;
      padding:24px;box-sizing:border-box;z-index:9;}
  .ov.on{display:flex;}
  .ov h1{font-size:30px;margin:0 0 6px;letter-spacing:1px;}
  .ov p{font-size:15px;opacity:.8;margin:6px 0;max-width:300px;line-height:1.5;}
  .ov b{color:#ffcf5c;}
  #startBtn{margin-top:18px;min-width:200px;min-height:56px;font-size:19px;font-weight:700;
    border:0;border-radius:14px;background:#ffcf5c;color:#2a2018;cursor:pointer;}
  #rot .icon{font-size:44px;margin-bottom:10px;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="start" class="ov on">
  <h1>PARLOR POP</h1>
  <p>Swap tiles to match three. Clear the goals before the moves run out and restore a forgotten parlor.</p>
  <p><b>No lives. No timers. Nothing to buy.</b></p>
  <button id="startBtn">Tap to Play</button>
</div>

<div id="rot" class="ov">
  <div class="icon">&#8635;</div>
  <h1>Rotate</h1>
  <p>Parlor Pop is played in portrait. Turn your device upright to continue &mdash; the game is paused.</p>
</div>

<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="audio.js"></script>
<script src="meta.js"></script>
<script src="game.js"></script>
</body>
</html>
