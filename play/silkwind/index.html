<!doctype html>
<html lang="en">
<head>
  <base href="/play/silkwind/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070910">
  <meta name="description" content="Silkwind, an original wuxia duelling game of stances, parries and qi.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Silkwind</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070910;
      touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    #game {
      position: fixed; inset: 0; overflow: hidden; background: #070910;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <main id="game" aria-label="Silkwind wuxia duelling game"></main>
  <script>
    /* Boot fallback state. The scene keeps this exact object live, so headless
       probes read the same bridge before and after Phaser comes up. */
    window.__sw = window.__sw || {
      state: {
        ready: false, mode: 'menu', screen: 'boot', stage: 'bamboo-grove', stageIndex: 0,
        rung: 0, rungsCleared: 0, duellist: '', round: 1, roundsWon: 0, roundsLost: 0,
        hp: 100, hpMax: 100, enemyHp: 100, enemyHpMax: 100, breath: 40, stance: 'crane',
        score: 0, insight: 0, timer: 60, techniques: 0
      },
      forceMode: null, forceStage: null, forceWin: false
    };
  </script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
