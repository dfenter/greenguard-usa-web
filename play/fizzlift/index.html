<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0B0F16">
<meta name="description" content="Fizzlift - a match-3 vat where the fizz line splits gravity. Below it pieces float up, above it they fall. Surface every bottle cap and crack every valve seal.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The deployed no-slash URL (/play/fizzlift) resolves relative paths against
     /play/, so this base tag and the ABSOLUTE engine paths below are load
     bearing. Do not switch the engine tags back to ../_shared/. -->
<base href="/play/fizzlift/">
<title>Fizzlift</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
    background: #0B0F16; color: #E7EEF7;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* The canvas is full bleed. Safe-area insets are read by the game and used
     to place the HUD, the coach strip and the corner controls, so nothing
     informational can land under a notch, a home bar or a thumb. */
  #game { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<div id="game"></div>
<script src="/play/_shared/phaser.min.js"></script>
<script src="/play/_shared/ggkit.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/board.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
