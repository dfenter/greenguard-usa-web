<!doctype html>
<html lang="en">
<head><base href="/play/cube-cascade/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07121f">
  <title>Cube Cascade</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #07121f; font-family: Arial, Helvetica, sans-serif;
    }
    body { overscroll-behavior: none; }
    #game {
      position: fixed; inset: 0; width: 100vw; height: 100dvh;
      overflow: hidden; touch-action: none; user-select: none;
      -webkit-user-select: none; -webkit-touch-callout: none;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Cube Cascade isometric pyramid hopper">
    <canvas id="screen"></canvas>
    <div class="sr-only">Swipe diagonally or use diagonal arrow keys to hop between cubes. Light every cube to advance. Three lives.</div>
  </main>
  <script src="game.js"></script>
</body>
</html>
