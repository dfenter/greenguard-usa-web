<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#101728">
<meta name="description" content="Chroma Tap - a tap-blast puzzle. Collapse groups, build rockets, bombs and orbs, and clear the crates, balloons and gears before the moves run out.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="/play/chroma-tap/">
<title>Chroma Tap</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="icon" href="icon.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon.png">
<style>
  /* Platform system stack: the Puzzle Pop lane ships no font payload. */
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #101728; color: #F7FBFF;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Safe-area insets: the canvas never runs under a notch or a home bar. */
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<!-- Absolute /play/_shared/ paths: a relative ../_shared broke on the deployed
     no-slash URL, and <base> alone does not save a script that is loaded before
     the base is parsed. -->
<script src="/play/_shared/phaser.min.js"></script>
<script src="/play/_shared/ggkit.js"></script>
<script src="ct_data.js"></script>
<script src="ct_sim.js"></script>
<script src="ct_art.js"></script>
<script src="ct_game.js"></script>
</body>
</html>
