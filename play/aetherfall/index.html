<!doctype html>
<html lang="en">
<head><base href="/play/aetherfall/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#071018">
  <title>Aetherfall</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05080e; }
    body { display: grid; place-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #game-shell { position: relative; width: min(100vw, 390px); height: min(100vh, 700px); aspect-ratio: 390 / 700; }
    canvas { display: block; width: 100%; height: 100%; background: #071018; touch-action: none; image-rendering: auto; border: 1px solid #1b4051; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 4; place-items: center; text-align: center; padding: 32px; background: #061018; color: #d9fbff; letter-spacing: .08em; }
    @media (orientation: landscape) and (max-height: 520px) { #rotate { display: grid; } }
  </style>
</head>
<body>
  <div id="game-shell">
    <canvas id="game" aria-label="Aetherfall game"></canvas>
  </div>
  <div id="rotate">ROTATE TO PORTRAIT<br><span style="font-size:12px;color:#78a8b2">Aetherfall runs in a tall window.</span></div>
  <script src="game.js"></script>
</body>
</html>
