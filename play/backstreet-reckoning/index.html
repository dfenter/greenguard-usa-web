<!DOCTYPE html>
<html lang="en">
<head><base href="/play/backstreet-reckoning/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<title>Backstreet Reckoning</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0c12; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #c {
    display: block; width: 100vw; height: 100vh;
    touch-action: none; background: #0b0c12;
  }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(8,9,14,0.93); color: #ffe27a;
    align-items: center; justify-content: center; flex-direction: column;
    text-align: center; padding: 24px; font-weight: 700; letter-spacing: 0.04em;
  }
  #rotate .ph {
    width: 54px; height: 92px; border: 4px solid #ffe27a; border-radius: 10px;
    margin-bottom: 20px; animation: tip 1.6s ease-in-out infinite;
  }
  #rotate p { font-size: 20px; margin: 0; }
  #rotate small { color: #9aa3b2; font-size: 14px; display: block; margin-top: 10px; font-weight: 500; }
  @keyframes tip { 0%,40% { transform: rotate(0deg); } 70%,100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rotate"><div class="ph"></div><p>ROTATE YOUR PHONE</p><small>Backstreet Reckoning plays in landscape</small></div>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
