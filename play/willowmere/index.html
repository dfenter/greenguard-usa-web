<!DOCTYPE html>
<html lang="en">
<head><base href="/play/willowmere/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#16202a">
<title>Willowmere</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0e161d;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;background:#16202a;image-rendering:auto;}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;background:#0e161deb;color:#e8f0e4;text-align:center;padding:24px;
    box-sizing:border-box;z-index:10;}
  .ov.on{display:flex;}
  .ov h1{font-size:30px;margin:0 0 6px;letter-spacing:2px;color:#bfe3b0;font-weight:700;}
  .ov p{font-size:15px;line-height:1.5;margin:6px 0;color:#a9bcb2;max-width:320px;}
  .ov b{color:#ffd98a;}
  #startBtn{margin-top:18px;min-width:200px;min-height:56px;font-size:18px;font-weight:700;
    border:0;border-radius:14px;background:#63a86c;color:#0e161d;cursor:pointer;}
  #rot{z-index:20;}
  #rot .ic{font-size:48px;margin-bottom:10px;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="start" class="ov on">
  <h1>WILLOWMERE</h1>
  <p>A cozy lake town. Fish, forage, craft, and make six friends.</p>
  <p>Tap to walk. Tap things to use them. <b>WASD</b> + <b>E</b> also work.</p>
  <button id="startBtn">Begin</button>
</div>

<div id="rot" class="ov">
  <div class="ic">&#8635;</div>
  <h1>ROTATE</h1>
  <p>Willowmere is played in portrait. Turn your device upright.</p>
</div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
