<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/play/willowmere/">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="theme-color" content="#163b3c">
  <meta name="description" content="Willowmere is a cozy lakeside life sim about gathering, decorating, and becoming part of a village.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Willowmere</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#102c30; }
    body { position:fixed; inset:0; touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    #game { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    canvas { display:block; image-rendering:auto; touch-action:none; }
    body > div[style*="z-index:9000"] { background:radial-gradient(circle at 50% 36%,#244f4b 0,#102c30 52%,#071619 100%) !important; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif !important; }
    body > div[style*="z-index:9200"] { background:rgba(8,23,25,.97) !important; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif !important; }
    body > div[style*="z-index:9200"] button { min-height:48px !important; border-radius:12px !important; }
  </style>
</head>
<body>
  <main id="game" aria-label="Willowmere game"></main>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="js/willowmere.js"></script>
</body>
</html>
