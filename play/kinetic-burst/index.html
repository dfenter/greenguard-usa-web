<!DOCTYPE html>
<html lang="en">
<head><base href="/play/kinetic-burst/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kinetic Burst</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#07080c;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;}
  canvas{display:block;touch-action:none;background:#0b0d14;box-shadow:0 0 0 1px #1d2333;}
  #rot,#gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#07080c;color:#cfe3ff;z-index:10;text-align:center;flex-direction:column;gap:10px;}
  #rot.on,#gate.on{display:flex;}
  .big{font-size:22px;font-weight:700;letter-spacing:1px;}
  .sm{font-size:13px;color:#7f90ad;max-width:300px;line-height:1.5;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="rot"><div class="big">ROTATE TO PORTRAIT</div><div class="sm">Kinetic Burst is played upright. The match is paused.</div></div>
<div id="gate" class="on"><div class="big">KINETIC BURST</div><div class="sm">Trace orbs. Charge fighters. Win the crown.</div><div class="sm" style="color:#4ec9a8">TAP TO START</div></div>
<script src="./js/core.js"></script>
<script src="./js/data.js"></script>
<script src="./js/board.js"></script>
<script src="./js/game.js"></script>
</body>
</html>
