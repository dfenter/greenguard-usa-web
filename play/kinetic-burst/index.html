<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/play/kinetic-burst/">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141B2E">
  <meta name="description" content="Kinetic Burst is a trace-to-attack orb battler: chain ki orbs, charge three fighters, and take the Burst Road across thirty stages.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kinetic Burst</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon512.png">
  <style>
    :root {
      color-scheme: dark;
      background: #141B2E;
      /* read back by KBUI.insets() so every layout is safe-area aware */
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: #141B2E; touch-action: none; overscroll-behavior: none;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* pause and numbers overlays */
    .kb-overlay {
      position: fixed; inset: 0; z-index: 9300;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: rgba(12, 18, 34, 0.94); color: #F7FBFF; text-align: center;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    }
    /* the numbers panel opens on top of the pause menu and hides it */
    .kb-overlay.kb-scroll { justify-content: flex-start; overflow-y: auto; z-index: 9400; background: #0C1222; }
    .kb-h { font-size: 21px; font-weight: 800; margin-bottom: 4px; }
    .kb-btn {
      font: inherit; font-size: 16px; font-weight: 700; color: #F7FBFF;
      background: #223151; border: 1px solid #6B85B5; border-radius: 12px;
      padding: 13px 18px; min-width: min(72vw, 290px); min-height: 46px; cursor: pointer;
    }
    .kb-btn.kb-primary { background: #38A8DE; border-color: #9BDCF7; color: #101828; }
    .kb-row {
      display: flex; flex-direction: column; gap: 2px; text-align: left;
      width: min(88vw, 360px); padding: 9px 12px; border-radius: 10px; background: #1A2440;
      font-size: 13px; line-height: 1.35; color: #C9D4E4;
    }
    .kb-row b { color: #F7C948; font-size: 13px; font-weight: 750; }
  </style>
</head>
<body>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="js/content.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/art.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/play.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
