<!DOCTYPE html>
<html lang="en">
<head><base href="/play/aftergate/">
<meta charset="utf-8">
<title>Aftergate</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#12151c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0d12;color:#e8edf5;
  font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;touch-action:none;background:#12151c}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,10,15,.94);z-index:10;text-align:center;padding:24px;gap:14px}
.ov.on{display:flex}
.ov h1{font-size:30px;letter-spacing:5px;color:#7ee0a8}
.ov p{font-size:14px;line-height:1.6;color:#9fb0c6;max-width:340px}
.ov b{color:#ffd479}
.btn{min-width:200px;min-height:56px;padding:14px 26px;font:inherit;font-size:17px;letter-spacing:2px;
  background:#1d2a3c;color:#e8edf5;border:2px solid #3d5a7d;border-radius:10px;cursor:pointer}
.btn:active{background:#2a3d56}
#rot p{font-size:18px;color:#ffd479}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="start" class="ov on">
  <h1>AFTERGATE</h1>
  <p><b>DRAG</b> to steer your squad through the gates. Everyone who survives the road garrisons your wall.</p>
  <p>Then hold <b>10 waves</b>. No timers, no purchases &mdash; every soldier is earned.</p>
  <button class="btn" id="startBtn">TAP TO START</button>
</div>

<div id="rot" class="ov"><p>&#8635; ROTATE TO PORTRAIT</p></div>

<script src="js/core.js"></script>
<script src="js/run.js"></script>
<script src="js/base.js"></script>
<script src="js/game.js"></script>
</body>
</html>
