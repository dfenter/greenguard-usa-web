<!doctype html>
<html lang="en">
<head>
  <base href="/play/meadow-solitaire/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="theme-color" content="#102a22">
  <meta name="description" content="Meadow Solitaire. A tri-peaks campaign where every cleared deal restores a living meadow.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Meadow Solitaire</title>
  <style>
    :root { color-scheme: dark; --safe-top: env(safe-area-inset-top); --safe-right: env(safe-area-inset-right); --safe-bottom: env(safe-area-inset-bottom); --safe-left: env(safe-area-inset-left); }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #102a22; color: #eef5dd;
      font-family: Verdana, Geneva, system-ui, sans-serif;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
    canvas { display: block; touch-action: none; }
    #pause-overlay[hidden] { display: none; }
    #pause-overlay {
      position: fixed; inset: 0; z-index: 9500; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 24px; background: rgba(8, 20, 15, .94); color: #eef5dd;
      text-align: center;
    }
    #pause-overlay strong { font-size: 24px; letter-spacing: .12em; }
    #pause-overlay button {
      min-width: 220px; min-height: 48px; border: 1px solid #a8d889;
      border-radius: 12px; color: #132319; background: #a8d889;
      font: 700 16px Verdana, Geneva, sans-serif;
    }
    #pause-overlay button.secondary { color: #eef5dd; border-color: #5f8660; background: #1a382a; }
    #loading-note { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #c7dbb2; font-size: 15px; }
  </style>
</head>
<body>
  <main id="game" aria-label="Meadow Solitaire tri-peaks restoration game"></main>
  <div id="loading-note">Restoring the meadow...</div>
  <div id="pause-overlay" hidden>
    <strong>PAUSED</strong>
    <button id="resume-button" type="button">RESUME</button>
    <button id="pause-menu-button" class="secondary" type="button">MEADOW</button>
  </div>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="game.js"></script>
</body>
</html>
