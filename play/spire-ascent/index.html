<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0a0713">
<meta name="description" content="Spire Ascent - an endless tower climb. Charge your leap, dash off the walls and stay ahead of the rising lava through four authored bands.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="/play/spire-ascent/">
<title>Spire Ascent</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
<link rel="shortcut icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0713; color: #f0e6ff;
    font-family: Verdana, Geneva, system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  canvas { display: block; touch-action: none; }
  /* Safe-area insets: the game reads the real values and offsets its HUD,
     and the body padding keeps the canvas clear of a notch or home bar. */
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
</style>
</head>
<body>
<script src="/play/_shared/phaser.min.js"></script>
<script src="/play/_shared/ggkit.js"></script>
<script src="game.js"></script>
</body>
</html>
