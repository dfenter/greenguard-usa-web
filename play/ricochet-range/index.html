<!doctype html>
<html lang="en">
<head><base href="/play/ricochet-range/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#071419">
  <title>Ricochet Range</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e9fff6;
      --muted: #90b2ad;
      --panel: rgba(9, 28, 32, .88);
      --line: rgba(154, 249, 213, .2);
      --mint: #9af9d5;
      --yellow: #ffd66e;
      --coral: #ff816f;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071419; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
    button { font: inherit; color: inherit; }
    #app { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(circle at 50% 35%, #11363a 0, #071419 58%, #040c10 100%); }
    #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .ui { position: absolute; inset: 0; pointer-events: none; user-select: none; }
    .hud { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
    .brand, .stat, .score-strip, .hint, .modal-card { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 28px rgba(0,0,0,.25), inset 0 1px rgba(255,255,255,.045); backdrop-filter: blur(10px); }
    .brand { border-radius: 14px; padding: 9px 11px 8px; font-size: 11px; letter-spacing: .14em; font-weight: 800; line-height: 1; color: var(--mint); white-space: nowrap; }
    .brand small { display: block; margin-top: 5px; color: var(--muted); font-size: 8px; letter-spacing: .18em; font-weight: 700; }
    .stats { display: flex; gap: 6px; justify-content: flex-end; }
    .stat { min-width: 62px; border-radius: 12px; padding: 7px 8px 6px; text-align: center; }
    .stat b { display: block; font-size: 15px; line-height: 1.1; }
    .stat span { display: block; margin-top: 3px; color: var(--muted); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; }
    #gimmick-stat b { color: var(--yellow); font-size: 11px; }
    .score-strip { position: absolute; left: 12px; right: 12px; top: max(76px, calc(env(safe-area-inset-top) + 64px)); display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; padding: 6px; border-radius: 12px; pointer-events: none; }
    .score-cell { height: 17px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(154,249,213,.12); border-radius: 5px; color: #71928e; font-size: 9px; font-weight: 800; }
    .score-cell.done { color: var(--mint); background: rgba(88, 201, 163, .12); border-color: rgba(154,249,213,.35); }
    .score-cell.current { color: #08181a; background: var(--mint); border-color: var(--mint); box-shadow: 0 0 12px rgba(154,249,213,.45); }
    .hint { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); min-width: 214px; padding: 9px 13px; border-radius: 999px; color: #b7d9d1; text-align: center; font-size: 10px; letter-spacing: .03em; white-space: nowrap; }
    #toast { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%) scale(.9); padding: 8px 14px; border-radius: 999px; background: rgba(154,249,213,.14); border: 1px solid rgba(154,249,213,.35); color: var(--mint); opacity: 0; transition: opacity .16s, transform .16s; font-size: 11px; font-weight: 800; letter-spacing: .12em; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(2,10,13,.38); pointer-events: auto; }
    .modal[hidden] { display: none; }
    .modal-card { width: min(340px, 100%); border-radius: 22px; padding: 24px 20px 20px; text-align: center; pointer-events: auto; }
    .eyebrow { color: var(--yellow); font-size: 10px; letter-spacing: .22em; font-weight: 800; text-transform: uppercase; }
    .modal h1 { margin: 8px 0 5px; font-size: clamp(25px, 8vw, 36px); line-height: .98; letter-spacing: -.04em; }
    .modal p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .result { display: flex; justify-content: center; gap: 14px; margin: 0 auto 19px; }
    .result strong { display: block; font-size: 25px; }
    .result span { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .12em; }
    .modal button { min-height: 52px; width: 100%; border: 0; border-radius: 14px; background: var(--mint); color: #092024; cursor: pointer; font-weight: 900; letter-spacing: .08em; box-shadow: 0 7px 0 #4ea88b, 0 14px 28px rgba(77,216,171,.2); }
    .modal button:active { transform: translateY(3px); box-shadow: 0 4px 0 #4ea88b, 0 8px 18px rgba(77,216,171,.15); }
    .best { margin-top: 14px; color: #85aaa4; font-size: 10px; }
    .rotate { position: absolute; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(3,13,16,.86); text-align: center; pointer-events: auto; }
    .landscape .rotate { display: flex; }
    .rotate-card { max-width: 270px; padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: rgba(10,31,35,.97); }
    .rotate-icon { width: 54px; height: 38px; margin: 0 auto 14px; border: 3px solid var(--mint); border-radius: 7px; transform: rotate(90deg); box-shadow: 0 0 20px rgba(154,249,213,.35); }
    .rotate h2 { margin: 0 0 6px; font-size: 20px; }
    .rotate p { margin: 0; color: var(--muted); font-size: 12px; }
    @media (min-width: 700px) {
      .hud { left: 24px; right: 24px; }
      .score-strip { left: 24px; right: 24px; top: 78px; max-width: 420px; }
      .hint { bottom: 22px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Ricochet Range physics minigolf game"></canvas>
    <div class="ui">
      <header class="hud">
        <div class="brand">RICOCHET RANGE<small>SECTOR 18 // LIVE</small></div>
        <div class="stats">
          <div class="stat"><b id="hole-stat">01/18</b><span>hole</span></div>
          <div class="stat"><b id="stroke-stat">0 · 4</b><span>strokes · par</span></div>
          <div class="stat" id="gimmick-stat"><b id="gimmick-value">CLEAR</b><span>gimmick</span></div>
        </div>
      </header>
      <div id="score-strip" class="score-strip" aria-label="Running scorecard"></div>
      <div id="hint" class="hint">Drag from the orb · arrows aim · space shoots</div>
      <div id="toast" role="status" aria-live="polite"></div>
      <section id="modal" class="modal" hidden>
        <div class="modal-card">
          <div id="modal-eyebrow" class="eyebrow">HOLE CLEARED</div>
          <h1 id="modal-title">Nice ricochet.</h1>
          <p id="modal-copy">You found the pocket.</p>
          <div id="result" class="result"></div>
          <button id="modal-action" type="button">NEXT HOLE</button>
          <div id="best-line" class="best"></div>
        </div>
      </section>
      <div class="rotate">
        <div class="rotate-card">
          <div class="rotate-icon"></div>
          <h2>Rotate your phone</h2>
          <p>Ricochet Range is tuned for a portrait run.</p>
        </div>
      </div>
    </div>
  </main>
  <script src="./game.js"></script>
</body>
</html>
