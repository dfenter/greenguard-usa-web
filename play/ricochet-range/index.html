<!doctype html>
<html lang="en">
<head>
  <base href="/play/ricochet-range/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="theme-color" content="#071116">
  <meta name="description" content="Ricochet Range is a physics minigolf tour of bank shots, moving gates, and generous pickups.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon512.png">
  <title>Ricochet Range</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #071116; color: #effff8;
      overscroll-behavior: none; touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Trebuchet MS", Verdana, system-ui, sans-serif;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game { width: 100%; height: 100%; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <div id="game" aria-label="Ricochet Range physics minigolf"></div>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="game.js"></script>
</body>
</html>
