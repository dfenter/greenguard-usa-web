<!doctype html>
<html lang="en">
<head>
  <base href="/play/wayfarer-courts/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="theme-color" content="#0d1222">
  <meta name="description" content="Wayfarer Courts is an original portrait turn based journey for a company of four.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon.png">
  <title>Wayfarer Courts</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1222; }
    body {
      display: grid; place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overscroll-behavior: none; touch-action: none; user-select: none;
      -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="game.js"></script>
</body>
</html>
