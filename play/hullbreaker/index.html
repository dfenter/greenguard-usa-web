<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #081420; color: #dff4ff;
    font-family: Verdana, Geneva, system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }
  /* Safe-area insets: the game reads the real values and offsets its HUD,
     and the body padding keeps the canvas clear of a notch or home bar. */
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
</style>
