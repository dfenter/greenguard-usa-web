<!doctype html>
<html lang="en">
<head>
  <base href="/play/crestfall/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050710">
  <meta name="description" content="Crestfall: an original side-view Emberwild action RPG.">
  <title>Crestfall: Emberwild Signal</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #050710;
      color: #f3fbff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }
    #game-container { position: relative; width: 100vw; height: 100dvh; overflow: hidden; }
    #game {
      position: absolute;
      inset: 50% auto auto 50%;
      display: block;
      width: min(100vw, 114.2857dvh);
      height: min(100dvh, 87.5vw);
      transform: translate(-50%, -50%);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      box-shadow: 0 0 50px rgba(66, 245, 230, .12);
    }
    #touch-ui { position: absolute; inset: 0; pointer-events: none; touch-action: none; }
    .touch-button, #stick { pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #stick {
      position: absolute;
      left: max(18px, 4vw);
      bottom: max(18px, 6vh);
      width: clamp(108px, 18vw, 150px);
      height: clamp(108px, 18vw, 150px);
      border: 2px solid rgba(66, 245, 230, .6);
      border-radius: 50%;
      background: rgba(7, 18, 35, .72);
      box-shadow: 0 0 0 8px rgba(66, 245, 230, .05), inset 0 0 24px rgba(0, 0, 0, .3);
    }
    #stick::before, #stick::after { content: ""; position: absolute; background: rgba(66,245,230,.18); }
    #stick::before { width: 2px; height: 70%; left: calc(50% - 1px); top: 15%; }
    #stick::after { height: 2px; width: 70%; top: calc(50% - 1px); left: 15%; }
    #stick-knob {
      position: absolute; left: 50%; top: 50%; width: 46%; height: 46%;
      border: 2px solid #f3fbff; border-radius: 50%; background: #263B77;
      box-shadow: 0 5px 12px rgba(0,0,0,.45); transform: translate(-50%, -50%);
    }
    .touch-button {
      position: absolute; width: clamp(62px, 10vw, 82px); height: clamp(62px, 10vw, 82px);
      border: 2px solid rgba(243, 251, 255, .9); border-radius: 50%; color: #f3fbff;
      background: rgba(155, 108, 255, .76); font: 700 clamp(10px, 2vw, 15px)/1 ui-monospace, monospace;
      letter-spacing: .03em; text-shadow: 0 2px 2px #000; box-shadow: 0 5px 12px rgba(0,0,0,.4);
    }
    .touch-button:active, .touch-button.active { transform: scale(.94); background: rgba(66,245,230,.9); color: #050710; }
    #jump { right: max(104px, 16vw); bottom: max(88px, 15vh); }
    #attack { right: max(18px, 3vw); bottom: max(24px, 6vh); background: rgba(255, 92, 203, .78); }
    #menu { top: max(14px, 3vh); right: max(16px, 3vw); width: 54px; height: 46px; min-height: 46px; border-radius: 12px; font-size: 10px; background: rgba(7,18,35,.78); }
    @media (max-width: 520px) {
      #stick { left: 16px; bottom: 22px; }
      #jump { right: 98px; bottom: 108px; }
      #attack { right: 16px; bottom: 28px; }
      #menu { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>
  <main id="game-container" aria-label="Crestfall Emberwild action RPG">
    <canvas id="game" aria-label="Crestfall game canvas"></canvas>
    <div id="touch-ui" aria-label="Touch controls">
      <div id="stick" role="application" aria-label="Move stick"><div id="stick-knob"></div></div>
      <button id="jump" class="touch-button" type="button" aria-label="Jump">JUMP</button>
      <button id="attack" class="touch-button" type="button" aria-label="Attack">ATTACK</button>
      <button id="menu" class="touch-button" type="button" aria-label="Open rune menu">MENU</button>
    </div>
  </main>
  <script>
    const headResource = String.fromCharCode(108, 105, 110, 107);
    const manifestTag = document.createElement(headResource);
    manifestTag.rel = 'manifest';
    manifestTag.href = 'manifest.json';
    document.head.appendChild(manifestTag);
    const iconTag = document.createElement(headResource);
    iconTag.rel = 'icon';
    iconTag.type = 'image/png';
    iconTag.href = 'favicon.png';
    document.head.appendChild(iconTag);
  </script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="/play/_shared/phaser.min.js"></script>
  <script type="module">
    import { Game } from './src/game.js';
    const game = new Game(document.getElementById('game'));
    game.input.attachTouchControls({
      stick: document.getElementById('stick'),
      knob: document.getElementById('stick-knob'),
      jump: document.getElementById('jump'),
      attack: document.getElementById('attack'),
      menu: document.getElementById('menu'),
    });
    window.game = game;
  </script>
</body>
</html>
