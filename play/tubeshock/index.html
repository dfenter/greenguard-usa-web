<!doctype html>
<html lang="en">
<head><base href="/play/tubeshock/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Tubeshock</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #060912; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; touch-action: none; user-select: none; -webkit-user-select: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: fixed; inset: 0 0 auto; z-index: 2; padding: max(14px, env(safe-area-inset-top)) 16px 0; pointer-events: none; text-shadow: 0 2px 10px #000; }
    .topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .brand { color: #dffbff; font-size: 13px; letter-spacing: .24em; font-weight: 800; }
    .stats { display: flex; gap: 12px; text-align: right; color: #9eb6c8; font-size: 10px; letter-spacing: .1em; }
    .stat b { display: block; color: #f5fdff; font-size: 18px; letter-spacing: .04em; line-height: 1.15; }
    .lives { color: #ff718d; letter-spacing: .12em; white-space: nowrap; }
    .lives b { color: #ff718d; }
    #hint { position: absolute; top: 60px; left: 50%; width: 100%; transform: translateX(-50%); text-align: center; color: #9bc8d0; font-size: 10px; letter-spacing: .13em; opacity: .9; transition: opacity .6s; }
    #hint.fade { opacity: 0; }
    #surgeBtn { position: fixed; z-index: 3; right: max(15px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 78px; height: 78px; border: 1px solid #ffcf6e; border-radius: 50%; color: #fff8df; background: radial-gradient(circle at 35% 25%, #ffb753, #b84c42 60%, #3a1824); box-shadow: 0 0 0 5px #ffb63a18, 0 0 26px #f0714f88, inset 0 0 18px #fff2a844; font: 800 11px/1.15 ui-monospace, monospace; letter-spacing: .1em; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #surgeBtn:active { transform: scale(.94); filter: brightness(1.3); }
    #surgeBtn span { display: block; margin-top: 3px; font-size: 15px; color: #fff; }
    #message { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .18s; background: #02040bcc; }
    #message.show { opacity: 1; pointer-events: auto; }
    .card { width: min(84vw, 330px); padding: 27px 22px 24px; border: 1px solid #8ceaf288; border-radius: 18px; background: linear-gradient(145deg, #112638f2, #090d19f2); box-shadow: 0 0 45px #00d9ff22, inset 0 0 24px #00d9ff0e; text-align: center; }
    .card h1 { margin: 0 0 9px; color: #e9feff; font-size: 24px; letter-spacing: .18em; }
    .card p { margin: 0 0 19px; color: #9ab7c4; font-size: 11px; letter-spacing: .12em; line-height: 1.7; }
    #restart { min-height: 52px; min-width: 170px; border: 1px solid #92f4df; border-radius: 9px; background: #163b49; color: #e9ffff; font: 800 12px ui-monospace, monospace; letter-spacing: .16em; touch-action: manipulation; }
    #restart:active { background: #276b75; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Tubeshock game"></canvas>
  <div class="hud" aria-live="polite">
    <div class="topline">
      <div class="brand">TUBESHOCK</div>
      <div class="stats">
        <div class="stat">SCORE<b id="score">000000</b></div>
        <div class="stat">BEST<b id="best">000000</b></div>
        <div class="stat">LEVEL<b id="level">01</b></div>
      </div>
    </div>
    <div class="topline" style="margin-top:7px">
      <div class="lives" id="lives">♥ ♥ ♥</div>
      <div class="stats"><div class="stat">SURGE<b id="surge">02</b></div></div>
    </div>
    <div id="hint">SLIDE THE CLAW • AUTO-FIRE • SURGE CLEARS THE RIM</div>
  </div>
  <button id="surgeBtn" type="button" aria-label="Activate surge">SURGE<span id="surgeButtonCount">2</span></button>
  <div id="message">
    <div class="card">
      <h1 id="messageTitle">RIM BREACH</h1>
      <p id="messageText">THE TUBE GOT THROUGH<br>SCORE 000000 · BEST 000000</p>
      <button id="restart" type="button">RESTART RUN</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
