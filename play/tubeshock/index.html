<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#050a18">
<meta name="description" content="Tubeshock - a portrait tube shooter. Ride the rim, auto fire down the lanes, bank a SURGE and clear the tube. Six depth runs, a score attack sprint and a multi phase guardian.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="/play/tubeshock/">
<title>Tubeshock</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #050a18; color: #e9feff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }
  /* The game reads the real safe-area values and offsets its HUD; the body
     padding keeps the canvas itself clear of a notch or a home bar. */
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
</style>
</head>
<body>
<script src="/play/_shared/phaser.min.js"></script>
<script src="/play/_shared/ggkit.js"></script>
<script src="ts_data.js"></script>
<script src="game.js"></script>
</body>
</html>
