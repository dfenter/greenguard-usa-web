<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#120f26">
<meta name="description" content="Curbside - endless street skating. Ollie, flip, grind and bank the combo across four authored districts and a finale line.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="/play/curbside/">
<title>Curbside</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #120f26; color: #f2ecff;
    font-family: Verdana, Geneva, system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }
  /* The game reads the real safe-area values through a probe element and
     offsets its own HUD; this padding keeps the canvas clear of a notch or
     home bar on top of that. */
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
</style>
</head>
<body>
<script src="/play/_shared/phaser.min.js"></script>
<script src="/play/_shared/ggkit.js"></script>
<script src="cb_data.js"></script>
<script src="cb_world.js"></script>
<script src="game.js"></script>
</body>
</html>
