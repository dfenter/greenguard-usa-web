<!doctype html>
<html lang="en">
<head><base href="/play/sporeling-saga/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <title>Sporeling Saga</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070b16; }
    body { display: grid; place-items: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #game-shell {
      position: relative;
      width: min(100vw, calc(100dvh * 0.5571428571));
      height: min(100dvh, calc(100vw * 1.7948717949));
      aspect-ratio: 390 / 700;
      overflow: hidden;
      background: #0b1020;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #rotate-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 34px;
      text-align: center;
      background: rgba(7, 11, 22, 0.97);
      color: #f7f0df;
      letter-spacing: 0.08em;
      font-weight: 800;
      font-size: clamp(20px, 6vw, 32px);
    }
    #rotate-overlay span { display: block; margin-top: 16px; color: #8fa0bf; font-size: 12px; letter-spacing: 0.12em; line-height: 1.5; }
    #rotate-overlay[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Sporeling Saga game">
    <canvas id="game-canvas" width="390" height="700" aria-label="Sporeling Saga playfield"></canvas>
    <div id="rotate-overlay" hidden>ROTATE TO PORTRAIT<span>The saga pauses here.<br>Turn your device upright to continue.</span></div>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
