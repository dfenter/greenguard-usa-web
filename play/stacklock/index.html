<!doctype html>
<html lang="en">
<head><base href="/play/stacklock/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#08101e">
  <title>STACKLOCK</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app" aria-label="Stacklock falling block game">
    <header class="topbar">
      <div class="wordmark"><span class="mark">S</span><span>STACKLOCK</span></div>
      <div class="run-info">
        <div><span class="label" id="metricLabel">SCORE</span><strong id="metricValue">0</strong></div>
        <div><span class="label" id="secondaryLabel">BEST</span><strong id="secondaryValue">0</strong></div>
      </div>
    </header>

    <nav class="modebar" aria-label="Game mode">
      <button class="mode-button active" data-mode="marathon">MARATHON</button>
      <button class="mode-button" data-mode="sprint">SPRINT <span>40</span></button>
      <div class="level-readout"><span>LEVEL</span><strong id="levelValue">1</strong></div>
    </nav>

    <section class="stage" aria-label="Game board">
      <canvas id="gameCanvas" tabindex="0" aria-label="Stacklock game board"></canvas>
      <div class="helper-line">Tap sides to steer · tap piece to rotate · swipe up to hold</div>
    </section>

    <section class="controls" aria-label="Touch controls">
      <button class="control-button" data-action="hold"><span class="control-icon">↥</span><span>HOLD</span></button>
      <button class="control-button primary" data-action="rotate"><span class="control-icon">↻</span><span>ROTATE</span></button>
      <button class="control-button" data-action="drop"><span class="control-icon">⌄</span><span>DROP</span></button>
    </section>

    <div class="status-line" id="statusLine" role="status" aria-live="polite">Build a clean stack.</div>
  </main>
  <script src="./game.js"></script>
</body>
</html>
