<!doctype html>
<html lang="en">
<head>
  <base href="/play/descent-protocol/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071116">
  <meta name="description" content="Descent Protocol, a twin-stick corridor shooter for GreenGuard USA.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Descent Protocol</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071116; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
  <div id="game" aria-label="Descent Protocol game"></div>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="/play/_shared/phaser.min.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js', { scope: '/play/descent-protocol/' }).catch(function () {});
    }
  </script>
  <script src="game.js"></script>
</body>
</html>
