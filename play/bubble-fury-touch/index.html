<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#05080f">
<meta name="description" content="Bubble Fury Touch - twin-stick arena survival. Fifteen waves across five arenas, rotating weapon racks and the Scuzz boss fights.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="/play/bubble-fury-touch/">
<title>Bubble Fury Touch</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
<link rel="shortcut icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05080f; color: #dff6ff;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game-root { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  /* The game reads the real inset values off this probe and offsets its HUD,
     so a notch or home bar never sits on top of the score or the sticks. */
  #safearea {
    position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none;
    visibility: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #nojs { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
          text-align: center; font-size: 15px; color: #8fb6cf; }
</style>
</head>
<body>
<div id="safearea"></div>
<div id="game-root"></div>
<noscript><div id="nojs">Bubble Fury Touch needs JavaScript enabled.</div></noscript>
<script src="/play/_shared/phaser.min.js"></script>
<script src="/play/_shared/ggkit.js"></script>
<script src="bf_data.js"></script>
<script src="game.js"></script>
</body>
</html>
