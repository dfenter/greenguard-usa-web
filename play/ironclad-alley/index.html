<!doctype html>
<html lang="en">
<head><base href="/play/ironclad-alley/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Ironclad Alley</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#07101b; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #game { display:block; width:100vw; height:100vh; touch-action:none; user-select:none; -webkit-user-select:none; }
    #rotate { display:none; position:fixed; inset:0; z-index:5; place-items:center; padding:32px; text-align:center; color:#d9f7ff; background:rgba(4,10,18,.94); letter-spacing:.12em; }
    #rotate.show { display:grid; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Ironclad Alley tank duel"></canvas>
  <div id="rotate">PORTRAIT MODE REQUIRED<br><small>TURN DEVICE</small></div>
  <script src="game.js"></script>
</body>
</html>
