<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#08111f">
<meta name="description" content="Crossfire Hopper - jump between authored platforms, dodge enemy crossfire, and clear wave bands with medals.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="/play/crossfire-hopper/">
<title>Crossfire Hopper</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
<link rel="icon" href="icon.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    color-scheme: dark;
    --ink: #08111f;
    --ink2: #0d1c2e;
    --panel: rgba(12, 27, 43, .94);
    --line: rgba(140, 240, 205, .22);
    --mint: #74f3b0;
    --mint2: #c9ffe6;
    --gold: #ffd35e;
    --coral: #ff8878;
    --text: #dff6ea;
    --dim: rgba(206, 244, 227, .58);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--ink); color: var(--text);
    font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  /* Every overlay lives inside the safe area. The canvas fills the window and
     the game reads the insets itself for its HUD band. */
  .safe {
    position: fixed;
    top: env(safe-area-inset-top); right: env(safe-area-inset-right);
    bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
    pointer-events: none;
  }

  /* ---- thin coach strip. Pinned under the HUD band, never over the play
     area centre and never in the bottom half. */
  #coach {
    position: absolute; left: 50%; transform: translate(-50%, -14px);
    width: min(92%, 520px); top: var(--coachtop, 76px);
    min-height: 34px; max-height: 48px; padding: 7px 12px; border-radius: 8px;
    background: linear-gradient(180deg, rgba(11, 30, 47, .8), rgba(9, 22, 36, .74));
    border: 1px solid var(--line);
    font-size: 14px; line-height: 1.1; font-weight: 700; letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: center; color: var(--mint2);
    opacity: 0; transition: opacity .28s ease, transform .28s ease;
    pointer-events: none;
  }
  #coach.on { opacity: .28; transform: translate(-50%, 0); }
  #coach.on.fresh { opacity: 1; }
  #coach b { color: var(--mint); }

  /* ---- on-screen arrow pad */
  #pad {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 14px; width: min(74%, 290px);
    display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr); gap: 8px;
    pointer-events: none; opacity: 0; transition: opacity .25s ease;
  }
  #pad.on { opacity: 1; }
  #pad button {
    pointer-events: auto; touch-action: none;
    font: inherit; font-size: 22px; font-weight: 800; line-height: 1;
    color: var(--mint2);
    background: rgba(9, 22, 36, .58);
    border: 1px solid rgba(150, 255, 214, .2);
    border-radius: 16px; padding: 0; height: 54px;
    display: grid; place-items: center;
    backdrop-filter: blur(2px);
    transition: background .09s ease, transform .09s ease, border-color .09s ease;
  }
  #pad button.hit {
    background: rgba(116, 243, 176, .3);
    border-color: rgba(201, 255, 230, .6);
    transform: scale(.94);
  }
  #pad .up { grid-column: 2; grid-row: 1; height: 58px; }
  #pad .left { grid-column: 1; grid-row: 2; }
  #pad .down { grid-column: 2; grid-row: 2; }
  #pad .right { grid-column: 3; grid-row: 2; }

  /* ---- top-right chips */
  #chips {
    position: absolute; right: 8px; top: 6px;
    display: flex; gap: 5px; pointer-events: none; opacity: 0;
    transition: opacity .25s ease;
  }
  #chips.on { opacity: 1; }
  #chips button {
    pointer-events: auto; font: inherit; font-size: 15px; font-weight: 700;
    color: var(--mint2); background: rgba(9, 22, 36, .62);
    border: 1px solid rgba(150, 255, 214, .18); border-radius: 12px;
    width: 44px; height: 44px; display: grid; place-items: center;
  }

  /* ---- menu / results layer */
  #ui {
    position: fixed; inset: 0; display: none;
    align-items: flex-start; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
    background: radial-gradient(120% 90% at 50% 0%, rgba(20, 54, 78, .82), rgba(5, 12, 22, .95));
    overflow-y: auto; z-index: 30;
  }
  #ui.on { display: flex; }
  .card {
    width: min(100%, 440px); margin: auto;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 22px;
    padding: 18px 18px 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
    animation: rise .34s cubic-bezier(.18, .9, .3, 1.24) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.97); } }
  .kicker {
    font-size: 10.5px; font-weight: 800; letter-spacing: .22em;
    color: rgba(140, 240, 205, .72); margin-bottom: 6px;
  }
  .title { font-size: 27px; font-weight: 800; letter-spacing: .01em; margin: 0 0 4px; }
  .title .sp { color: var(--mint); }
  .blurb { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin: 0 0 14px; }
  .rowline { height: 1px; background: var(--line); margin: 13px 0; }
  .btn {
    display: block; width: 100%; font: inherit; font-size: 15px; font-weight: 800;
    color: var(--ink); background: linear-gradient(180deg, #8dfcc2, #57d79b);
    border: 0; border-radius: 14px; padding: 13px 14px; margin-bottom: 9px;
    text-align: left; letter-spacing: .02em;
  }
  .btn.alt {
    color: var(--mint2); background: rgba(19, 40, 60, .9);
    border: 1px solid rgba(140, 240, 205, .24);
  }
  .btn.sm { font-size: 13px; padding: 10px 12px; }
  .btn .sub {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: .01em;
    opacity: .74; margin-top: 3px;
  }
  .btn:disabled { opacity: .45; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .stat { background: rgba(9, 22, 36, .7); border: 1px solid rgba(140, 240, 205, .14);
          border-radius: 13px; padding: 9px 11px; }
  .stat .k { font-size: 9.5px; font-weight: 800; letter-spacing: .16em; color: var(--dim); }
  .stat .v { font-size: 20px; font-weight: 800; color: var(--mint2); margin-top: 2px; }
  .stat .v.gold { color: var(--gold); }
  table.bands { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.bands td { padding: 6px 4px; border-bottom: 1px solid rgba(140, 240, 205, .1); }
  table.bands td.n { font-weight: 700; color: var(--mint2); }
  table.bands td.t { color: var(--dim); font-size: 11px; }
  table.bands td.m { text-align: right; font-weight: 800; letter-spacing: .1em; font-size: 10.5px; }
  .m-gold { color: #ffd35e; } .m-silver { color: #cfd9e6; }
  .m-bronze { color: #cd8a4e; } .m-none { color: rgba(160, 185, 200, .5); }
  .skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .skin {
    font: inherit; border-radius: 13px; padding: 8px 4px 7px; border: 1px solid rgba(140, 240, 205, .16);
    background: rgba(9, 22, 36, .7); color: var(--mint2); font-size: 10px; font-weight: 700;
    display: grid; justify-items: center; gap: 5px; letter-spacing: .02em;
  }
  .skin.on { border-color: var(--mint); background: rgba(30, 74, 62, .8); }
  .skin.locked { opacity: .42; }
  .skin i { display: block; width: 26px; height: 26px; border-radius: 9px; }
  .foot { font-size: 10.5px; color: rgba(190, 226, 212, .45); text-align: center; margin-top: 12px; line-height: 1.55; }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    #coach, #pad, #chips { transition: none; }
  }
</style>
</head>
<body>
<div class="safe" id="hudlayer">
  <div id="coach" aria-live="polite"></div>
  <div id="chips">
    <button id="btnPause" type="button" aria-label="Pause">II</button>
    <button id="btnSet" type="button" aria-label="Settings">&#9881;</button>
    <button id="btnDodge" type="button" aria-label="Dodge">&#10022;</button>
    <button id="btnFire" type="button" aria-label="Fire">&#9670;</button>
    <button id="btnPower" type="button" aria-label="Activate power-up">&#9889;</button>
  </div>
  <div id="pad" role="group" aria-label="Platform controls">
    <button class="up" type="button" data-cmd="up" aria-label="Jump">&#9650;</button>
    <button class="left" type="button" data-cmd="left" aria-label="Move left">&#9664;</button>
    <button class="down" type="button" data-cmd="dodge" aria-label="Dodge">&#9660;</button>
    <button class="right" type="button" data-cmd="right" aria-label="Move right">&#9654;</button>
  </div>
</div>
<div id="ui"><div class="card" id="uicard"></div></div>
<script src="/play/_shared/phaser.min.js"></script>
<script src="/play/_shared/ggkit.js"></script>
<script src="ch_data.js"></script>
<script src="game.js"></script>
</body>
</html>
