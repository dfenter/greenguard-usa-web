<!doctype html>
<html lang="en">
<head>
  <base href="/play/mazerunner-prime/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060a18">
  <meta name="description" content="Mazerunner Prime, a pellet-maze chase run through the GreenGuard circuit.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <title>Mazerunner Prime</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      --ink: #eef7ff;
      --muted: #91a6c9;
      --glass: rgba(7, 14, 35, .82);
      --line: rgba(116, 181, 255, .24);
      --aqua: #5effdc;
      --violet: #a990ff;
      --gold: #ffd66e;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #060a18; }
    body { touch-action: none; user-select: none; -webkit-user-select: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #game canvas { display: block; width: 100%; height: 100%; }
    .topbar { position: fixed; z-index: 5; top: max(8px, env(safe-area-inset-top)); left: 13px; right: 13px; pointer-events: none; }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
    .brand { min-width: 0; }
    .eyebrow { color: var(--aqua); font-size: 9px; line-height: 1; font-weight: 950; letter-spacing: .22em; }
    .brand h1 { margin: 4px 0 0; color: var(--ink); font-size: clamp(18px, 5vw, 25px); line-height: 1; letter-spacing: .08em; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .06em; }
    #shell-actions { display: flex; gap: 6px; pointer-events: auto; }
    #shell-actions button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: var(--glass); font-size: 15px; }
    #shell-actions button:focus-visible, #title-start:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
    .hud { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-top: 8px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 12px; background: rgba(7, 14, 35, .72); box-shadow: 0 7px 18px rgba(0,0,0,.18); backdrop-filter: blur(8px); }
    .hud-card { display: flex; align-items: center; min-width: 0; gap: 5px; color: var(--ink); }
    .metric-icon { color: var(--muted); font-size: 14px; line-height: 1; }
    .hud-value { color: var(--ink); font-size: 14px; line-height: 1; font-weight: 950; letter-spacing: .05em; white-space: nowrap; }
    .metric-divider { color: #536b94; font-size: 14px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    #score { color: var(--aqua); }
    #lives { color: #ff719e; letter-spacing: .12em; }
    #fright { color: var(--gold); }
    #coach-strip { position: fixed; z-index: 6; top: calc(max(8px, env(safe-area-inset-top)) + 82px); left: 14px; right: 14px; min-height: 32px; max-height: 48px; padding: 7px 10px; border: 1px solid rgba(94,255,220,.24); border-radius: 8px; color: #dce8ff; background: rgba(8,18,46,.7); box-shadow: 0 5px 14px rgba(0,0,0,.14); font-size: 14px; font-weight: 750; line-height: 1.15; letter-spacing: .01em; text-align: left; opacity: 0; transition: opacity .28s; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #coach-strip.visible { opacity: .78; }
    #coach-strip.faded { opacity: .1; }
    #coach-strip.fading { opacity: 0; }
    #controls { position: fixed; z-index: 7; right: max(12px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); width: 143px; height: 125px; opacity: .9; }
    .pad { position: absolute; width: 47px; height: 47px; border: 1px solid rgba(144,190,255,.32); border-radius: 15px; color: #dce8ff; background: rgba(17,33,73,.78); box-shadow: 0 6px 18px rgba(0,0,0,.22); font: 900 18px/1 system-ui; touch-action: none; }
    .pad:active { color: #061022; background: var(--aqua); transform: scale(.94); }
    .pad.up { top: 0; left: 48px; }
    .pad.left { top: 52px; left: 0; }
    .pad.down { top: 52px; left: 48px; }
    .pad.right { top: 52px; left: 96px; }
    #effects { position: fixed; z-index: 5; top: calc(max(8px, env(safe-area-inset-top)) + 82px); left: 14px; right: 14px; color: #b7c9e7; font-size: 14px; font-weight: 850; line-height: 1; letter-spacing: .02em; text-align: right; pointer-events: none; white-space: nowrap; }
    #effects[hidden] { display: none; }
    #title-menu { position: fixed; z-index: 8; left: 50%; top: 43%; transform: translate(-50%, -50%); width: min(74vw, 320px); padding: 15px; border: 1px solid rgba(94,255,220,.38); border-radius: 18px; color: var(--ink); background: rgba(7, 14, 35, .9); box-shadow: 0 14px 42px rgba(0,0,0,.32); text-align: center; }
    #title-menu[hidden] { display: none; }
    #title-menu strong { display: block; color: var(--aqua); font-size: 12px; letter-spacing: .18em; }
    #title-menu p { margin: 8px 0 12px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    #title-start { border: 0; border-radius: 11px; padding: 10px 18px; color: #061022; background: var(--aqua); font: 900 12px/1 system-ui; letter-spacing: .1em; }
    .active-play .brand { display: none; }
    .active-play .brand-row { justify-content: flex-end; }
    .active-play .hud { margin-top: 7px; }
    @media (min-width: 600px) { #controls { right: 22px; bottom: 22px; } }
    @media (prefers-reduced-motion: reduce) { #coach-strip { transition: none; } }
  </style>
</head>
<body>
  <div id="game" aria-label="Mazerunner Prime game"></div>
  <header class="topbar">
    <div class="brand-row">
      <div class="brand"><div class="eyebrow">GREENGUARD USA // FLEET F5</div><h1>MAZERUNNER PRIME</h1></div>
      <div id="shell-actions"><button id="pause" type="button" aria-label="Pause game">Ⅱ</button><button id="fullscreen" type="button" aria-label="Enter fullscreen">⛶</button><button id="settings" type="button" aria-label="Open settings">⚙</button></div>
    </div>
    <div class="hud" aria-label="Run status">
      <div class="hud-card" title="Score"><span class="metric-icon" aria-hidden="true">◆</span><span class="sr-only">Score</span><span class="hud-value" id="score">000000</span></div>
      <div class="hud-card" title="Circuit and maze"><span class="metric-icon" aria-hidden="true">⌁</span><span class="sr-only">Circuit and maze</span><span class="hud-value" id="circuit">C1 · M01</span></div>
      <div class="hud-card" title="Power timer"><span class="metric-icon" aria-hidden="true">⚡</span><span class="sr-only">Power</span><span class="hud-value" id="fright">—</span></div>
      <div class="hud-card" title="Lives and best score"><span class="metric-icon" aria-hidden="true">♥</span><span class="sr-only">Lives</span><span class="hud-value" id="lives">●●●</span><span class="metric-divider" aria-hidden="true">·</span><span class="metric-icon" aria-hidden="true">★</span><span class="sr-only">Best</span><span class="hud-value" id="best">000000</span></div>
    </div>
    <div id="effects" aria-live="polite"></div>
  </header>
  <div id="coach-strip" aria-live="polite"></div>
  <div id="title-menu"><strong>MAZERUNNER PRIME</strong><p id="title-copy">Select a circuit with 1 to 4, then deploy. Your highest unlocked circuit is selected.</p><button id="title-start" type="button">DEPLOY RUN</button></div>
  <div id="controls" aria-label="Touch direction controls">
    <button class="pad up" data-dir="up" type="button" aria-label="Move up">▲</button>
    <button class="pad left" data-dir="left" type="button" aria-label="Move left">◀</button>
    <button class="pad down" data-dir="down" type="button" aria-label="Move down">▼</button>
    <button class="pad right" data-dir="right" type="button" aria-label="Move right">▶</button>
  </div>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="game.js"></script>
</body>
</html>
