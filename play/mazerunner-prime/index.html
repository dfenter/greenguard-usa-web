<!doctype html>
<html lang="en">
<head><base href="/play/mazerunner-prime/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#070b1c">
  <title>Neon Run</title>
  <style>
    :root { color-scheme: dark; font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070b1c; }
    body { touch-action: none; user-select: none; -webkit-user-select: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: fixed; z-index: 3; top: max(12px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; align-items: stretch; gap: 8px; pointer-events: none; }
    .hud-card { min-width: 0; flex: 1; padding: 8px 10px 7px; border: 1px solid rgba(116, 153, 255, .27); border-radius: 13px; background: rgba(9, 16, 42, .78); box-shadow: 0 8px 24px rgba(0,0,0,.22); backdrop-filter: blur(7px); }
    .hud-card.center { flex: 0 0 76px; text-align: center; }
    .hud-label { display: block; color: #8999c8; font-size: 9px; letter-spacing: .16em; font-weight: 800; }
    .hud-value { display: block; margin-top: 2px; color: #f1f6ff; font-size: 16px; line-height: 1; font-weight: 900; letter-spacing: .04em; }
    .hud-card:first-child .hud-value { color: #72f4e1; }
    #lives { letter-spacing: .16em; color: #ff6f9b; }
    #hint { position: fixed; z-index: 3; top: 76px; left: 50%; transform: translateX(-50%); padding: 7px 13px; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; color: #c5d4ff; background: rgba(12, 21, 53, .7); font-size: 11px; font-weight: 800; letter-spacing: .08em; white-space: nowrap; transition: opacity .4s, transform .4s; pointer-events: none; }
    #hint.hidden { opacity: 0; transform: translate(-50%, -8px); }
    #state-card { position: fixed; z-index: 4; left: 50%; top: 47%; width: min(84vw, 330px); transform: translate(-50%, -50%) scale(.96); padding: 22px 20px 20px; border: 1px solid rgba(116, 244, 225, .36); border-radius: 22px; color: #f4f7ff; text-align: center; background: rgba(8, 14, 36, .93); box-shadow: 0 18px 55px rgba(0,0,0,.42), 0 0 40px rgba(84, 111, 255, .16); opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s; }
    #state-card.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    #state-title { margin: 0; color: #72f4e1; font-size: 25px; letter-spacing: .08em; }
    #state-copy { margin: 8px 0 15px; color: #adbadc; font-size: 12px; line-height: 1.45; }
    #state-action { display: inline-block; padding: 10px 16px; border-radius: 999px; color: #07101f; background: #72f4e1; font-size: 11px; font-weight: 950; letter-spacing: .12em; }
    #rotate-card { position: fixed; z-index: 7; inset: 0; display: none; place-items: center; padding: 30px; text-align: center; background: rgba(5, 8, 22, .9); backdrop-filter: blur(8px); }
    #rotate-card.visible { display: grid; }
    #rotate-card div { max-width: 240px; }
    #rotate-card strong { display: block; color: #72f4e1; font-size: 21px; letter-spacing: .08em; }
    #rotate-card span { display: block; margin-top: 8px; color: #b9c8ed; font-size: 12px; line-height: 1.4; }
    #controls { position: fixed; z-index: 3; right: max(14px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 140px; height: 122px; opacity: .8; }
    .pad { position: absolute; width: 48px; height: 48px; border: 1px solid rgba(145, 175, 255, .3); border-radius: 15px; color: #dce6ff; background: rgba(20, 34, 77, .75); box-shadow: 0 5px 18px rgba(0,0,0,.2); font-size: 19px; font-weight: 900; touch-action: none; }
    .pad:active { color: #07101f; background: #72f4e1; transform: scale(.94); }
    .pad.up { top: 0; left: 46px; }
    .pad.left { top: 52px; left: 0; }
    .pad.down { top: 52px; left: 46px; }
    .pad.right { top: 52px; left: 92px; }
    @media (min-width: 600px) { #controls { right: 22px; bottom: 22px; } }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Neon Run maze game"></canvas>
  <div class="hud" aria-live="polite">
    <div class="hud-card"><span class="hud-label">SCORE</span><span class="hud-value" id="score">000000</span></div>
    <div class="hud-card center"><span class="hud-label">LEVEL</span><span class="hud-value" id="level">01</span></div>
    <div class="hud-card"><span class="hud-label">BEST / LIVES</span><span class="hud-value"><span id="best">000000</span> <span id="lives">●●●</span></span></div>
  </div>
  <div id="hint">SWIPE TO TURN · ARROWS ALSO WORK</div>
  <div id="state-card" role="button" tabindex="0" aria-label="Restart game">
    <h1 id="state-title">RUN ENDED</h1>
    <p id="state-copy"></p>
    <span id="state-action">TAP OR PRESS ENTER</span>
  </div>
  <div id="rotate-card"><div><strong>TURN SCREEN VERTICAL</strong><span>Neon Run is built for a pocket-sized portrait sprint.</span></div></div>
  <div id="controls" aria-label="Touch direction controls">
    <button class="pad up" data-dir="up" aria-label="Move up">▲</button>
    <button class="pad left" data-dir="left" aria-label="Move left">◀</button>
    <button class="pad down" data-dir="down" aria-label="Move down">▼</button>
    <button class="pad right" data-dir="right" aria-label="Move right">▶</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
