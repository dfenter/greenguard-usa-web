<!doctype html>
<html lang="en">
<head>
  <base href="/play/bulwark/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06111e">
  <meta name="description" content="Bulwark, a lane defense maze builder from GreenGuard USA.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="64x64" href="icon.png">
  <title>Bulwark // Fleet F5</title>
  <style>
    :root { color-scheme: dark; background: #06111e; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #06111e; }
    body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    #game { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); width: auto; height: auto; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: auto; touch-action: none; }
  </style>
</head>
<body>
  <main id="game" aria-label="Bulwark lane defense game"></main>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
