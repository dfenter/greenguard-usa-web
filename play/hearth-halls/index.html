<!doctype html>
<html lang="en">
<head>
  <base href="/play/hearth-halls/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#172541">
  <meta name="description" content="Hearth & Halls is a match-3 room restoration story about Marn, Pip, and a home with opinions.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hearth &amp; Halls</title>
  <link rel="manifest" href="/play/hearth-halls/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/play/hearth-halls/favicon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/play/hearth-halls/icon.png">
  <link rel="stylesheet" href="/play/hearth-halls/styles.css">
</head>
<body>
  <main id="game-shell" aria-label="Hearth and Halls game">
    <div id="game" aria-label="Hearth and Halls play area"></div>
    <div id="sr-status" aria-live="polite"></div>
    <nav id="accessible-controls" aria-label="Hearth and Halls accessible controls">
      <button class="a11y-control" type="button" data-hh-action="start" aria-label="Begin or start">Begin</button>
      <button class="a11y-control" type="button" data-hh-action="left" aria-label="Move left">Left</button>
      <button class="a11y-control" type="button" data-hh-action="right" aria-label="Move right">Right</button>
      <button class="a11y-control" type="button" data-hh-action="up" aria-label="Move up or choose a keepsake">Up</button>
      <button class="a11y-control" type="button" data-hh-action="down" aria-label="Move down or choose a keepsake">Down</button>
      <button class="a11y-control" type="button" data-hh-action="confirm" aria-label="Confirm selection">Confirm</button>
      <button class="a11y-control" type="button" data-hh-action="hint" aria-label="Show a legal move hint">Hint</button>
      <button class="a11y-control" type="button" data-hh-action="settings" aria-label="Open settings">Settings</button>
    </nav>
  </main>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="/play/hearth-halls/game.js"></script>
</body>
</html>
