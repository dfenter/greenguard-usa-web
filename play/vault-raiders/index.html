<!doctype html>
<html lang="en">
<head>
  <base href="/play/vault-raiders/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="theme-color" content="#081426">
  <meta name="description" content="Vault Raiders: a local two-player dungeon raid with synchronized puzzles, a guardian, and a shared treasure vault.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Vault Raiders</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game-shell" aria-label="Vault Raiders game">
    <div id="game" aria-label="Vault Raiders canvas"></div>
    <div id="control-legend" aria-label="Local co-op controls">
      <span><strong>P1</strong> WASD move | F interact | G attack | H dash</span>
      <span><strong>P2</strong> Arrow keys move | Enter interact | / attack | . dash</span>
    </div>
    <p id="sr-status" class="sr-only" aria-live="polite"></p>
  </main>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="game.js"></script>
</body>
</html>
