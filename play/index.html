<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Arcade</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
body { font-family: -apple-system, system-ui, sans-serif; background:#0d1117; color:#e6edf3; padding:16px; }
header { max-width:1100px; margin:0 auto 20px; }
h1 { font-size:1.5rem; margin-bottom:4px; }
header p { color:#8b949e; font-size:.9rem; }
header a { color:#58a6ff; }
.grid { max-width:1100px; margin:0 auto; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
.card { background:#161b22; border:1px solid #30363d; border-radius:10px; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; transition:border-color .15s; }
.card:hover { border-color:#58a6ff; }
.shotwrap { position:relative; display:block; }
.card img { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top; background:#000; display:block; }
.card.landscape img { aspect-ratio:16/9; }
.playbtn { position:absolute; inset:0; display:grid; place-items:center; font-size:2.6rem; color:#fff; background:rgba(0,0,0,0); transition:background .15s; text-shadow:0 2px 12px rgba(0,0,0,.8); opacity:.85; }
.card:hover .playbtn { background:rgba(0,0,0,.25); opacity:1; }
.meta { padding:10px 12px 12px; position:relative; }
.rank { position:absolute; top:-14px; right:10px; background:#1f6feb; border-radius:12px; padding:2px 9px; font-size:.75rem; font-weight:700; }
.meta h2 { font-size:1.02rem; margin:0 0 4px; }
.meta p { font-size:.82rem; color:#8b949e; line-height:1.35; }
.orient { font-size:.7rem; color:#6e7681; margin-top:6px; display:inline-block; }
</style></head><body>
<header>
<h1>Launch Arcade</h1>
<p>Two games. Tap a screenshot to launch; best played on a phone.</p>
</header>
<div class="grid">
<a class="card landscape" href="/play/razorfin/">
<span class="shotwrap"><img loading="lazy" src="/play/_shots/razorfin.jpg" alt="Razorfin gameplay">
<span class="playbtn">&#9654;</span></span>
<div class="meta"><h2>Razorfin</h2>
<p>Shark action: eat, grow, unlock 61 sharks from reef pup to kaiju</p></div></a>
<a class="card portrait" href="/play/horde-meridian/">
<span class="shotwrap"><img loading="lazy" src="/play/_shots/horde-meridian.jpg" alt="Horde Meridian gameplay">
<span class="playbtn">&#9654;</span></span>
<div class="meta"><h2>Horde Meridian</h2>
<p>Auto-fire horde survival: draft upgrades, 10-minute runs</p></div></a>
</div>
</body></html>
