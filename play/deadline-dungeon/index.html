<!doctype html>
<html lang="en">
<head>
  <base href="/play/deadline-dungeon/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090c17">
  <meta name="description" content="Deadline Dungeon, a daily-seed room-clearing speedrun for GreenGuard USA.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Deadline Dungeon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090c17; }
    body { display: grid; place-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #game { width: 100%; height: 100%; min-width: 0; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { image-rendering: pixelated; }
  </style>
  <script>
    window.__dd = window.__dd || { state: { mode: 'menu', floor: 1, room: 1, keys: 0, time: 0, seed: 0, forceFloor: 0, forceMode: '' }, forceFloor: 0, forceMode: '' };
  </script>
</head>
<body>
  <div id="game" aria-label="Deadline Dungeon game"></div>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
