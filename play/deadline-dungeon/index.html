<!doctype html>
<html lang="en">
<head><base href="/play/deadline-dungeon/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#080c16">
  <title>Deadline Dungeon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080c16; }
    body { display: grid; place-items: center; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .game-shell { position: relative; width: min(100vw, 56.25vh); height: min(100vh, 177.7778vw); max-width: 420px; max-height: 746px; aspect-ratio: 9 / 16; overflow: hidden; background: #0d1322; box-shadow: 0 0 0 1px #25304a, 0 20px 80px #000b; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
    .rotate { display: none; position: absolute; inset: 0; z-index: 5; place-items: center; padding: 28px; text-align: center; background: #080c16e8; color: #eaf3ff; letter-spacing: .08em; font-size: 14px; font-weight: 800; }
    @media (orientation: landscape) and (max-height: 560px) { .rotate { display: grid; } }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Deadline Dungeon game">
    <canvas id="game" aria-label="Deadline Dungeon canvas"></canvas>
    <div class="rotate">PORTRAIT MODE<br><span style="font-size:11px;color:#96a4bf">TURN YOUR PHONE UPRIGHT</span></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
