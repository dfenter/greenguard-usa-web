<!doctype html>
<html lang="en">
<head><base href="/play/steamline/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>Steamline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:#0b1118;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#dbe6f0;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  #wrap{position:absolute;inset:0;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hud{position:absolute;left:0;right:0;pointer-events:none;z-index:5}
  #top{top:0;padding:8px 10px 0}
  #bar{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
  #score{font-size:26px;font-weight:800;letter-spacing:.5px;color:#f2f7fb;text-shadow:0 2px 6px #000}
  #best{font-size:11px;font-weight:700;color:#7f93a8;letter-spacing:1.2px}
  #combo{font-size:12px;font-weight:800;color:#67e8f9;opacity:0;transition:opacity .25s}
  #spacer{flex:1}
  #stat{font-size:11px;font-weight:700;color:#7f93a8;letter-spacing:1px;text-align:right;line-height:1.35}
  #tt{display:flex;gap:6px;margin-top:7px;align-items:center;height:26px}
  #ttlbl{font-size:9px;font-weight:800;letter-spacing:1.4px;color:#5d7186;margin-right:2px}
  .chip{display:flex;align-items:center;gap:5px;background:rgba(24,34,46,.85);border:1px solid #24313f;
    border-radius:7px;padding:3px 7px 3px 4px;font-size:11px;font-weight:700;color:#9fb2c4}
  .dot{width:11px;height:11px;border-radius:3px;box-shadow:0 0 6px currentColor}
  #hint{bottom:14px;text-align:center;font-size:12px;font-weight:600;color:#8fa4b8;
    text-shadow:0 2px 8px #000;transition:opacity .6s;padding:0 16px}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4}
  #over{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;background:rgba(7,11,16,.82);backdrop-filter:blur(3px)}
  #over.on{display:flex}
  #otitle{font-size:30px;font-weight:900;letter-spacing:2px;color:#ff6b6b;text-shadow:0 3px 14px #000}
  #osub{font-size:13px;color:#8fa4b8;font-weight:600;margin-bottom:8px}
  #oscore{font-size:56px;font-weight:900;color:#f2f7fb;line-height:1;font-variant-numeric:tabular-nums}
  #obest{font-size:13px;font-weight:700;color:#67e8f9;letter-spacing:1px}
  #btn{margin-top:20px;pointer-events:auto;border:1px solid #2c94a8;background:#123039;color:#a7f0fb;
    font:800 15px/1 inherit;letter-spacing:1.5px;padding:15px 30px;border-radius:12px}
  #btn:active{background:#1a4552}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="flash"></div>
  <div class="hud" id="top">
    <div id="bar">
      <div id="score">0</div><div id="combo">x1</div>
      <div id="spacer"></div>
      <div id="stat"></div>
    </div>
    <div id="tt"><div id="ttlbl">NEXT</div></div>
  </div>
  <div class="hud" id="hint">Tap junctions to route by colour &middot; tap a train to hold</div>
  <div id="over">
    <div id="otitle">COLLISION</div>
    <div id="osub">two trains met on the same rail</div>
    <div id="oscore">0</div>
    <div id="obest">BEST 0</div>
    <button id="btn">RUN AGAIN</button>
  </div>
</div>
<script src="rail.js"></script>
<script src="game.js"></script>
</body>
</html>
