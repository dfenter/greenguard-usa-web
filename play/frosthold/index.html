<!doctype html>
<html lang="en">
<head>
  <base href="/play/frosthold/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <meta name="description" content="Frosthold is a portrait frost-tower defense run through frozen waves.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Frosthold</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07131f; }
    body { display: grid; place-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { width: min(100vw, calc(100vh * .4621)); height: min(100vh, calc(100vw * 2.1641)); min-width: 1px; min-height: 1px; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <main id="game" aria-label="Frosthold frozen tower defense game"></main>
  <script src="/play/_shared/phaser.min.js"></script>
  <script src="/play/_shared/ggkit.js"></script>
  <script src="game.js"></script>
</body>
</html>
