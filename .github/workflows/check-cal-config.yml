name: Check Cal.com Configuration

on:
  workflow_dispatch:   # run manually from GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check cal.com event types and form fields
        env:
          CAL_API_KEY:       ${{ secrets.CAL_API_KEY }}
          EVENT_TYPE_CONFIG: ${{ secrets.EVENT_TYPE_CONFIG }}
        run: python3 _scripts/check_cal_config.py
