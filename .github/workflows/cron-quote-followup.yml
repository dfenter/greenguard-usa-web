name: Cron - Quote Follow-up

on:
  schedule:
    - cron: '0 14,21 * * *'  # 9 AM + 4 PM CT (14:00 + 21:00 UTC; CDT)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger quote follow-up scan
        run: |
          set -e
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            https://portal.greenguard-usa.com/api/cron/quote-followup \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$response" | grep HTTP_STATUS | cut -d: -f2)
          body=$(echo "$response" | grep -v HTTP_STATUS)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "❌ Quote follow-up scan failed"
            exit 1
          fi
