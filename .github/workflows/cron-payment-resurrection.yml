name: Cron - Payment Resurrection

on:
  schedule:
    - cron: '0 15 * * *'  # Daily 10:00 AM CT (15:00 UTC; CDT)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger resurrection scan
        run: |
          set -e
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            https://portal.greenguard-usa.com/api/cron/payment-resurrection \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$response" | grep HTTP_STATUS | cut -d: -f2)
          body=$(echo "$response" | grep -v HTTP_STATUS)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "❌ Resurrection scan failed"
            exit 1
          fi
