name: Cron - Annual Customer Review

on:
  schedule:
    - cron: '0 14 * * 1'   # Mondays 9am CT — gentle drip, no weekend surprises
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/annual-review
        run: |
          RESP=$(curl -sS -X POST "https://portal.greenguard-usa.com/api/cron/annual-review" \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            -w "\n%{http_code}")
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "HTTP $CODE"
          echo "$BODY"
          if [ "$CODE" != "200" ]; then exit 1; fi
