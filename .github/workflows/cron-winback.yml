name: Cron - Winback Campaign

on:
  # Schedule disabled 2026-05-24 — owner reports retention is already strong
  # and this script has a known KeyError bug. Re-enable by uncommenting the
  # schedule block below after fixing agent/winback.py.
  # schedule:
  #   - cron: '30 14 * * 1'  # Monday 9:30 AM CT (14:30 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ls agent/  # sanity check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r agent/requirements.txt

      - run: python agent/winback.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          CALENDAR_TIMEZONE: America/Chicago
