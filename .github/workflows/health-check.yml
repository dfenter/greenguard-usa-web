name: Health Check + Auto-Heal

on:
  schedule:
    - cron: '*/15 * * * *'   # Every 15 minutes
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check marketing site
        id: website
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://www.greenguard-usa.com")
          echo "http_status=$STATUS" >> $GITHUB_OUTPUT
          echo "Marketing site: HTTP $STATUS"

      - name: Auto-heal + alert if marketing site down
        if: steps.website.outputs.http_status != '200'
        run: |
          echo "⚠️ Marketing site returned ${{ steps.website.outputs.http_status }} — triggering redeploy..."
          curl -s -X POST "${{ secrets.VERCEL_SITE_DEPLOY_HOOK }}"

          # Send email alert via Resend
          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "alerts@greenguard-usa.com",
              "to": ["admin@greenguard-usa.com"],
              "subject": "🚨 GreenGuard site is DOWN — auto-healing",
              "html": "<p><strong>www.greenguard-usa.com returned HTTP ${{ steps.website.outputs.http_status }}</strong></p><p>A redeploy has been triggered automatically. The site should be back within 60 seconds.</p><p>If it is still down after 5 minutes, run: <code>./scripts/deploy.sh site</code></p>"
            }'
          echo "Alert email sent."

      - name: Check portal health
        id: portal
        run: |
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            --max-time 20 \
            "https://portal.greenguard-usa.com/api/health")
          echo "http_status=$STATUS" >> $GITHUB_OUTPUT
          cat /tmp/health.json | python3 -m json.tool || true
          echo "Portal: HTTP $STATUS"

      - name: Check portal login page
        id: login
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://portal.greenguard-usa.com/login")
          echo "http_status=$STATUS" >> $GITHUB_OUTPUT
          echo "Login page: HTTP $STATUS"

      - name: Alert if portal down
        if: steps.portal.outputs.http_status != '200' || steps.login.outputs.http_status != '200'
        run: |
          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "alerts@greenguard-usa.com",
              "to": ["admin@greenguard-usa.com"],
              "subject": "🚨 GreenGuard PORTAL is DOWN",
              "html": "<p><strong>portal.greenguard-usa.com is not responding.</strong></p><p>Portal: HTTP ${{ steps.portal.outputs.http_status }}<br>Login: HTTP ${{ steps.login.outputs.http_status }}</p><p>Check Render dashboard: <a href=\"https://dashboard.render.com\">dashboard.render.com</a></p>"
            }'
          echo "Portal alert email sent."

      - name: Final status
        run: |
          PORTAL="${{ steps.portal.outputs.http_status }}"
          LOGIN="${{ steps.login.outputs.http_status }}"
          WEBSITE="${{ steps.website.outputs.http_status }}"
          HEALTH=$(cat /tmp/health.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")

          echo "Site: $WEBSITE | Portal: $PORTAL | Login: $LOGIN | Health: $HEALTH"

          if [ "$PORTAL" != "200" ] || [ "$LOGIN" != "200" ]; then
            echo "::error::Portal down — Portal: $PORTAL, Login: $LOGIN"
            exit 1
          fi
          if [ "$HEALTH" = "degraded" ]; then
            echo "::warning::Portal health degraded"
            exit 1
          fi
          echo "✓ All checks passed."
