name: Auto-Bill Completed Appointments

on:
  schedule:
    - cron: '0 16 * * *'   # 10 AM CST / 11 AM CDT daily
  workflow_dispatch:        # manual trigger for testing from GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-bill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install stripe

      - name: Charge appointments from 3 days ago
        env:
          ACUITY_USER_ID:    ${{ secrets.ACUITY_USER_ID }}
          ACUITY_API_KEY:    ${{ secrets.ACUITY_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: python3 _scripts/auto_bill.py
