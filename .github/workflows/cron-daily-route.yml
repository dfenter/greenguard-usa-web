name: Cron - Daily Route

on:
  schedule:
    - cron: '30 12 * * 1-6'  # Mon-Sat 7:30 AM CT (12:30 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r agent/requirements.txt

      - run: python agent/daily_route.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CALENDAR_TIMEZONE: America/Chicago
          DEPOT_ADDRESS: '1519 Parkway Austin TX 78703'
          ROUTE_EMAIL: admin@greenguard-usa.com
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
