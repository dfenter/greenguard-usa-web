name: Fetch Google Reviews

on:
  schedule:
    - cron: '0 9 * * *'   # 3 AM CST daily
  workflow_dispatch:        # manual trigger from GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch reviews from Google Places API
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python3 _scripts/fetch_reviews.py

      - name: Commit updated reviews
        run: |
          git config user.name "GreenGuard Bot"
          git config user.email "bot@greenguard-usa.com"
          git add reviews.json
          git diff --staged --quiet || git commit -m "chore: update Google reviews [skip ci]"
          git push
