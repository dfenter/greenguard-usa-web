name: Cron - Books Ingest

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min — Stripe ledger sync
  workflow_dispatch:
    inputs:
      days:
        description: 'Backfill window (days)'
        required: false
        default: '7'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/books-ingest
        run: |
          DAYS="${{ inputs.days || '7' }}"
          RESP=$(curl -sS -X POST "https://portal.greenguard-usa.com/api/cron/books-ingest?days=$DAYS" \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" -w "\n%{http_code}")
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "HTTP $CODE"; echo "$BODY"
          [ "$CODE" = "200" ] || exit 1
