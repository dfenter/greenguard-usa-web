name = "greenguard-cron-portal"
main = "src/index.js"
compatibility_date = "2026-05-01"

# 4 cron triggers — fits Workers Free plan.
# All targets are portal HTTP endpoints on Vercel.

[triggers]
crons = [
  "0 11 * * *",       # 06:00 CT — billing-warn (T-1)
  "0 12 * * *",       # 07:00 CT — billing-run finalize + books-daily
  "0 11 1 * *",       # 06:00 CT 1st of month — books-close
  "0 * * * *",        # hourly — acuity-leak
]

# Secrets: wrangler secret put CRON_SECRET
