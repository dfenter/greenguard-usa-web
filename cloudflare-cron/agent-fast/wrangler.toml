name = "greenguard-cron-agent-fast"
main = "src/index.js"
compatibility_date = "2026-05-01"

# 3 cron triggers — fits Workers Free plan (max 3).
# email-agent moved to once daily at 8am CT (13:00 UTC) — no longer geocodes,
# no need for frequent polling. books-ingest + site-health stay at 15-min.

[triggers]
crons = [
  "0 13 * * *",       # 8am CT daily — email-agent (Render)
  "*/5 * * * *",      # every 5 min — keep-alive ping to Render (prevents free-tier spin-down)
  "*/15 * * * *",     # every 15 min — books-ingest (Vercel) + site-health (inline)
]

# Secrets:
#   wrangler secret put CRON_SECRET             — for both agent + portal targets
#   wrangler secret put RESEND_API_KEY          — site-health alert email
#   wrangler secret put VERCEL_SITE_DEPLOY_HOOK — marketing-site redeploy hook
