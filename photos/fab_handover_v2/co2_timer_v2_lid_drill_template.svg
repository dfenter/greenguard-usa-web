<?xml version="1.0" encoding="UTF-8"?>
<!--
  GreenGuard CO2 Trap Timer v2 — Lid Drill Template
  Print at 100% scale (NO scaling). Verify 100×68 mm outer rectangle before drilling.
  Coordinates in mm from top-left corner of lid face.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="100mm" height="68mm"
     viewBox="0 0 100 68">

  <style>
    text { font-family: Arial, sans-serif; }
  </style>

  <!-- Background / border -->
  <rect x="0" y="0" width="100" height="68" fill="white" stroke="#999" stroke-width="0.3" stroke-dasharray="2,1"/>

  <!-- Cut lines label -->
  <text x="1" y="3.5" font-size="2.2" fill="#999">GreenGuard CO2 Timer v2 — LID DRILL TEMPLATE — Print at 100% — Verify 100×68 mm before drilling</text>

  <!-- ── Display window (38×12 mm rect, origin at top-left of cutout) ── -->
  <!-- Position: X=18, Y=10 from lid top-left -->
  <rect x="18" y="10" width="38" height="12"
        fill="none" stroke="#1b5e20" stroke-width="0.5"/>
  <!-- Corner marks for milling -->
  <line x1="16" y1="10" x2="20" y2="10" stroke="#1b5e20" stroke-width="0.3"/>
  <line x1="18" y1="8"  x2="18" y2="12" stroke="#1b5e20" stroke-width="0.3"/>
  <line x1="54" y1="10" x2="58" y2="10" stroke="#1b5e20" stroke-width="0.3"/>
  <line x1="56" y1="8"  x2="56" y2="12" stroke="#1b5e20" stroke-width="0.3"/>
  <line x1="16" y1="22" x2="20" y2="22" stroke="#1b5e20" stroke-width="0.3"/>
  <line x1="18" y1="20" x2="18" y2="24" stroke="#1b5e20" stroke-width="0.3"/>
  <line x1="54" y1="22" x2="58" y2="22" stroke="#1b5e20" stroke-width="0.3"/>
  <line x1="56" y1="20" x2="56" y2="24" stroke="#1b5e20" stroke-width="0.3"/>

  <text x="28" y="17.5" font-size="2.5" fill="#1b5e20" text-anchor="middle">DISPLAY WINDOW</text>
  <text x="37" y="20.5" font-size="2" fill="#555" text-anchor="middle">38 × 12 mm — mill/file to rectangle</text>

  <!-- Dimension annotation -->
  <text x="18" y="8.5" font-size="1.8" fill="#555">X=18</text>
  <text x="0.5" y="17" font-size="1.8" fill="#555">Y=10</text>

  <!-- ── SW1 — UP button — 6 mm dia, center at (33, 40) ── -->
  <circle cx="33" cy="40" r="3" fill="none" stroke="#1b5e20" stroke-width="0.5"/>
  <!-- Center cross -->
  <line x1="31" y1="40" x2="35" y2="40" stroke="#1b5e20" stroke-width="0.3"/>
  <line x1="33" y1="38" x2="33" y2="42" stroke="#1b5e20" stroke-width="0.3"/>
  <text x="33" y="46.5" font-size="2.2" fill="#1b5e20" text-anchor="middle">SW1 UP</text>
  <text x="33" y="49"   font-size="1.8" fill="#555" text-anchor="middle">6 mm dia</text>
  <text x="33" y="51"   font-size="1.8" fill="#555" text-anchor="middle">(33, 40)</text>

  <!-- ── SW2 — SET button — 6 mm dia, center at (55, 40) ── -->
  <circle cx="55" cy="40" r="3" fill="none" stroke="#1b5e20" stroke-width="0.5"/>
  <line x1="53" y1="40" x2="57" y2="40" stroke="#1b5e20" stroke-width="0.3"/>
  <line x1="55" y1="38" x2="55" y2="42" stroke="#1b5e20" stroke-width="0.3"/>
  <text x="55" y="46.5" font-size="2.2" fill="#1b5e20" text-anchor="middle">SW2 SET</text>
  <text x="55" y="49"   font-size="1.8" fill="#555" text-anchor="middle">6 mm dia</text>
  <text x="55" y="51"   font-size="1.8" fill="#555" text-anchor="middle">(55, 40)</text>

  <!-- Dimension guide lines (light) -->
  <!-- Horizontal: Y=40 -->
  <line x1="1" y1="40" x2="30" y2="40" stroke="#ccc" stroke-width="0.2" stroke-dasharray="1,1"/>
  <text x="1" y="39.5" font-size="1.8" fill="#999">Y=40</text>

  <!-- Verification box: 100×68 mm label corners -->
  <text x="1" y="67" font-size="2" fill="#999">0,0</text>
  <text x="85" y="67" font-size="2" fill="#999">100,68</text>

  <!-- Scale verification bar: 50 mm -->
  <line x1="5" y1="64" x2="55" y2="64" stroke="#333" stroke-width="0.5"/>
  <line x1="5" y1="62.5" x2="5" y2="65.5" stroke="#333" stroke-width="0.5"/>
  <line x1="55" y1="62.5" x2="55" y2="65.5" stroke="#333" stroke-width="0.5"/>
  <text x="30" y="63" font-size="2" fill="#333" text-anchor="middle">50 mm — verify before drilling</text>

</svg>
