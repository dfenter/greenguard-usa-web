<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // Resolve relative asset paths (js/, manifest.json) to THIS page's folder.
  // Vercel serves clean URLs without a trailing slash (e.g. /zelda), so a bare
  // "js/engine.js" would otherwise resolve to /js/engine.js (404 -> nothing loads).
  // Add a <base> only when the URL has no trailing slash and isn't a file path,
  // so local file:// opens and root-served copies keep working unchanged.
  (function () {
    var path = location.pathname;
    if (!/\/$/.test(path) && !/\.[a-z0-9]+$/i.test(path)) {
      document.write('<base href="' + path + '/">');
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>The Legend of Zelda — Clone</title>
<script>
  // Self-heal: a stale service worker may still be serving old cached JS.
  // If this page is SW-controlled, purge every SW + cache and reload once.
  (function () {
    if (!('serviceWorker' in navigator)) return;
    if (!navigator.serviceWorker.controller) return;        // not SW-controlled → nothing to do
    if (sessionStorage.getItem('sw_purged')) return;        // already healed this session → avoid loop
    sessionStorage.setItem('sw_purged', '1');
    var jobs = [navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    })];
    if (window.caches) jobs.push(caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
    }));
    Promise.all(jobs).then(function () { location.reload(); })
                     .catch(function () { location.reload(); });
  })();
</script>
<style>
  :root{
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --safe-right:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:'Courier New',monospace;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
    box-shadow:0 0 0 2px #444, 0 0 40px #000;touch-action:none;display:block;}
  #hint{position:fixed;bottom:calc(2px + var(--safe-bottom));left:0;right:0;
    text-align:center;color:#666;font-size:12px;pointer-events:none;}

  /* Portrait phone: pin the canvas to the top, controls own the bottom band. */
  body.portrait-touch #wrap{align-items:flex-start;
    padding-top:calc(8px + var(--safe-top));}
  body.portrait-touch #hint{display:none;}

  /* ---------- on-screen controller ---------- */
  #touch-ui{display:none;position:fixed;inset:0;pointer-events:none;z-index:50;}
  @media (pointer:coarse){#touch-ui{display:block;}}

  /* D-pad — bottom-left, large thumb target */
  #dpad{position:fixed;left:calc(20px + var(--safe-left));
    bottom:calc(26px + var(--safe-bottom));
    width:42vw;max-width:200px;height:42vw;max-height:200px;
    pointer-events:auto;touch-action:none;opacity:0.85;}
  #dpad .cross{position:absolute;inset:0;}
  #dpad .bar{position:absolute;background:#2b2b2b;border:2px solid #555;border-radius:10px;}
  #dpad .bar.h{left:0;right:0;top:33.3%;bottom:33.3%;}
  #dpad .bar.v{top:0;bottom:0;left:33.3%;right:33.3%;}
  #dpad .hub{position:absolute;left:33.3%;top:33.3%;width:33.4%;height:33.4%;
    background:#3a3a3a;}
  #dpad .ar{position:absolute;color:#cfcfcf;font-size:6vw;line-height:1;
    display:flex;align-items:center;justify-content:center;}
  #dpad .ar.up{top:3%;left:33.3%;width:33.4%;height:30%;}
  #dpad .ar.dn{bottom:3%;left:33.3%;width:33.4%;height:30%;}
  #dpad .ar.lt{left:3%;top:33.3%;width:30%;height:33.4%;}
  #dpad .ar.rt{right:3%;top:33.3%;width:30%;height:33.4%;}
  #dpad.active .bar{border-color:#9a9a9a;background:#383838;}

  /* A / B action buttons — bottom-right */
  .btn-group{position:fixed;right:calc(18px + var(--safe-right));
    bottom:calc(30px + var(--safe-bottom));
    display:flex;align-items:flex-end;gap:18px;pointer-events:none;}
  .gbtn{width:19vw;max-width:90px;height:19vw;max-height:90px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:5vw;font-weight:bold;pointer-events:auto;
    touch-action:none;opacity:0.9;border:3px solid rgba(255,255,255,0.25);}
  .gbtn.b{background:#9a1414;margin-bottom:34px;}
  .gbtn.a{background:#137a13;}
  .gbtn.active{filter:brightness(1.6);transform:scale(0.94);}

  /* START / SELECT — small pills, top-center area */
  .sys-group{position:fixed;left:50%;transform:translateX(-50%);
    top:calc(6px + var(--safe-top));display:flex;gap:14px;pointer-events:none;z-index:60;}
  .sysbtn{background:#2a2a2a;color:#ddd;font-size:11px;font-weight:bold;
    letter-spacing:1px;padding:7px 14px;border-radius:14px;
    border:2px solid rgba(255,255,255,0.2);pointer-events:auto;touch-action:none;opacity:0.8;}
  .sysbtn.active{filter:brightness(1.7);}
  /* In portrait, float START/SELECT in the empty band just under the playfield
     so they never crowd the d-pad or action buttons. */
  body.portrait-touch .sys-group{top:auto;bottom:38vh;}
</style>
</head>
<body>
<div id="dbg" style="position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;font:11px monospace;padding:3px 6px;z-index:9999;display:none;word-break:break-all;"></div>
<div id="wrap"><canvas id="screen"></canvas></div>
<div id="hint">Arrows/WASD move &nbsp;·&nbsp; Z = sword &nbsp;·&nbsp; X = bomb &nbsp;·&nbsp; Enter = start &nbsp;·&nbsp; Shift = select &nbsp;·&nbsp; M = mute</div>

<div id="touch-ui">
  <div id="dpad">
    <div class="cross">
      <div class="bar h"></div><div class="bar v"></div><div class="hub"></div>
      <div class="ar up">▲</div><div class="ar dn">▼</div>
      <div class="ar lt">◀</div><div class="ar rt">▶</div>
    </div>
  </div>
  <div class="sys-group">
    <div id="btn-select" class="sysbtn">SELECT</div>
    <div id="btn-start" class="sysbtn">START</div>
  </div>
  <div class="btn-group">
    <div id="btn-b" class="gbtn b">B</div>
    <div id="btn-a" class="gbtn a">A</div>
  </div>
</div>

<script>
  function dbg(msg) {
    var d = document.getElementById('dbg');
    if (d) { d.style.display = 'block'; d.textContent = msg; }
  }
  window.onerror = function(msg, src, line) {
    dbg('ERR: ' + msg + ' ' + (src||'') + ':' + line);
    var c = document.getElementById('screen');
    if (!c) return;
    var x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0,0,256,240);
    x.fillStyle = '#f00'; x.font = '8px monospace'; x.textBaseline = 'top';
    x.fillText('ERROR:', 4, 4);
    x.fillStyle = '#fff';
    var words = (msg + ' ' + (src||'') + ':' + line).split(' ');
    var line2 = '', y = 16;
    for (var i=0; i<words.length; i++) {
      if ((line2+' '+words[i]).length > 30) { x.fillText(line2, 4, y); y+=10; line2=words[i]; }
      else line2=(line2?line2+' ':'')+words[i];
    }
    if (line2) x.fillText(line2, 4, y);
  };
  dbg('loading scripts...');
</script>
<script src="js/engine.js?v=13"></script><script>dbg('engine ok');</script>
<script src="js/sound.js?v=13"></script><script>dbg('sound ok');</script>
<script src="js/sprites.js?v=13"></script><script>dbg('sprites ok');</script>
<script src="js/tiles.js?v=13"></script><script>dbg('tiles ok');</script>
<script src="js/world.js?v=13"></script><script>dbg('world ok');</script>
<script src="js/dungeon.js?v=13"></script><script>dbg('dungeon ok');</script>
<script src="js/entities.js?v=13"></script><script>dbg('entities ok');</script>
<script src="js/game.js?v=13"></script>
</body>
</html>
